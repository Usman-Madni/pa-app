// ===================== Phone reminders (Microsoft To Do) =====================
// Every open task is copied to a "PA App" list in the user's Microsoft To Do, whose phone app does the notifying
// (and passes it on to the phone's own reminder app), even with this computer off. Only edit devices sync.
// Sign-in: OAuth code flow with PKCE in a pop-up, no library. Tokens stay on this device (dev_msAuth), never in
// the data file. A synced task keeps t.todo = {id, base}: its To Do task and how both sides looked after the last
// sync (TD.fields), so a field that differs from base was changed on that side. Changes made in To Do (ticks,
// edits) come back here; a field changed on both sides keeps this app's version. Tasks added to the list in To Do
// come in as new tasks. {removed: true} = deleted in To Do; it stays here and isn't sent again.
const utcStamp = (ms) => { const d = new Date(ms); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:00`; };
// A Graph date {dateTime: '2026-10-29T19:00:00.0000000', timeZone: 'UTC'} as an exact moment (ms), or null.
const graphMs = (d) => {
  if (!d || !d.dateTime) return null;
  const ms = Date.parse(d.dateTime.slice(0, 19) + (/^utc$/i.test(d.timeZone || 'UTC') ? 'Z' : ''));
  return Number.isNaN(ms) ? null : ms;
};
const shortHash = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
const b64url = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

const TD = {
  CLIENT_ID: '011c6ecd-2984-4293-a6be-c83ebba20855', // not a secret; only works from the addresses registered in Azure
  AUTH: 'https://login.microsoftonline.com/consumers/oauth2/v2.0',
  GRAPH: 'https://graph.microsoft.com/v1.0',
  SCOPE: 'Tasks.ReadWrite offline_access',
  LIST_NAME: 'PA App',
  APP_NAME: 'PA App',   // linkedResources.applicationName — marks the To Do tasks this app made
  SYNC_MS: 5 * 60000,   // while open
  SOON_MS: 5000,        // after a change
  MASS: 10,             // never remove more than this many at once (and over half the list) without a person checking
  busy: false,
  again: false,
  timer: null,
  error: '',

  // Azure won't accept "PA%20App.html" as a sign-in return address, so Microsoft returns to the folder instead.
  redirectUri() { return new URL('./', location.href.split('?')[0]).href; },
  AUTH_KEY: 'msAuth',   // where this sign-in's tokens are kept on the device (the phone's OneDrive one has its own)
  CONNECTED_NOTE: 'Connected to Microsoft To Do',
  auth() { return device.get(this.AUTH_KEY, null); },
  afterSignIn() { this.sync(); },
  connected() { return !!this.auth(); },
  needsSignIn() { const a = this.auth(); return !!a && !a.refresh && !(a.access && a.exp > Date.now()); },
  waitingForFile() { return !!DF.handle && DF.status !== 'ok'; }, // syncing waits until the data file is reconnected or decided

  async signIn() {
    // Open the pop-up straight from the click, or the browser blocks it; it's pointed at Microsoft a moment later.
    const popup = window.open('', 'pa-ms-signin', 'width=480,height=640');
    if (!popup) { toast('The sign-in pop-up was blocked — allow pop-ups for this site and try again'); return; }
    try {
      const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
      const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
      const check = uid();
      const q = new URLSearchParams({
        client_id: this.CLIENT_ID, response_type: 'code', redirect_uri: this.redirectUri(), scope: this.SCOPE,
        code_challenge: challenge, code_challenge_method: 'S256', state: check, prompt: 'select_account',
      });
      popup.location.href = `${this.AUTH}/authorize?${q}`;
      const back = await this.waitForPopup(popup);
      if (back.get('error')) throw new Error(back.get('error_description') || back.get('error'));
      if (back.get('state') !== check) throw new Error('The sign-in answer didn\'t match — try again');
      await this.token({ grant_type: 'authorization_code', code: back.get('code'), redirect_uri: this.redirectUri(), code_verifier: verifier });
      this.error = '';
      toast(this.CONNECTED_NOTE);
      this.afterSignIn();
    } catch (e) {
      this.error = e.message;
      try { popup.close(); } catch { /* already closed */ }
    }
    render();
  },
  // Microsoft sends the pop-up back to our own site with ?code=…. Two ways to get it: index.html there hands it back
  // with a message (needed on phones, where this tab is paused meanwhile), and we also watch the pop-up's address.
  waitForPopup(popup) {
    return new Promise((resolve, reject) => {
      let done = false;
      const finish = (p) => {
        if (done) return;
        done = true;
        clearInterval(iv);
        removeEventListener('message', onMessage);
        try { popup.close(); } catch { /* closed already */ }
        if (p) resolve(p); else reject(new Error('The sign-in window was closed'));
      };
      const onMessage = (e) => {
        if (e.origin !== location.origin || !e.data || typeof e.data.paSignIn !== 'string') return; // only our own page
        const p = new URLSearchParams(e.data.paSignIn);
        if (p.has('code') || p.has('error')) finish(p);
      };
      addEventListener('message', onMessage);
      const iv = setInterval(() => {
        // Closed: its message may still be on the way (a paused tab gets both at once), so wait a moment for it.
        if (popup.closed) { clearInterval(iv); setTimeout(() => finish(null), 1000); return; }
        let href = '';
        try { href = popup.location.href; } catch { return; } // still on Microsoft's site
        if (!href || !href.startsWith(this.redirectUri())) return;
        const p = new URL(href).searchParams;
        if (p.has('code') || p.has('error')) finish(p);
      }, 250);
    });
  },
  async token(params) {
    const res = await fetch(`${this.AUTH}/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ client_id: this.CLIENT_ID, scope: this.SCOPE, ...params }).toString(),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.access_token) throw new Error(j.error_description ? j.error_description.split('\n')[0] : 'Microsoft sign-in failed');
    const old = this.auth() || {};
    // scope: what Microsoft granted (e.g. whether the phone's sign-in includes To Do)
    device.set(this.AUTH_KEY, { access: j.access_token, exp: Date.now() + (j.expires_in || 3600) * 1000, refresh: j.refresh_token || old.refresh || '', scope: j.scope || old.scope || '' });
  },
  async accessToken() {
    const a = this.auth();
    if (!a) throw new Error('Not connected');
    if (a.access && a.exp - 60000 > Date.now()) return a.access;
    if (a.refresh) {
      try { await this.token({ grant_type: 'refresh_token', refresh_token: a.refresh }); return this.auth().access; } catch { /* it lasts about a day */ }
    }
    device.set(this.AUTH_KEY, { access: '', exp: 0, refresh: '', scope: a.scope || '' });
    throw Object.assign(new Error('Sign in to Microsoft again'), { signin: true });
  },
  async graph(method, path, body, headers = {}) { // headers: e.g. If-Match, so a save only lands on the version read
    const url = path.startsWith('https://') ? path : this.GRAPH + path;
    const raw = body instanceof Blob; // a file being uploaded goes as it is
    const send = async () => fetch(url, {
      method,
      headers: { Authorization: `Bearer ${await this.accessToken()}`, ...(body ? { 'Content-Type': raw ? body.type || 'application/octet-stream' : 'application/json' } : {}), ...headers },
      body: raw ? body : body ? JSON.stringify(body) : undefined,
    });
    let res = await send();
    if (res.status === 401) { const a = this.auth(); if (a) device.set(this.AUTH_KEY, { ...a, exp: 0 }); res = await send(); }
    // Everything was reloaded (a newer data file) while we waited: this sync's tasks are old copies. Stop; it runs again.
    if (this.busy && this.syncLoads !== DB.loads) throw Object.assign(new Error('Reloaded during the sync'), { reloaded: true });
    if (res.status === 204) return null;
    const j = await res.json().catch(() => null);
    if (!res.ok) throw Object.assign(new Error((j && j.error && j.error.message) || `To Do answered ${res.status}`), { status: res.status });
    return j;
  },

  // What a task looks like in To Do.
  payload(t) {
    const next = t.done ? null : Reminders.next(t); // To Do allows one: the next still to come; once it goes off, the one after
    return {
      title: fullTitle(t),
      body: { content: t.notes || '', contentType: 'text' },
      importance: t.priority === 'high' ? 'high' : 'normal',
      status: t.done ? 'completed' : 'notStarted',
      // To Do due dates have no time. Noon UTC is the same calendar day here (and almost everywhere).
      dueDateTime: t.due ? { dateTime: `${taskDate(t)}T12:00:00`, timeZone: 'UTC' } : null,
      isReminderOn: next != null,
      ...(next != null ? { reminderDateTime: { dateTime: utcStamp(next), timeZone: 'UTC' } } : {}),
    };
  },
  async listId() {
    const cached = device.get('todoList', '');
    if (cached) return cached;
    const j = await this.graph('GET', '/me/todo/lists');
    const found = (j.value || []).find((l) => l.displayName === this.LIST_NAME);
    const id = found ? found.id : (await this.graph('POST', '/me/todo/lists', { displayName: this.LIST_NAME })).id;
    device.set('todoList', id);
    return id;
  },
  async remoteTasks(list) {
    const all = new Map();
    let url = `/me/todo/lists/${list}/tasks?$top=100&$expand=linkedResources`;
    while (url) {
      const j = await this.graph('GET', url);
      for (const x of j.value || []) all.set(x.id, x);
      url = j['@odata.nextLink'] || '';
    }
    return all;
  },
  ourId(x) { const l = (x.linkedResources || []).find((r) => r.applicationName === this.APP_NAME); return l ? l.externalId : ''; },
  link(t) { return { applicationName: this.APP_NAME, displayName: 'PA App', externalId: t.id, webUrl: location.href.split('?')[0] }; },
  // Notes as plain text. To Do may answer in HTML; DOMParser reads it without running or loading anything.
  plain(body) {
    let s = (body && body.content) || '';
    if (body && body.contentType === 'html') {
      s = new DOMParser().parseFromString(s.replace(/<br\s*\/?>|<\/p>|<\/div>/gi, '\n'), 'text/html').body.textContent || '';
    }
    return s.replace(/\r\n?/g, '\n').trim();
  },
  // What both sides are compared on — the same for what we send (payload) and what To Do has.
  fields(x) {
    const due = graphMs(x.dueDateTime);
    // A reminder whose time has passed has gone off: To Do keeps it switched on, but it's no longer one to compare.
    const on = x.isReminderOn ? graphMs(x.reminderDateTime) : null;
    const rem = on != null && on > Date.now() ? on : null;
    return {
      title: (x.title || '').trim(),
      notes: shortHash(this.plain(x.body)),
      imp: x.importance === 'high' ? 'high' : 'normal',
      done: x.status === 'completed',
      due: due == null ? '' : toISO(new Date(due)), // our noon UTC, or the phone's local midnight: the same day here
      rem: rem == null ? '' : String(Math.round(rem / 60000)), // to the minute
    };
  },
  same(a, b) { return !!a && !!b && Object.keys(a).every((k) => a[k] === b[k]); },
  // Bring the fields changed in To Do (`take`) into the task. `was` = how they looked after the last sync.
  apply(t, x, take, was) {
    const there = this.fields(x);
    if (take.includes('title') && there.title) {
      const m = t.period ? there.title.match(/^(.*\S)\s*\(([^()]+)\)$/) : null; // "Phone bill (Oct 26)" = title + moving part
      say(TaskEdit.rename(t, m ? m[1] : there.title, t.period ? (m ? m[2] : '') : undefined));
    }
    if (take.includes('notes')) t.notes = this.plain(x.body);
    if (take.includes('imp')) t.priority = there.imp === 'high' ? 'high' : 'med';
    if (take.includes('due')) TaskEdit.setDue(t, there.due); // To Do has no time: ours is kept. Refused (a repeat's date removed there) → ours is sent back
    if (take.includes('rem')) Reminders.fromToDo(t, was.rem ? Number(was.rem) * 60000 : null, there.rem ? Number(there.rem) * 60000 : null);
    if (take.includes('done')) {
      if (there.done && !t.done) {
        // To Do gives the day it was done; ticked today counts as now, an earlier day as that day.
        const at = graphMs(x.completedDateTime);
        const earlier = at != null && toISO(new Date(at)) < todayISO();
        say(Series.tick(t, earlier ? new Date(`${toISO(new Date(at))}T12:00`) : new Date(), earlier));
      } else if (!there.done && t.done) say(Series.untick(t)); // nobody to ask here: a changed next copy stays
    }
  },
  // To Do's repeat (Graph patternedRecurrence) as ours, or null if it's a kind we don't have.
  repeatFrom(rec) {
    const p = (rec && rec.pattern) || {}, rg = (rec && rec.range) || {};
    const interval = Math.max(1, Number(p.interval) || 1);
    let r;
    if (p.type === 'daily') r = { freq: 'daily', interval };
    else if (p.type === 'weekly') {
      const days = (p.daysOfWeek || []).map((d) => WEEKDAYS.findIndex((w) => w.toLowerCase() === String(d).toLowerCase())).filter((i) => i >= 0).sort();
      r = interval === 1 && days.join() === '1,2,3,4,5' ? { freq: 'weekdays', interval: 1 } : { freq: 'weekly', interval, days };
    } else if (p.type === 'absoluteMonthly' || p.type === 'relativeMonthly') r = { freq: 'monthly', interval, monthMode: p.type === 'relativeMonthly' ? 'weekday' : 'date' };
    else if (p.type === 'absoluteYearly' || p.type === 'relativeYearly') r = { freq: 'yearly', interval };
    else return null;
    if (rg.type === 'endDate' && rg.endDate) Object.assign(r, { endMode: 'date', until: String(rg.endDate).slice(0, 10) });
    if (rg.type === 'numbered' && rg.numberOfOccurrences) Object.assign(r, { endMode: 'count', count: Number(rg.numberOfOccurrences) });
    return r;
  },
  // A repeat set in To Do becomes this task's repeat and is taken off the To Do copy, so only this app makes the
  // next copies (both making them would give two). A done task only has it taken off.
  async takeRepeat(t, x, list) {
    const r = t.done ? null : this.repeatFrom(x.recurrence);
    if (r) TaskEdit.setRepeat(t, r); // its notes aren't shown: the sync says "N changes from To Do"
    await this.graph('PATCH', `/me/todo/lists/${list}/tasks/${x.id}`, { recurrence: null });
    x.recurrence = null;
  },
  // A task added to the list in To Do: make it here and mark it as ours, so it's kept in step from now on.
  // A task added in To Do gets an id made from its To Do id: if both devices bring it in before seeing each other's,
  // they make the same task, and merging keeps one.
  adoptId(x) { return `todo-${shortHash(x.id)}${shortHash(`${x.id}~`)}`; },
  async adopt(x, list) {
    const id = this.adoptId(x);
    const there = this.fields(x);
    const ms = there.rem ? Number(there.rem) * 60000 : null;
    const had = DB.tasks.find((t) => t.id === id);
    if (had || DB.deleted.some((m) => m.key === 'tasks' && m.id === id)) { // brought in already (or deleted since) on the other device
      if (had && !had.todo) had.todo = { id: x.id };
      if (had) await this.mark(x, had, list);
      return had || null;
    }
    const t = normalizeTask({
      id, title: there.title || 'Untitled', notes: this.plain(x.body), priority: there.imp === 'high' ? 'high' : 'low',
      due: there.due ? `${there.due}T${ALL_DAY}` : '', created: Date.parse(x.createdDateTime) || Date.now(),
      reminders: ms != null ? [Reminders.exact(ms)] : [],
    });
    t.todo = { id: x.id };
    DB.tasks.push(t);
    await this.mark(x, t, list);
    if (x.recurrence) await this.takeRepeat(t, x, list);
    DB.persist('tasks');
    return t;
  },
  async mark(x, t, list) {
    await this.graph('POST', `/me/todo/lists/${list}/tasks/${x.id}/linkedResources`, this.link(t));
    x.linkedResources = [...(x.linkedResources || []), this.link(t)];
  },

  // ----- Deciding (changes nothing, talks to nothing: tasks here + To Do's tasks in, a plan out) -----
  // What comes in from To Do. gone: linked tasks no longer there (deleted on the phone). take: tasks with fields changed
  // there and not here since the last sync, or a repeat set there. fresh: tasks added to the list there. error: refused.
  decideIn(tasks, remote) {
    const gone = tasks.filter((t) => t.todo && t.todo.id && !remote.has(t.todo.id));
    const linkedCount = tasks.filter((t) => t.todo && t.todo.id).length;
    // Tasks deleted in To Do stay here and aren't sent again — unless it's most of them, which smells of a mistake.
    if (gone.length > this.MASS && gone.length > linkedCount / 2) {
      return { gone: [], take: [], fresh: [], error: `${gone.length} tasks are missing from the To Do list — nothing was changed. Check the "${this.LIST_NAME}" list in To Do.` };
    }
    const take = [];
    for (const t of tasks) {
      if (!t.todo || !t.todo.id || !remote.has(t.todo.id)) continue;
      const x = remote.get(t.todo.id);
      const there = this.fields(x);
      const here = this.fields(this.payload(t));
      // Linked before changes came back (only a fingerprint kept): unchanged here means To Do's differences are new.
      const was = t.todo.base || (t.todo.sig && t.todo.sig === shortHash(JSON.stringify(this.payload(t))) ? here : there);
      // A field changed on both sides since the last sync keeps this app's version, which is then sent.
      const fields = Object.keys(there).filter((k) => there[k] !== was[k] && here[k] === was[k]);
      if (fields.length || x.recurrence) take.push({ t, x, take: fields, was, there });
    }
    // Added to the list in To Do: not made by this app, not linked to a task here, not already done.
    const linked = new Set(tasks.filter((t) => t.todo && t.todo.id).map((t) => t.todo.id));
    const fresh = [...remote.values()].filter((x) => !this.ourId(x) && !linked.has(x.id) && x.status !== 'completed');
    return { gone, take, fresh, error: '' };
  },
  // What goes out. send: per task, create it (no id), use a lost link again (relink), put back a lost PA App mark,
  // update it (patch), and/or record how both sides now look (rebase). remove: To Do tasks this app made whose task is
  // gone here. error: refused.
  // deletedIds: tasks deleted here (their 30-day markers). Both devices sync the same list, so a To Do task made for a
  // task this device doesn't know (the other device's, its save still on the way) is never removed.
  decideOut(tasks, remote, deletedIds = []) {
    const known = new Set([...tasks.map((t) => t.id), ...deletedIds]);
    const byOurId = new Map([...remote.values()].filter((x) => this.ourId(x)).map((x) => [this.ourId(x), x]));
    const send = [];
    const keep = new Set();
    for (const t of tasks) {
      if (t.todo && t.todo.removed) continue;
      if (!t.todo && t.done) continue; // only open tasks go; a done one only finishes off its phone copy
      const body = this.payload(t);
      const here = this.fields(body);
      const had = !t.todo && byOurId.get(t.id); // sent before, but the link was lost: use that one, never a second copy
      const id = t.todo ? t.todo.id : had ? had.id : '';
      if (!id) { send.push({ t, body, here }); continue; }
      keep.add(id);
      const x = remote.get(id);
      const base = had ? null : t.todo.base;
      send.push({
        t, id, x, body, here, relink: !!had,
        mark: !!x && !this.ourId(x), // lost its mark: without it, deleting here couldn't reach it
        patch: !x || !this.same(this.fields(x), here),
        rebase: !this.same(base, here),
      });
    }
    // Deleted here: delete the phone copy too (only tasks this app made; ones added on the phone are left alone).
    for (const t of tasks) if (t.todo && t.todo.id) keep.add(t.todo.id);
    const remove = [...remote.values()].filter((x) => this.ourId(x) && !keep.has(x.id) && known.has(this.ourId(x)));
    if (remove.length > this.MASS && remove.length > remote.size / 2) {
      return { send, remove: [], error: `Not removing ${remove.length} tasks from To Do at once — check that your tasks look right here.` };
    }
    return { send, remove, error: '' };
  },

  // Tasks were edited. During a sync the edit may have missed it, so another runs straight after; the sync's own
  // saves (ownSave) don't count.
  ownSave: false,
  tasksChanged() {
    if (this.ownSave) return;
    if (this.busy) this.again = true;
    else this.soon();
  },
  saveOwn() { this.ownSave = true; try { changed('tasks'); } finally { this.ownSave = false; } },
  // Both devices sync. The laptop once connected; the phone while it can edit, its OneDrive sign-in including To Do.
  ready() { return state.phone ? OD.canEdit() && OD.hasTasks() && !OD.reading : this.connected(); },
  soon() {
    if (!this.ready()) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.sync(), this.SOON_MS);
  },
  async sync() {
    if (!this.ready()) return;
    if (this.busy) { this.again = true; return; }
    if (this.waitingForFile()) return; // the data file needs reconnecting or a decision first; DF.check() syncs after
    this.busy = true;
    this.syncLoads = DB.loads;
    let sent = 0, cameIn = false;
    try {
      let list = await this.listId();
      let remote;
      try { remote = await this.remoteTasks(list); } catch (e) {
        if (e.status !== 404) throw e;
        // The whole list was deleted in To Do: make it again and send everything afresh.
        device.remove('todoList');
        DB.tasks.forEach((t) => { if (t.todo && t.todo.id) t.todo = null; });
        list = await this.listId();
        remote = await this.remoteTasks(list);
      }
      // 1. What comes in from To Do (decided first, then carried out here).
      const inn = this.decideIn(DB.tasks, remote);
      if (inn.error) throw new Error(inn.error);
      for (const t of inn.gone) t.todo = t.done ? null : { removed: true };
      if (inn.gone.length) toast(`${inn.gone.length} task${inn.gone.length === 1 ? ' was' : 's were'} deleted in To Do — kept here, not sent again`);
      sent = inn.gone.length;
      for (const { t, x, take, was, there } of inn.take) {
        if (!DB.tasks.includes(t)) continue; // taken away meanwhile (an untick from the phone removed this next copy)
        if (take.length) {
          this.apply(t, x, take, was);
          t.todo.base = { ...was, ...Object.fromEntries(take.map((k) => [k, there[k]])) };
          delete t.todo.sig;
        }
        if (x.recurrence) await this.takeRepeat(t, x, list);
      }
      for (const x of inn.fresh) await this.adopt(x, list);
      const got = inn.take.length + inn.fresh.length;
      sent += got;
      if (got) {
        cameIn = true;
        const added = inn.fresh.length, edited = inn.take.length;
        toast([edited && `${edited} change${edited === 1 ? '' : 's'}`, added && `${added} new task${added === 1 ? '' : 's'}`].filter(Boolean).join(' and ') + ' from To Do');
      }

      // 2. What goes out to To Do, decided on the tasks as they are now (a tick from the phone may have made a next copy).
      const out = this.decideOut(DB.tasks, remote, DB.deleted.filter((m) => m.key === 'tasks').map((m) => m.id));
      for (const s of out.send) {
        const { t } = s;
        if (!s.id) {
          const made = await this.graph('POST', `/me/todo/lists/${list}/tasks`, { ...s.body, linkedResources: [this.link(t)] });
          t.todo = { id: made.id, base: s.here };
          sent++;
          DB.persist('tasks'); // keep the link even if the page closes mid-sync
          continue;
        }
        if (s.relink) t.todo = { id: s.id };
        if (s.mark) { await this.mark(s.x, t, list); sent++; }
        if (s.patch) { await this.graph('PATCH', `/me/todo/lists/${list}/tasks/${s.id}`, s.body); sent++; }
        if (s.rebase) { t.todo = { id: s.id, base: s.here }; sent++; } // both sides now look like this
      }
      if (out.error) throw new Error(out.error); // the sends above still went; only the removals are refused
      for (const x of out.remove) {
        try { await this.graph('DELETE', `/me/todo/lists/${list}/tasks/${x.id}`); } catch (e) { if (e.status !== 404) throw e; }
        sent++;
      }
      if (sent) this.saveOwn();
      this.error = '';
      device.set('todoLast', Date.now());
    } catch (e) {
      if (e.reloaded) this.again = true; // nothing of this run is kept: the next run links the new copies (by their ids)
      else {
        if (sent) this.saveOwn(); // links made before the problem are kept
        this.error = e.signin ? '' : e.message;
      }
    } finally {
      this.busy = false;
    }
    renderStatus();
    // Show what came in — but never redraw under someone typing.
    const typing = document.querySelector('input:focus, textarea:focus, select:focus, [contenteditable]:focus');
    if ((cameIn || state.view === 'settings') && !typing) render();
    if (cameIn && !typing) renderDrawer();
    if (this.again) { this.again = false; this.soon(); }
  },
  disconnect() {
    device.remove('msAuth');
    device.remove('todoList');
    this.error = '';
    toast(`Disconnected. The "${this.LIST_NAME}" list stays in To Do — delete it there if you don't want it`);
    render();
  },
};

// The phone syncs To Do with its OneDrive sign-in (which asks for To Do too); no separate connect or disconnect.
function phoneTodoCard() {
  const intro = `Keeps the “${TD.LIST_NAME}” list in your Microsoft To Do up to date from this phone too, so reminders don't wait for the laptop. Uses the same sign-in as OneDrive.`;
  if (!OD.connected()) return `<div class="card"><h2>Phone reminders</h2><p class="sub">${intro}</p><p class="sub">Sign in to OneDrive (above) to start.</p></div>`;
  if (!OD.hasTasks()) {
    return `<div class="card"><h2>Phone reminders</h2><p class="sub">${intro}</p>
      <p><span class="status-dot warn"></span>Sign in again to add To Do to this phone's sign-in.</p>
      <button class="btn primary" data-action="od-connect">Sign in again</button></div>`;
  }
  const last = device.get('todoLast', 0);
  const onPhone = DB.tasks.filter((t) => t.todo && t.todo.id && !t.done).length;
  const status = OD.needsSignIn() ? '<span class="status-dot warn"></span>Paused — sign in to Microsoft again'
    : state.readOnly ? '<span class="status-dot warn"></span>Paused while read-only (offline or signed out)'
    : TD.error ? '<span class="status-dot bad"></span>Sync problem' : '<span class="status-dot on"></span>Syncing from this phone';
  return `<div class="card"><h2>Phone reminders</h2><p class="sub">${intro}</p>
    <p>${status}</p>
    <p class="sub">${onPhone} task${onPhone === 1 ? '' : 's'} on your phone list · last synced ${last ? esc(fmtStamp(new Date(last).toISOString())) : 'not yet'}</p>
    ${TD.error ? `<p class="sub" style="color:var(--danger)">${esc(TD.error)}</p>` : ''}
    <div class="row">${OD.needsSignIn() ? '<button class="btn primary" data-action="od-connect">Sign in again</button>' : `<button class="btn edit-only" data-action="td-sync" ${TD.busy ? 'disabled' : ''}>${TD.busy ? 'Syncing…' : 'Sync now'}</button>`}</div></div>`;
}

function todoCard() {
  if (state.phone) return phoneTodoCard();
  const a = TD.auth();
  const err = TD.error ? `<p class="sub" style="color:var(--danger)">${esc(TD.error)}</p>` : '';
  const intro = `Copies every open task, with its next reminder, to a “${TD.LIST_NAME}” list in your Microsoft To Do. To Do then reminds you on your phone, even when this computer is off. Ticks, edits and new tasks made in that list on the phone come back here when this app next syncs (if both sides changed the same thing, this app's version wins).`;
  if (!a) {
    return `<div class="card edit-only"><h2>Phone reminders</h2><p class="sub">${intro}</p>
      <button class="btn primary" data-action="td-connect">Connect Microsoft To Do</button>${err}</div>`;
  }
  const last = device.get('todoLast', 0);
  const onPhone = DB.tasks.filter((t) => t.todo && t.todo.id && !t.done).length;
  const status = TD.needsSignIn() ? '<span class="status-dot warn"></span>Paused — sign in to Microsoft again'
    : TD.waitingForFile() ? '<span class="status-dot warn"></span>Paused — reconnect the data file first (Data file, above)'
    : TD.error ? '<span class="status-dot bad"></span>Sync problem' : '<span class="status-dot on"></span>Connected';
  return `<div class="card edit-only"><h2>Phone reminders</h2><p class="sub">${intro}</p>
    <p>${status}</p>
    <p class="sub">${onPhone} task${onPhone === 1 ? '' : 's'} on your phone list · last synced ${last ? esc(fmtStamp(new Date(last).toISOString())) : 'not yet'}</p>${err}
    <div class="row">
      ${TD.needsSignIn() ? '<button class="btn primary" data-action="td-connect">Sign in again</button>' : `<button class="btn" data-action="td-sync" ${TD.busy ? 'disabled' : ''}>${TD.busy ? 'Syncing…' : 'Sync now'}</button>`}
      <button class="btn danger" data-action="td-disconnect">Disconnect</button>
    </div></div>`;
}

// ===================== OneDrive on the phone =====================
// The phone signs in to Microsoft with access to PA App's own OneDrive folder only (Apps › PA App — Microsoft makes
// it on the first sign-in) and reads the data file from there: always the latest, no picking. It's the To Do sign-in's
// code with another permission and its own tokens (dev_odAuth); the laptop doesn't use it — it reaches the same file
// through its synced OneDrive folder. Picking the file by hand still works signed out (read-only).
// Editing (stage C): signed in, online and with the file read, the phone edits. changed() → markDirty keeps the data on
// the phone (dev_roData, dev_odUnsaved) and saves it to OneDrive a moment later, only onto the version it read
// (If-Match: the file's eTag). If the laptop saved meanwhile, it merges record by record (mergeData) and tries again,
// quietly. A change that couldn't be saved (no signal, page closed) is merged in at the next open.
const OD = Object.assign(Object.create(TD), {
  // PA App's own folder only, and To Do (the phone syncs it too): one sign-in for both.
  SCOPE: 'Files.ReadWrite.AppFolder Tasks.ReadWrite offline_access',
  AUTH_KEY: 'odAuth',
  CONNECTED_NOTE: 'Signed in to OneDrive',
  FILE_NAME: 'pa-app-data.json',
  SAVE_MS: 2000,
  busy: false,      // never set: its own, so the To Do sync's `busy` (on TD) can't stop OneDrive reads and saves
  reading: false,
  saving: false,
  saveAgain: false,
  saveTimer: null,
  edits: 0,         // counts changes, so one made during a save isn't marked as saved
  item: null,       // the data file on OneDrive: {id, name, eTag} — eTag = the version last read or saved
  error: '',
  folder: device.get('odFolder', ''), // the app folder's name, e.g. "PA App" (Apps › PA App)
  empty: false,     // signed in, but no data file in the folder yet
  offline: false,   // the last read or save failed for want of a connection: read-only, showing the last copy
  lastRead: 0,
  afterSignIn() { this.open(); },
  // Signed in before To Do was added to the phone's sign-in: OneDrive only, until it signs in again.
  hasTasks() { const a = this.auth(); return !!a && /\bTasks\.ReadWrite\b/i.test(a.scope || ''); },
  canEdit() {
    return state.phone && !params.has('readonly') && this.connected() && !this.needsSignIn() && !this.offline && !!this.item;
  },
  // Editing on or off, as things stand now.
  refreshMode() {
    if (!state.phone) return;
    const ro = !this.canEdit();
    if (ro !== state.readOnly) { state.readOnly = ro; render(); renderDrawer(); } else renderStatus();
  },
  async open() {
    if (!this.connected() || this.reading) return;
    this.reading = true;
    renderStatus();
    let copies = [];
    try {
      const root = await this.graph('GET', '/me/drive/special/approot');
      this.folder = root.name || 'PA App';
      device.set('odFolder', this.folder);
      const found = await this.findFile();
      const f = found.f;
      copies = found.copies;
      this.empty = !f;
      this.offline = false;
      this.error = '';
      if (f) {
        const file = await this.graph('GET', `/me/drive/items/${f.id}/content`);
        this.item = { id: f.id, name: f.name, eTag: f.eTag };
        const mine = device.get('odUnsaved', false) && device.get('roData', null);
        // A change made here never reached OneDrive: put it together with the file's, then save.
        RO.show(mine ? { ...file, data: mergeData(mine, file.data) } : file, f.name, 'OneDrive');
        if (mine) this.edits++;
      }
      this.lastRead = Date.now();
    } catch (e) {
      if (e && e.name === 'TypeError') this.offline = true; // fetch failed (no connection): keep showing the last copy
      else this.error = e.signin ? '' : e.message;
    } finally {
      this.reading = false;
    }
    this.refreshMode();
    renderStatus();
    render();
    if (copies && copies.length && this.canEdit()) await this.tidyCopies(copies);
    else if (device.get('odUnsaved', false)) this.save();
    TD.soon(); // with the latest read, To Do follows (when it may)
  },
  // The data file lives in Apps › PA App › Data; a phone whose file is still loose in Apps › PA App (from before the
  // Data folder) finds it there. f: the data file; copies: OneDrive's conflict copies beside it
  // ("pa-app-data-LAPTOP.json", made when the laptop and phone saved within the same few seconds).
  DATA_DIR: 'Data',
  async findFile() {
    const pick = (kids) => (kids.value || []).filter((x) => x.file && /\.json$/i.test(x.name));
    let files = [];
    try {
      files = pick(await this.graph('GET', `/me/drive/special/approot:/${this.DATA_DIR}:/children?$select=id,name,eTag,file`));
    } catch (e) { if (e && (e.name === 'TypeError' || e.signin)) throw e; } // no Data folder yet (404): look loose
    if (!files.length) files = pick(await this.graph('GET', '/me/drive/special/approot/children?$select=id,name,eTag,file'));
    const base = this.FILE_NAME.replace(/\.json$/i, '');
    const isCopy = (x) => x.name.toLowerCase().startsWith(`${base}-`.toLowerCase());
    const f = files.find((x) => x.name === this.FILE_NAME) || files.find((x) => !isCopy(x)) || files[0];
    return { f, copies: f ? files.filter((x) => x !== f && isCopy(x)) : [] };
  },
  // Put each conflict copy's records together with the data file (the newer change to each record wins, as in every
  // merge), save, and only once that's saved move the copies to OneDrive's recycle bin. Not saved: they stay for next time.
  async tidyCopies(copies) {
    const merged = [];
    for (const c of copies) {
      try {
        const file = await this.graph('GET', `/me/drive/items/${c.id}/content`);
        if (!file || !file.data || !REQUIRED_KEYS.every((k) => Array.isArray(file.data[k]))) continue; // not one of ours
        DB.importAll(mergeData(DB.exportAll(), file.data));
        merged.push(c);
      } catch { /* try again next time */ }
    }
    if (!merged.length) return;
    this.edits++;
    device.set('roData', DB.exportAll());
    device.set('odUnsaved', true);
    await this.save();
    if (device.get('odUnsaved', false)) return;
    let gone = 0;
    for (const c of merged) {
      try { await this.graph('DELETE', `/me/drive/items/${c.id}`); gone++; } catch { /* left for next time; merging it again changes nothing */ }
    }
    if (!document.querySelector('input:focus, textarea:focus, select:focus')) { render(); renderDrawer(); }
    if (gone) toast(`Tidied ${gone === 1 ? 'a conflict copy' : `${gone} conflict copies`} of the data file (made when both devices saved at once): its changes are in, and the copy is in OneDrive's recycle bin`);
  },
  // Something changed on the phone: keep it here (it survives closing the page) and save it shortly.
  markDirty() {
    this.edits++;
    device.set('roData', DB.exportAll());
    device.set('odUnsaved', true);
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => this.save(), this.SAVE_MS);
    renderStatus();
  },
  async save() {
    if (this.saving) { this.saveAgain = true; return; }
    if (!this.canEdit() || !device.get('odUnsaved', false)) return;
    this.saving = true;
    renderStatus();
    try {
      for (let tries = 0; tries < 3; tries++) {
        const edits = this.edits;
        Stamps.touch(RECORD_KEYS);
        const payload = { app: 'PA App', version: 2, saveToken: uid(), savedAt: new Date().toISOString(), savedFrom: deviceName(), data: DB.exportAll() };
        try {
          const saved = await this.graph('PUT', `/me/drive/items/${this.item.id}/content`, payload, { 'If-Match': this.item.eTag });
          this.item = { ...this.item, eTag: saved.eTag };
          device.set('roData', DB.exportAll());
          if (this.edits === edits) device.set('odUnsaved', false); // else a newer change saves next
          RO.info = { fileName: this.item.name, from: 'OneDrive', savedAt: payload.savedAt, savedFrom: payload.savedFrom, openedAt: new Date().toISOString() };
          device.set('roInfo', RO.info);
          await this.dailyBackup(payload);
          break;
        } catch (e) {
          if (e.status !== 412) throw e;
          // Saved elsewhere since we read it: take the newer version, put both together, and try again (quietly).
          const meta = await this.graph('GET', `/me/drive/items/${this.item.id}`);
          const file = await this.graph('GET', `/me/drive/items/${this.item.id}/content`);
          this.item = { ...this.item, eTag: meta.eTag };
          DB.importAll(mergeData(DB.exportAll(), file.data));
          if (!document.querySelector('input:focus, textarea:focus, select:focus')) { render(); renderDrawer(); }
        }
      }
    } catch (e) {
      if (e && e.name === 'TypeError') this.offline = true; // no signal: read-only until it's back; the change waits here
      else this.error = e.signin ? '' : e.message;
      this.refreshMode();
    } finally {
      this.saving = false;
      renderStatus();
      if (this.saveAgain) { this.saveAgain = false; this.save(); }
    }
  },
  // Daily backups, like the laptop's: the phone's first save of each day also puts a dated copy in
  // Apps › PA App › Backups (OneDrive makes the folder). Never over an existing backup; a failure doesn't stop saving.
  BACKUPS: 'Backups',
  BACKUP_RETRY_MS: 10 * 60000, // after a failed backup, wait before trying again (its notice is a change, so it saves again)
  backupFailedAt: 0,
  async dailyBackup(payload) {
    const day = todayISO();
    if (device.get('odBackupDay', '') === day || Date.now() - this.backupFailedAt < this.BACKUP_RETRY_MS) return;
    const name = backupName(new Date());
    try {
      const path = `/me/drive/special/approot:/${this.BACKUPS}/${encodeURIComponent(name)}:/content?@microsoft.graph.conflictBehavior=fail`;
      await this.graph('PUT', path, new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' }));
    } catch (e) {
      if (!(e && e.status === 409)) {
        this.backupFailedAt = Date.now();
        toast('Daily backup failed: ' + (e && e.name === 'TypeError' ? 'no connection' : e.message));
        return;
      }
      // 409: that backup is already there
    }
    device.set('odBackupDay', day);
    device.set('odBackupName', name);
    if (state.view === 'settings' && !document.querySelector('input:focus, textarea:focus, select:focus')) render();
  },
  // Attached files (stage D): the laptop's attachments folder, moved into the app's own folder in OneDrive.
  FILES: 'Attachments',
  filePath(name) { return `/me/drive/special/approot:/${this.FILES}/${encodeURIComponent(name)}:`; },
  canRead() { return state.phone && this.connected() && !this.needsSignIn() && !this.offline; },
  // w: a tab opened at the tap (a phone blocks one opened after waiting for OneDrive).
  async openFile(att, w) {
    if (w) try { w.document.title = att.name; w.document.body.textContent = `Opening ${att.name}…`; } catch { /* not ours to write */ }
    try {
      const item = await this.graph('GET', this.filePath(att.file));
      const url = item && item['@microsoft.graph.downloadUrl'];
      if (!url) throw Object.assign(new Error('no link'), { status: 404 });
      if (w) w.location.href = url; else location.href = url;
    } catch (e) {
      if (w) w.close();
      if (e && e.name === 'TypeError') toast('No connection: files open when you\'re back online');
      else if (e && e.status === 404) toast(`"${att.name}" is not in OneDrive › Apps › PA App › ${this.FILES}`);
      else toast(`Could not open "${att.name}": ${e.message}`);
    }
  },
  // Upload into Attachments; OneDrive picks a free name if this one is taken, and that's the name kept.
  async addFiles(task, files) {
    let added = 0;
    for (const f of files) {
      try {
        const wanted = safeFileName(AT.suggestName(task, f.name));
        toast(`Uploading ${f.name}…`);
        const saved = await this.graph('PUT', `${this.filePath(wanted)}/content?@microsoft.graph.conflictBehavior=rename`, f);
        const stored = (saved && saved.name) || wanted;
        task.attachments.push({ id: uid(), name: stored, file: stored, original: f.name, size: f.size, type: f.type || '', added: Date.now(), keep: false });
        added++;
      } catch (e) {
        toast(e && e.name === 'TypeError' ? `Could not attach ${f.name}: no connection` : `Could not attach ${f.name}: ${e.message}`);
      }
    }
    if (added) { changed('tasks'); toast(`Attached ${added} file${added > 1 ? 's' : ''}`); }
    render();
    renderDrawer();
  },
  // Rename in OneDrive, never over another file: "name (2).pdf" and so on when taken. Gives the new name, or null.
  async renameFile(from, base, ext) {
    for (let i = 1; i < 50; i++) {
      const name = i === 1 ? `${base}${ext}` : `${base} (${i})${ext}`;
      try {
        const item = await this.graph('PATCH', this.filePath(from), { name, '@microsoft.graph.conflictBehavior': 'fail' });
        return (item && item.name) || name;
      } catch (e) {
        if (e && e.status === 409) continue; // taken: try the next
        if (e && e.status === 404) toast(`"${from}" is not in OneDrive › Apps › PA App › ${this.FILES}`);
        else toast(e && e.name === 'TypeError' ? 'Could not rename: no connection' : `Could not rename: ${e.message}`);
        return null;
      }
    }
    toast('Could not rename: too many files with that name');
    return null;
  },
  disconnect() {
    device.remove(this.AUTH_KEY);
    this.empty = false;
    toast('Signed out of OneDrive. The last copy stays on this phone');
    render();
  },
});
// On the phone the To Do sync uses this one sign-in (OD keeps its own AUTH_KEY and SCOPE, so it's unaffected).
if (state.phone) Object.assign(TD, { AUTH_KEY: OD.AUTH_KEY, SCOPE: OD.SCOPE });

// ===================== Actions =====================
function setView(view) {
  state.view = view;
  device.set('view', view);
  if (view === 'notices') Notices.markRead();
  render();
  try { window.scrollTo(0, 0); } catch { /* not available in tests */ }
}

function addTask(data) {
  // A new task lands in the bucket/label you're currently looking at, so it doesn't vanish from view.
  const filterBucket = state.taskBucket && state.taskBucket !== '-' ? state.taskBucket : '';
  const t = normalizeTask({
    id: uid(),
    title: data.title.trim(),
    due: data.due || '',
    priority: data.priority || 'low',
    reminders: Array.isArray(data.reminders) ? data.reminders : [],
    created: Date.now(),
    myDay: data.myDay || '',
    bucket: data.bucket != null ? data.bucket : state.view === 'tasks' ? filterBucket : '',
    labels: state.view === 'tasks' && state.taskLabel ? [state.taskLabel] : [],
  });
  DB.tasks.push(t);
  changed('tasks');
  if (t.reminders.length) askNotifications();
  return t;
}

function addEvent(data) {
  DB.events.push({ id: uid(), title: data.title.trim(), date: data.date, time: data.time || '' });
  changed('events');
  state.selectedDay = data.date;
  const d = parseISO(data.date);
  if (d.getMonth() !== state.calMonth.getMonth() || d.getFullYear() !== state.calMonth.getFullYear()) state.calMonth = monthStart(d);
}

function newNote() {
  const n = { id: uid(), title: '', body: '', updated: Date.now() };
  DB.notes.push(n);
  state.activeNote = n.id;
  state.noteQuery = '';
  changed('notes');
  render();
  $('[data-input="note-title"]')?.focus();
}

function exportData() {
  const payload = { app: 'PA App', version: 2, savedAt: new Date().toISOString(), savedFrom: deviceName(), data: DB.exportAll() };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' }));
  a.download = `PA App Export ${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function importData(file) {
  try {
    const parsed = JSON.parse(await file.text());
    const data = parsed.app === 'PA App' ? parsed.data : parsed; // older exports were the bare data
    if (!data || !REQUIRED_KEYS.every((k) => Array.isArray(data[k]))) throw new Error();
    if (!(await ask(`Replace everything here with ${data.tasks.length} tasks, ${data.notes.length} notes and ${data.events.length} events?`, { yes: 'Replace', danger: true }))) return;
    DB.importAll(data);
    changed(...DATA_KEYS);
    toast('Backup imported');
    render();
  } catch {
    toast('That file is not a valid PA App backup');
  }
}

function cycleTheme() {
  const order = ['auto', 'dark', 'light'];
  const next = order[(order.indexOf(device.get('theme', 'auto')) + 1) % order.length];
  device.set('theme', next);
  applyTheme();
  renderStatus();
}
function applyTheme() {
  const t = device.get('theme', 'auto');
  if (t === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
}

// ===================== Reminders =====================
function askNotifications() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission().then(() => state.view === 'settings' && render());
  }
}

// quiet = the message in the app only: To Do already rings for this one on this computer and the phone.
function notify(title, body, quiet = false, task = '') {
  toast(`🔔 ${title}${body ? ' — ' + body : ''}`, task);
  if (!quiet && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification(title, { body, tag: title }); } catch { /* some browsers need a service worker; the toast already showed */ }
  }
}

// Reminders whose time has come pop up. Ones over 10 minutes late were missed while PA App was closed or the laptop
// slept: the phone has rung for them already (To Do), so they're named in one message instead.
const MISSED_MS = 10 * 60000;
function checkReminders() {
  const now = Date.now();
  let changedAny = false;
  const due = Reminders.due(DB.tasks, now, state.remindedHere);
  const missed = due.filter((d) => d.at < now - MISSED_MS).sort((a, b) => a.at - b.at);
  for (const { t, r, at } of due) {
    if (at >= now - MISSED_MS) {
      const when = t.due ? `Due ${taskDate(t) === todayISO() ? 'today' : fmtDay(taskDate(t))}${taskTime(t) ? ' at ' + fmtTime(taskTime(t)) : ''}` : 'Reminder';
      notify(fullTitle(t), when, !state.readOnly && TD.connected() && !!(t.todo && t.todo.id), t.id);
    }
    if (state.readOnly) state.remindedHere.add(`${t.id}:${r.id}`);
    else { r.fired = true; changedAny = true; }
  }
  if (missed.length) {
    const names = [...new Set(missed.map((d) => fullTitle(d.t)))];
    toast(`${missed.length} reminder${missed.length === 1 ? '' : 's'} went off while Butler was closed: ${names.slice(0, 3).join(', ')}${names.length > 3 ? ` +${names.length - 3} more` : ''}`);
  }
  if (changedAny) {
    changed('tasks');
    if (['today', 'tasks'].includes(state.view)) render();
  }
}

// ===================== Events =====================
const EDIT_ACTIONS = new Set([
  'toggle-task', 'delete-task', 'undo-delete', 'clear-done', 'delete-event', 'new-note', 'delete-note',
  'toggle-myday', 'toggle-step', 'delete-step', 'promote-step',
  'toggle-label', 'rename-bucket', 'delete-bucket', 'bucket-left', 'bucket-right', 'rename-label', 'delete-label',
  'repeat-day', 'at-folder', 'at-reconnect', 'remove-attach', 'board-add', 'delete-reminder', 'clear-time',
  'rename-attach', 'toggle-keep', 'edit-reminder', 'new-task', 'duplicate-task', 'clear-due', 'clear-repeat', 'clear-done-time',
  'td-connect', 'td-sync', 'td-disconnect', 'clear-notices',
]);

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-view]');
  if (nav) return setView(nav.dataset.view);
  const go = e.target.closest('[data-goto]');
  if (go) return setView(go.dataset.goto);

  const filter = e.target.closest('[data-filter]');
  if (filter) { state.taskFilter = filter.dataset.filter; return render(); }

  const day = e.target.closest('[data-day]');
  if (day) {
    state.selectedDay = day.dataset.day;
    const d = parseISO(day.dataset.day);
    if (d.getMonth() !== state.calMonth.getMonth()) state.calMonth = monthStart(d);
    // A task chip in the day opens that task (the day is shown alongside); empty space just opens the day.
    const chip = e.target.closest('.chip[data-action="open-task"]');
    render();
    if (chip) openTaskDrawer(chip.dataset.id);
    return;
  }

  const note = e.target.closest('[data-note]');
  if (note) { state.activeNote = note.dataset.note; return render(); }

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if (state.readOnly && EDIT_ACTIONS.has(action)) { e.preventDefault(); return toast('Read-only on this device'); }
  switch (action) {
    case 'toggle-task': {
      const t = DB.tasks.find((x) => x.id === id);
      if (!t) break;
      if (t.done) {
        const res = Series.untick(t);
        changed('tasks');
        setTimeout(() => { render(); renderDrawer(); }, 150); // let the tick show before the list re-sorts
        if (res.outcome !== 'changed') say(res);
        else {
          ask(res.question, { yes: 'Remove it', no: 'Keep it', danger: true }).then((yes) => {
            if (yes) { Series.removeNext(t); toast(`Removed the next copy (${fullTitle(res.next)})`); changed('tasks'); render(); renderDrawer(); }
            else toast('The next copy stays');
          });
        }
      } else openDonePrompt(t); // ask when it was done, then tick it off
      break;
    }
    case 'done-cancel': closeDonePrompt(); render(); renderDrawer(); break;
    case 'ask-no': answerAsk(false); break;
    case 'done-quick': {
      // Today (no time), or on the due date (with its time, if it has one) — which counts as on time.
      const t = DB.tasks.find((x) => x.id === state.donePrompt);
      if (!t) break;
      if (btn.dataset.when === 'due') finishDonePrompt({ date: taskDate(t), time: taskTime(t) });
      else finishDonePrompt({ date: todayISO(), time: '' });
      break;
    }
    case 'clear-due': {
      const t = currentTask();
      if (!t) break;
      if (!say(TaskEdit.setDue(t, '')).ok) break;
      changed('tasks'); render(); renderDrawer();
      break;
    }
    case 'clear-repeat': setRepeat('freq', ''); break;
    case 'clear-done-time': {
      const t = currentTask();
      if (t && t.done) doneDateMoved(t, Series.setDone(t, toISO(new Date(t.completedAt)), ''));
      break;
    }
    case 'duplicate-task': {
      const t = currentTask();
      if (!t) break;
      const copy = Series.duplicate(t);
      changed('tasks');
      render();
      openTaskDrawer(copy.id);
      toast(`Made “${fullTitle(copy)}”`);
      break;
    }
    case 'delete-task': {
      const t = DB.tasks.find((x) => x.id === id);
      if (!t) break;
      const rich = t.notes.trim() || t.checklist.length || t.attachments.length;
      const remove = () => PendingDelete.start(t); // really deleted a few seconds later, unless Undo
      if (!rich) { remove(); break; }
      ask(`Delete "${fullTitle(t)}"? Its notes and checklist go too${t.attachments.length ? '; attached files stay in your attachments folder' : ''}.`, { yes: 'Delete', danger: true })
        .then((yes) => { if (yes) remove(); });
      break;
    }
    case 'undo-delete': PendingDelete.undo(id); break;
    case 'open-task': openTaskDrawer(id); break;
    case 'clear-notices':
      ask('Clear all notifications? This can\'t be undone.', { yes: 'Clear all', danger: true }).then((yes) => { if (yes) { Notices.clear(); render(); } });
      break;
    case 'layout': device.set('taskLayout', btn.dataset.layout); render(); break;
    case 'board-add':
      state.boardAdd = btn.dataset.bucket;
      render();
      $(`#main form[data-key="col-${CSS.escape(state.boardAdd)}"] [name="title"]`)?.focus();
      break;
    case 'board-add-cancel': state.boardAdd = null; render(); break;
    case 'delete-reminder': {
      const t = currentTask();
      if (t) { t.reminders = t.reminders.filter((r) => r.id !== btn.dataset.rem); changed('tasks'); render(); renderDrawer(); }
      break;
    }
    case 'cancel-reminder': state.remCustom = null; state.remEdit = null; renderDrawer(); break;
    case 'new-task': newTaskInPanel(); break;
    case 'edit-reminder': {
      const t = currentTask();
      const r = t && t.reminders.find((x) => x.id === btn.dataset.rem);
      if (!r) break;
      state.remEdit = r.id;
      state.remCustom = r.kind; // 'before' | 'dayof' | 'at' — the matching form, filled in
      renderDrawer();
      $('#drawer form[data-form="add-reminder"] input')?.focus();
      break;
    }
    case 'clear-time': {
      const t = currentTask();
      if (t && t.due) { say(TaskEdit.setDue(t, taskDate(t), '')); changed('tasks'); render(); renderDrawer(); }
      break;
    }
    case 'qa-raw': {
      const form = btn.closest('form');
      form.dataset.raw = form.dataset.raw === '1' ? '' : '1';
      updateQuickPreview(form);
      form.elements.title.focus();
      break;
    }
    case 'qa-pick': {
      const input = btn.parentElement.querySelector('.qa-native');
      try { input.showPicker(); } catch { input.focus(); input.click(); }
      break;
    }
    case 'at-folder': AT.pickFolder(); break;
    case 'at-reconnect': AT.reconnect(); break;
    case 'open-attach': {
      e.preventDefault(); // it's a link
      const t = btn.dataset.task ? DB.tasks.find((x) => x.id === btn.dataset.task) : currentTask(); // history rows name their task
      const a = t && t.attachments.find((x) => x.id === btn.dataset.att);
      if (a) AT.open(a);
      break;
    }
    case 'rename-attach': {
      const t = currentTask();
      const a = t && t.attachments.find((x) => x.id === btn.dataset.att);
      if (!a) break;
      const dot = a.name.lastIndexOf('.');
      askText(`Rename attachment${a.keep ? ' (kept on every repeat — renames it for all of them)' : ''}`, dot > 0 ? a.name.slice(0, dot) : a.name, { yes: 'Rename' })
        .then((name) => { if (name != null) AT.rename(t, a.id, name); });
      break;
    }
    case 'toggle-keep': {
      const t = currentTask();
      const a = t && t.attachments.find((x) => x.id === btn.dataset.att);
      if (!a) break;
      a.keep = !a.keep;
      toast(a.keep ? `"${a.name}" will be kept on every repeat` : `"${a.name}" stays with this one only`);
      changed('tasks'); render(); renderDrawer();
      break;
    }
    case 'open-history': openTaskDrawer(id); break;
    case 'remove-attach': AT.remove(currentTask(), btn.dataset.att); break;
    case 'repeat-day': {
      const t = currentTask();
      const day = Number(btn.dataset.weekday);
      if (!t || !t.repeat) break;
      const days = t.repeat.days.includes(day) ? t.repeat.days.filter((x) => x !== day) : [...t.repeat.days, day];
      if (!days.length) { toast('Pick at least one day'); break; }
      t.repeat.days = days.sort();
      changed('tasks'); render(); renderDrawer();
      break;
    }
    case 'toggle-label': {
      const t = currentTask();
      const l = btn.dataset.label;
      if (!t) break;
      t.labels = t.labels.includes(l) ? t.labels.filter((x) => x !== l) : [...t.labels, l];
      changed('tasks'); render(); renderDrawer();
      break;
    }
    case 'rename-bucket': renameBucket(id).then(() => { render(); renderDrawer(); }); break;
    case 'delete-bucket': deleteBucket(id).then(() => { render(); renderDrawer(); }); break;
    case 'bucket-left': moveBucket(id, -1); render(); break;
    case 'bucket-right': moveBucket(id, 1); render(); break;
    case 'rename-label': renameLabel(id).then(() => { render(); renderDrawer(); }); break;
    case 'manage-labels': state.labelManage = !state.labelManage; renderDrawer(); break;
    case 'delete-label': deleteLabel(id).then(() => { render(); renderDrawer(); }); break;
    case 'close-task': closeTaskDrawer(); break;
    case 'toggle-myday': {
      const t = currentTask();
      if (t) { t.myDay = inMyDay(t) ? '' : todayISO(); changed('tasks'); render(); renderDrawer(); }
      break;
    }
    case 'toggle-step': case 'delete-step': case 'promote-step': {
      const t = currentTask();
      const s = t && t.checklist.find((x) => x.id === btn.dataset.step);
      if (!s) break;
      if (action === 'toggle-step') s.done = !s.done;
      else {
        t.checklist = t.checklist.filter((x) => x !== s);
        if (action === 'promote-step') {
          addTask({ title: s.text || 'Untitled step', bucket: t.bucket });
          toast('Step turned into its own task');
        }
      }
      changed('tasks');
      render();
      renderDrawer();
      break;
    }
    case 'clear-done': DB.tasks = DB.tasks.filter((x) => !x.done); changed('tasks'); render(); break;
    case 'delete-event': DB.events = DB.events.filter((x) => x.id !== id); changed('events'); render(); break;
    case 'cal-prev': state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() - 1, 1); render(); break;
    case 'cal-next': state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + 1, 1); render(); break;
    case 'cal-today': state.calMonth = monthStart(new Date()); state.selectedDay = todayISO(); render(); break;
    case 'new-note': newNote(); break;
    case 'delete-note':
      ask('Delete this note?', { yes: 'Delete', danger: true }).then((yes) => {
        if (!yes) return;
        DB.notes = DB.notes.filter((n) => n.id !== state.activeNote);
        state.activeNote = null;
        changed('notes');
        render();
      });
      break;
    case 'df-create': DF.createNew().then(render); break;
    case 'df-open': DF.openExisting().then(render); break;
    case 'df-unlink': ask('Stop saving to this data file? The file itself is kept.', { yes: 'Stop saving' }).then((yes) => { if (yes) DF.unlink(); }); break;
    case 'df-reconnect': DF.reconnect().then(render); break;
    case 'df-retry': DF.status = 'ok'; DF.save(); break;
    case 'df-keep-mine': DF.keepMine(); break;
    case 'df-use-theirs': DF.useTheirs(); break;
    case 'df-backup-folder': DF.pickBackupFolder(); break;
    case 'td-connect': TD.signIn(); break;
    case 'od-connect': OD.signIn(); break;
    case 'od-refresh': OD.open(); break;
    case 'od-disconnect': OD.disconnect(); break;
    case 'td-sync':
      if (TD.waitingForFile()) { toast('Reconnect the data file first — then it syncs straight away'); break; }
      TD.sync(); render(); break;
    case 'td-disconnect': ask('Stop sending tasks to Microsoft To Do on this computer?', { yes: 'Disconnect', danger: true }).then((yes) => { if (yes) TD.disconnect(); }); break;
    case 'cycle-theme': cycleTheme(); break;
    case 'enable-notifications': askNotifications(); break;
    case 'test-notification': askNotifications(); notify('Test reminder', 'Reminders are working'); break;
    case 'export': exportData(); break;
  }
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  if (form.dataset.form === 'ask') return answerAsk(true);
  if (state.readOnly) return toast('Read-only on this device');
  const data = Object.fromEntries(new FormData(form));
  if (form.dataset.form === 'done-date') { finishDonePrompt(data); return; }
  if (form.dataset.form === 'add-reminder') {
    const t = currentTask();
    const k = form.dataset.kind;
    const r = k === 'before' ? { kind: 'before', minutes: Math.max(0, Number(data.n) || 0) * Number(data.unit || 1) }
      : k === 'dayof' ? { kind: 'dayof', daysBefore: Math.max(0, Number(data.days) || 0), time: data.time || '09:00' }
      : { kind: 'at', at: data.at };
    if (k === 'at' && !data.at) return;
    if (t && state.remEdit && Reminders.replace(t, state.remEdit, r).ok) {
      state.remCustom = null;
      state.remEdit = null;
      changed('tasks');
      render();
    } else if (t && say(Reminders.add(t, r)).ok) { askNotifications(); state.remCustom = null; changed('tasks'); render(); }
    renderDrawer();
    return;
  }
  if (!data.title || !data.title.trim()) return;
  const kind = form.dataset.form;
  const inDrawer = !!form.closest('#drawer');
  if (kind === 'quick-add') {
    quickAdd(form);
    const key = form.dataset.key;
    render();
    const again = $(`#main form[data-key="${CSS.escape(key)}"] [name="title"]`);
    if (again) again.focus(); // ready for the next one
    return;
  }
  if (kind === 'add-task') addTask(data);
  else if (kind === 'add-event') addEvent(data);
  else if (kind === 'add-step') addStep(data.title);
  else if (kind === 'add-bucket') addBucket(data.title);
  else if (kind === 'add-label') addLabel(data.title, data.color, inDrawer ? currentTask() : null);
  render();
  if (inDrawer) { renderDrawer(); $(`#drawer [data-form="${kind}"] [name="title"]`)?.focus(); }
  else {
    const where = form.dataset.bucket != null ? `[data-bucket="${CSS.escape(form.dataset.bucket)}"]` : '';
    $(`#main [data-form="${kind}"]${where} [name="title"]`)?.focus();
  }
});

// Typing in the drawer: update the task straight away, save shortly after you pause. A new title renames every
// copy as you type, so a save never has them disagree; leaving the box says how many (titleTyping = the old title).
let taskTimer;
let titleTyping = null;
document.addEventListener('input', (e) => {
  const t = currentTask();
  if (!t || state.readOnly || !e.target.closest('#drawer')) return;
  const field = e.target.dataset.field;
  const stepId = e.target.dataset.stepText;
  if (field === 'notes') t.notes = e.target.value;
  else if (field === 'title') {
    if (!e.target.value.trim()) return;
    if (!titleTyping || titleTyping.id !== t.id) titleTyping = { id: t.id, was: t.title };
    TaskEdit.rename(t, e.target.value);
  }
  else if (stepId) { const s = t.checklist.find((x) => x.id === stepId); if (!s) return; s.text = e.target.value; }
  else return;
  clearTimeout(taskTimer);
  taskTimer = setTimeout(() => { changed('tasks'); render(); }, 400);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (asking) { answerAsk(false); return; }
  if (state.donePrompt) { closeDonePrompt(); render(); renderDrawer(); return; } // the task stays not done
  if (state.boardAdd !== null && e.target.closest?.('.add-card')) { state.boardAdd = null; render(); return; }
  if (state.openTask) closeTaskDrawer();
});
// Keyboard shortcuts, for when you're not typing in a box: 1 to 6 switch screens, N puts the cursor in quick add
// (on Tasks if this screen has none), ? lists them.
const SHORTCUT_VIEWS = ['today', 'tasks', 'calendar', 'notes', 'notices', 'settings'];
function shortcut(e) {
  if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || asking || state.donePrompt) return false;
  if (e.target.closest?.('input, textarea, select, [contenteditable="true"]')) return false;
  const n = SHORTCUT_VIEWS[Number(e.key) - 1];
  if (n) { setView(n); return true; }
  if (e.key === 'n' || e.key === 'N') {
    if (state.readOnly) return false;
    let box = $('#main form.quick-add [data-qa]');
    if (!box) { setView('tasks'); box = $('#main form.quick-add [data-qa]'); }
    if (box) box.focus();
    return !!box;
  }
  if (e.key === '?') { toast('Shortcuts: 1 My Day, 2 Tasks, 3 Calendar, 4 Notes, 5 Notifications, 6 Settings. N: add a task. Esc: close.'); return true; }
  return false;
}
document.addEventListener('keydown', (e) => { if (shortcut(e)) e.preventDefault(); });
// Quick add: preview what was understood as you type or pick.
document.addEventListener('input', (e) => {
  if (e.target.matches?.('[data-qa]')) updateQuickPreview(e.target.form);
});
document.addEventListener('change', (e) => {
  if (e.target.matches?.('[data-qa-tool]')) updateQuickPreview(e.target.form);
});

// Calendar: pointing at a late task's chip highlights both of its chips (missed on the due day, done on the done day).
document.addEventListener('mouseover', (e) => {
  const el = e.target.closest?.('[data-late]');
  $$('.late-hl').forEach((x) => { if (!el || x.dataset.late !== el.dataset.late) x.classList.remove('late-hl'); });
  if (el) $$(`[data-late="${CSS.escape(el.dataset.late)}"]`).forEach((x) => x.classList.add('late-hl'));
});

// With the task panel open the rest is dimmed, but the mouse wheel over the dimmed part still scrolls the
// tasks behind it (on the Board only the board scrolls, so pass the wheel on to it).
document.addEventListener('wheel', (e) => {
  if (!e.target.classList?.contains('drawer-backdrop')) return;
  const board = $('.main.fill .board');
  if (board) { board.scrollTop += e.deltaY; board.scrollLeft += e.deltaX; }
  else try { window.scrollBy(e.deltaX, e.deltaY); } catch { /* not available in tests */ }
}, { passive: true });

// Board drag and drop with a mouse (touch screens: TouchDrag below).
document.addEventListener('dragstart', (e) => {
  const card = e.target.closest?.('[data-card]');
  if (!card || state.readOnly) return;
  e.dataTransfer.setData('text/plain', card.dataset.card);
  e.dataTransfer.effectAllowed = 'move';
  card.classList.add('dragging');
});
document.addEventListener('dragend', () => $$('.dragging, .board-col.over').forEach((x) => x.classList.remove('dragging', 'over')));
document.addEventListener('dragover', (e) => {
  const col = e.target.closest?.('[data-bucket-col]');
  if (!col || state.readOnly) return;
  e.preventDefault();
  $$('.board-col.over').forEach((x) => x !== col && x.classList.remove('over'));
  col.classList.add('over');
});
document.addEventListener('drop', (e) => {
  const col = e.target.closest?.('[data-bucket-col]');
  if (!col || state.readOnly) return;
  e.preventDefault();
  moveTaskToBucket(e.dataTransfer.getData('text/plain'), col.dataset.bucketCol);
});

// Board drag by touch (phones and tablets don't send the mouse's drag events): hold a card a moment, then drag it
// onto another column. Moving the finger before then is a scroll, and a quick tap still opens the task. Near the
// board's left or right edge it scrolls along, so a column off screen can be reached.
const TouchDrag = {
  HOLD_MS: 350,
  SLOP: 10,        // px the finger may wander while holding
  EDGE: 40,        // px from the board's side where it scrolls along
  timer: null, card: null, ghost: null, col: null, board: null, scroller: null,
  x: 0, y: 0, dx: 0, dy: 0,
  dragging: false,
  start(e) {
    this.cancel();
    if (state.readOnly || e.touches.length !== 1) return;
    const card = e.target.closest?.('.board [data-card]');
    if (!card || e.target.closest('input, button, select, a')) return;
    const p = e.touches[0];
    this.card = card;
    this.x = p.clientX; this.y = p.clientY;
    this.timer = setTimeout(() => this.lift(), this.HOLD_MS);
  },
  lift() {
    const card = this.card;
    if (!card || !card.isConnected) return this.cancel();
    const r = card.getBoundingClientRect();
    this.dx = this.x - r.left; this.dy = this.y - r.top;
    this.ghost = card.cloneNode(true);
    this.ghost.classList.add('drag-ghost');
    this.ghost.removeAttribute('data-card');
    this.ghost.style.width = `${r.width}px`;
    document.body.append(this.ghost);
    card.classList.add('dragging');
    this.board = card.closest('.board');
    this.dragging = true;
    try { navigator.vibrate?.(15); } catch { /* not on every phone */ }
    this.follow();
    this.scroller = setInterval(() => this.edgeScroll(), 16);
  },
  move(e) {
    const p = e.touches[0];
    if (!p) return;
    if (!this.dragging) {
      if (this.timer && Math.hypot(p.clientX - this.x, p.clientY - this.y) > this.SLOP) this.cancel(); // a scroll
      return;
    }
    e.preventDefault(); // dragging: the page stays still
    this.x = p.clientX; this.y = p.clientY;
    this.follow();
  },
  // The card under the finger, and the column it's over lit up.
  follow() {
    this.ghost.style.left = `${this.x - this.dx}px`;
    this.ghost.style.top = `${this.y - this.dy}px`;
    const col = document.elementFromPoint(this.x, this.y)?.closest?.('[data-bucket-col]') || null;
    if (col !== this.col) {
      this.col?.classList.remove('over');
      col?.classList.add('over');
      this.col = col;
    }
  },
  edgeScroll() {
    if (!this.board) return;
    const r = this.board.getBoundingClientRect();
    const step = this.x < r.left + this.EDGE ? -12 : this.x > r.right - this.EDGE ? 12 : 0;
    if (!step) return;
    this.board.scrollLeft += step;
    this.follow();
  },
  end(e) {
    if (!this.dragging) return this.cancel();
    e.preventDefault(); // no tap: the task doesn't open
    const id = this.card.dataset.card;
    const to = this.col ? this.col.dataset.bucketCol : null;
    this.cancel();
    if (to != null) moveTaskToBucket(id, to);
  },
  cancel() {
    clearTimeout(this.timer);
    clearInterval(this.scroller);
    this.ghost?.remove();
    this.card?.classList.remove('dragging');
    this.col?.classList.remove('over');
    Object.assign(this, { timer: null, scroller: null, ghost: null, card: null, col: null, board: null, dragging: false });
  },
};
document.addEventListener('touchstart', (e) => TouchDrag.start(e), { passive: true });
document.addEventListener('touchmove', (e) => TouchDrag.move(e), { passive: false });
document.addEventListener('touchend', (e) => TouchDrag.end(e), { passive: false });
document.addEventListener('touchcancel', () => TouchDrag.cancel());
document.addEventListener('contextmenu', (e) => { if (TouchDrag.card) e.preventDefault(); }); // a long hold isn't a menu

let noteTimer;
document.addEventListener('input', (e) => {
  const kind = e.target.dataset?.input;
  if (!kind) return;
  if (kind === 'note-search') {
    state.noteQuery = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const input = $('[data-input="note-search"]');
    input.focus();
    input.setSelectionRange(pos, pos);
    return;
  }
  if (kind === 'device-name') { device.set('name', e.target.value.trim() || 'Computer'); return; }
  if (kind === 'task-bucket') { state.taskBucket = e.target.value; render(); return; }
  if (kind === 'task-label') { state.taskLabel = e.target.value; render(); return; }
  if (kind === 'task-sort') { device.set('taskSort', e.target.value); render(); return; }
  if (kind === 'task-group') { device.set('taskGroup', e.target.value); render(); return; }
  if (state.readOnly) return;
  const n = DB.notes.find((x) => x.id === state.activeNote);
  if (!n || (kind !== 'note-title' && kind !== 'note-body')) return;
  if (kind === 'note-title') n.title = e.target.value;
  else n.body = e.target.value;
  n.updated = Date.now();
  // Update the list preview in place so typing never loses focus.
  const card = $(`[data-note="${CSS.escape(n.id)}"]`);
  if (card) {
    $('.t', card).textContent = n.title || 'Untitled';
    $('.p', card).textContent = n.body.slice(0, 80) || 'Empty note';
  }
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => changed('notes'), 300);
});

document.addEventListener('change', (e) => {
  if (e.target.dataset?.field && e.target.closest('#drawer')) return setTaskField(e.target.dataset.field, e.target.value);
  if (e.target.dataset?.repeat && e.target.closest('#drawer')) return setRepeat(e.target.dataset.repeat, e.target.type === 'checkbox' ? e.target.checked : e.target.value);
  if (e.target.matches?.('[data-rem-add]') && !state.readOnly) {
    const t = currentTask();
    const v = e.target.value;
    if (!t || !v) return;
    if (v.startsWith('custom-')) { state.remCustom = v.slice(7); state.remEdit = null; renderDrawer(); return; }
    if (say(Reminders.add(t, presetReminder(v))).ok) { askNotifications(); changed('tasks'); render(); }
    renderDrawer();
    return;
  }
  if (e.target.dataset?.labelColor && !state.readOnly) {
    const l = DB.labels.find((x) => x.id === e.target.dataset.labelColor);
    if (l) { l.color = e.target.value; changed('labels'); render(); renderDrawer(); }
    return;
  }
  const kind = e.target.dataset?.input;
  const file = e.target.files?.[0];
  if (!file) return;
  if (kind === 'import' && !state.readOnly) importData(file);
  if (kind === 'attach') AT.add(currentTask(), [...e.target.files]);
  if (kind === 'ro-open') RO.open(file);
  e.target.value = '';
});

// Before the tab closes, push any typed-but-not-yet-saved note into the browser store.
window.addEventListener('beforeunload', () => { if (!state.readOnly) DB.persist('notes'); });
// Coming back to the tab: see if another device saved meanwhile.
document.addEventListener('visibilitychange', () => { if (!document.hidden && DF.status === 'ok') DF.check(); });
// A delete waiting for Undo happens now if the page is left or put in the background (a phone may never come back).
document.addEventListener('visibilitychange', () => { if (document.hidden) PendingDelete.flush(); });
window.addEventListener('pagehide', () => PendingDelete.flush());

// ===================== Start =====================
// On localhost Microsoft's sign-in pop-up comes back to this page; there it only hands the answer to the main
// window (which reads it from the pop-up's address), so the app itself doesn't start.
const signInPopup = !!window.opener && /[?&](code|error)=/.test(location.search);
applyTheme();
if (signInPopup) document.body.textContent = 'Signing in…';
else {
  if (state.phone) RO.boot(); else DB.load();
  render();
  if (state.phone) {
    // Signed in to OneDrive: read the latest on opening, and again on coming back to it (at most once a minute).
    OD.open();
    // A phone's date or time picker hides the page for a moment; reading then would redraw the box being picked and
    // lose the pick. So while a box has focus, read once none has (the pick has gone through by then).
    const readWhenFree = () => (document.querySelector('input:focus, textarea:focus, select:focus') ? setTimeout(readWhenFree, 500) : OD.open());
    document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - OD.lastRead > 60000) readWhenFree(); });
    addEventListener('offline', () => { OD.offline = true; OD.refreshMode(); });
    addEventListener('online', () => OD.open()); // back: read the latest (an unsaved change is merged in and saved)
  }
  // To Do waits until the data file has loaded, so it never works from an out-of-date copy.
  Promise.resolve(DF.init()).finally(() => TD.sync());
  AT.init();
  checkReminders();
  setInterval(checkReminders, 20000);
  setInterval(() => { if (DF.status === 'ok' && !document.hidden && !DF.saving) DF.check(); }, DF.POLL_MS);
  setInterval(() => { if (state.view === 'today' && !document.querySelector(':focus')) render(); }, 60000);
  setInterval(() => TD.sync(), TD.SYNC_MS);
}

// For tests and debugging in the console.
window.PA = { DB, DF, RO, AT, TD, OD, TaskEdit, Series, state, device, render, renderDrawer, checkReminders, uid, toISO, normalizeTask, addTask, moveTaskToBucket, nextDue, repeatText, rollTitle, rollPeriod, splitPeriod, fullTitle, Reminders };
</script>
</body>
</html>
