/* ===== Butler's design tokens (DESIGN.md): calm and warm. Light by default; dark follows the device unless the
   theme switch says otherwise. No colour or font is written anywhere else. ===== */
:root {
  --bg: #f7f3ec;          /* paper */
  --panel: #fdfbf7;       /* raised: sidebar, cards, drawer */
  --panel-2: #efe9de;     /* sunken: columns, hovers, the tab track */
  --text: #26231e;        /* ink */
  --muted: #6b6457;
  --border: #e2dbcd;
  --accent: #0f5c57;      /* deep teal: the one accent */
  --accent-hover: #0b4a46;
  --accent-soft: #e0ebe7;
  --accent-ink: #fbf8f2;  /* text and icons on the accent */
  --danger: #b3452f;
  --ok: #3f6f3a;
  --warn: #9a6a12;
  --scrim: rgba(38, 30, 18, .32);
  --shadow: none;
  --shadow-sm: 0 1px 2px rgba(48, 36, 18, .1);
  --shadow-float: 0 18px 48px -12px rgba(48, 36, 18, .28), 0 2px 6px rgba(48, 36, 18, .08);
  --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --t-xs: 12px; --t-sm: 13px; --t-base: 15px; --t-md: 17px; --t-lg: 20px; --t-xl: 26px; --t-2xl: 34px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --radius: var(--r-lg);
  /* Label shades, warm to sit with the palette (a label's stored colour picks one: see LABEL_COLORS) */
  --lab-red: #a5482f; --lab-orange: #9a5d12; --lab-green: #4b7445; --lab-blue: #44627e; --lab-purple: #7a4f74; --lab-pink: #a1465f; --lab-grey: #6b6457;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a17; --panel: #23211d; --panel-2: #2c2a25; --text: #ece6da; --muted: #a39c8e; --border: #37342e;
    --accent: #6cc3ba; --accent-hover: #86d1c9; --accent-soft: #233f3b; --accent-ink: #12211f;
    --danger: #e8866f; --ok: #8fc38a; --warn: #e0b45e; --scrim: rgba(0, 0, 0, .5);
    --shadow-float: 0 18px 48px -12px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .3);
    --lab-red: #e39377; --lab-orange: #deae5f; --lab-green: #9cc795; --lab-blue: #a3bad0; --lab-purple: #cfa3c6; --lab-pink: #e3a0b2; --lab-grey: #a39c8e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1a17; --panel: #23211d; --panel-2: #2c2a25; --text: #ece6da; --muted: #a39c8e; --border: #37342e;
  --accent: #6cc3ba; --accent-hover: #86d1c9; --accent-soft: #233f3b; --accent-ink: #12211f;
  --danger: #e8866f; --ok: #8fc38a; --warn: #e0b45e; --scrim: rgba(0, 0, 0, .5);
  --shadow-float: 0 18px 48px -12px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .3);
    --lab-red: #e39377; --lab-orange: #deae5f; --lab-green: #9cc795; --lab-blue: #a3bad0; --lab-purple: #cfa3c6; --lab-pink: #e3a0b2; --lab-grey: #a39c8e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--text); font: var(--t-base)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 2px; }
code { background: var(--panel-2); padding: 1px 5px; border-radius: var(--r-sm); font-size: var(--t-sm); }
::placeholder { color: var(--muted); opacity: 1; }
::selection { background: var(--accent-soft); color: var(--text); }
html { scrollbar-color: var(--border) transparent; caret-color: var(--accent); }
/* One visible focus ring for every control, shown at once when the keyboard is used */
:where(button, a, input, select, textarea, label, summary, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { cursor: not-allowed; }
/* Icons: one drawn set (the sprite at the end of <body>), in the colour of the text around them */
.i { width: 18px; height: 18px; flex: none; vertical-align: -3.5px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 15px; height: 15px; vertical-align: -2.5px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

.app { display: flex; min-height: 100vh; }

/* ===== Sidebar ===== */
.sidebar {
  width: 220px; flex-shrink: 0; padding: 20px 12px; border-right: 1px solid var(--border); background: var(--panel);
  display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; font-family: var(--font-display); font-weight: 500; font-size: var(--t-lg); letter-spacing: -.01em; }
.logo { width: 30px; height: 30px; border-radius: var(--r-md); background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: var(--t-md); line-height: 1; }
.nav-btn {
  display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 0; border-radius: var(--r-md);
  background: transparent; cursor: pointer; text-align: left; color: var(--muted); transition: background-color .12s ease-out, color .12s ease-out;
}
@media (hover: hover) { .nav-btn:hover { background: var(--panel-2); color: var(--text); } } /* no "stuck" hover after a tap */
.nav-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-count { margin-left: auto; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: var(--t-xs); font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.nav-count[hidden] { display: none; }
.lbl-short { display: none; } /* the phone's bottom bar uses the short label */
.notice-list { padding: 6px 0; }
.notice-day { padding: 14px 16px 4px; font-size: var(--t-sm); font-weight: 600; color: var(--muted); }
.notice-row { display: flex; gap: 14px; align-items: baseline; width: 100%; padding: 8px 16px; border: 0; background: none; color: var(--text); font: inherit; text-align: left; }
.notice-row.link { cursor: pointer; }
.notice-row.link:hover { background: var(--panel-2); }
.notice-time { flex: none; width: 70px; font-size: var(--t-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.notice-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ico { width: 20px; display: inline-grid; place-items: center; flex: none; }
.ico .i { width: 20px; height: 20px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 0 4px; }
.df-badge { font-size: var(--t-xs); color: var(--muted); padding: 7px 9px; border-radius: var(--r-md); background: var(--panel-2); }
.theme-btn { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--t-xs); border: 1px solid var(--border); background: transparent; border-radius: var(--r-md); padding: 6px 8px; cursor: pointer; color: var(--muted); text-decoration: none; }
.theme-btn:hover { background: var(--panel-2); color: var(--text); }

/* ===== Main ===== */
.main { flex: 1; min-width: 0; padding: 32px 36px 64px; } /* every screen uses the full width */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: var(--t-2xl); line-height: 1.1; letter-spacing: -.015em; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.card h2 { margin: 0 0 12px; font-size: var(--t-md); font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.grid { display: grid; gap: 16px; }
/* Settings: two columns of cards on a wide screen, one on a narrow one; only the data file card keeps a filled
   button, the others' main buttons are outlined so the page has one clear first step. */
.settings-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); max-width: 1120px; align-items: start; }
.settings-grid .card:not(#df-card) .btn.primary { background: transparent; color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
.settings-grid .card:not(#df-card) .btn.primary:hover { background: var(--accent-soft); }
.settings-grid .card > .row, .settings-grid .card > .btn, .settings-grid .card > label.btn { margin-top: 12px; }
.settings-grid .card > h2:not(:first-child) { margin-top: 22px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-main { grid-template-columns: 1.4fr 1fr; }
.stat { font-family: var(--font-display); font-size: var(--t-2xl); font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-label { color: var(--muted); font-size: var(--t-sm); }

/* ===== Forms & buttons ===== */
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.input { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--panel); min-width: 0; transition: border-color .12s ease-out; }
.input:hover { border-color: color-mix(in srgb, var(--muted) 45%, var(--border)); }
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.grow { flex: 1; min-width: 160px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--r-md);
  border: 1px solid var(--border); background: var(--panel); cursor: pointer; white-space: nowrap; transition: background-color .12s ease-out, border-color .12s ease-out;
}
.btn:hover { background: var(--panel-2); }
a.btn { color: var(--text); text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .55; }
.btn.small { padding: 4px 10px; font-size: var(--t-sm); }
.icon-btn { display: inline-grid; place-items: center; border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 4px; border-radius: var(--r-sm); transition: background-color .12s ease-out, color .12s ease-out; }
.icon-btn:hover { background: var(--panel-2); color: var(--text); }
.icon-btn:is([data-action^="delete"], [data-action^="remove"], [data-action^="clear"]):hover { color: var(--danger); }
/* With a mouse, a row's delete and a column's tools show when you point at it (or tab to it); touch screens always show them */
@media (hover: hover) {
  .item > .icon-btn[data-action="delete-task"], .item > .icon-btn[data-action="delete-event"], .board-tools { opacity: 0; transition: opacity .12s ease-out; }
  .item:hover > .icon-btn, .item:focus-within > .icon-btn, .board-col:hover .board-tools, .board-col:focus-within .board-tools { opacity: 1; }
}
/* Quick add's dropdowns are as wide as what they show, not their longest choice */
.qa-select { field-sizing: content; }
select.input { cursor: pointer; padding-right: 8px; }
.tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: var(--r-md); max-width: 100%; overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 6px 12px; border-radius: var(--r-sm); cursor: pointer; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow-sm); font-weight: 600; }

/* Read-only devices (phones): editing controls disappear */
body.readonly .edit-only { display: none !important; }

/* ===== Lists ===== */
.list { list-style: none; margin: 0; padding: 0; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
.item:last-child { border-bottom: 0; }
.item .body { flex: 1; min-width: 0; }
.item .title { overflow-wrap: anywhere; }
.item.done .title { color: var(--muted); }
/* Strikethrough a little below the middle of the letters (like To Do): drawn as a thin line behind the
   name only, so labels and badges next to it aren't struck. */
.item.done .tt, .day-item.doneon .tt, .task-card.done .tt, .chip.t-done .chip-t, .chip.doneon .chip-t, .pill.t-done {
  text-decoration: none;
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat; background-size: 100% 1.5px; background-position: 0 64%;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.meta { color: var(--muted); font-size: var(--t-sm); display: flex; gap: 4px 12px; flex-wrap: wrap; align-items: center; }
.meta > span { display: inline-flex; align-items: center; gap: 4px; }
.meta .overdue { color: var(--danger); font-weight: 600; }
.check { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
/* inline-block + nowrap: a pill that doesn't fit moves to the next line whole, never split in two. */
.pill { display: inline-block; white-space: nowrap; max-width: 100%; font-size: var(--t-xs); padding: 1px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.pill .i, .chip .i { width: 13px; height: 13px; vertical-align: -2px; }
.pill.high { background: color-mix(in srgb, var(--danger) 11%, transparent); color: color-mix(in srgb, var(--danger) 78%, var(--text)); }
.pill.med { background: color-mix(in srgb, var(--warn) 12%, transparent); color: color-mix(in srgb, var(--warn) 62%, var(--text)); }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); width: 54px; flex-shrink: 0; font-size: var(--t-sm); }

/* ===== My Day: one timeline of today ===== */
.grid-main.today { align-items: start; }
.today-side { display: grid; gap: 16px; align-content: start; min-width: 0; }
.tl-card .quick-add { margin-bottom: 4px; }
.tl-h { margin: 22px 0 2px; font-size: var(--t-sm); font-weight: 600; color: var(--muted); }
.tl-card > .tl-h:first-child, body.readonly .tl-card > .quick-add + .tl-h { margin-top: 0; }
.tl .time, .tl-date, .tl-now .time { white-space: nowrap; }
.tl-h.tl-late { color: var(--danger); }
.tl .time { width: 64px; }
.tl-row.tl-past .time { color: var(--danger); }
.tl-date { width: 92px; flex-shrink: 0; font-size: var(--t-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-mark { width: 20px; flex-shrink: 0; display: grid; place-items: center; color: var(--c-event); }
.tl-event .title { color: var(--text); }
.tl-now { display: flex; align-items: center; gap: 12px; padding: 2px 4px 2px 36px; list-style: none; }
.tl-now .time { color: var(--accent); font-weight: 600; }
.tl-rule { flex: 1; height: 2px; border-radius: 2px; background: var(--accent); }
.tl-card > .empty { padding: 28px 4px 12px; }

/* ===== Calendar ===== */
.cal-layout { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-head h2 { margin: 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { text-align: center; font-size: var(--t-xs); color: var(--muted); padding: 4px 0; }
.cal-day {
  min-height: 88px; padding: 6px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--panel);
  cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 3px; position: relative;
}
.cal-day .chip { max-width: 100%; }
/* Pointing at a task in a day lights it up (click opens it); the day itself still lights up its border */
.cal-day .chip[data-action="open-task"] { cursor: pointer; }
.cal-day .chip[data-action="open-task"]:hover { outline: 1.5px solid currentColor; outline-offset: 0; }
.check-space { width: 20px; flex-shrink: 0; }
/* Name shortens with "…"; the note ("· due 24th") never does */
.chip:has(.chip-t) { display: flex; gap: 3px; align-items: baseline; }
.chip-t { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* The note doesn't shrink while there's room; only in a very narrow cell does it give way too */
.chip-note { flex: 0 0 auto; white-space: nowrap; font-weight: 600; max-width: calc(100% - 2.4em); overflow: hidden; text-overflow: ellipsis; margin-left: 2px; }
.cal-legend-note { flex-basis: 100%; margin: 2px 0 0; }
.cal-day:hover { border-color: var(--accent); }
.cal-day.other { opacity: .45; }
.cal-day.today .num { background: var(--accent); color: var(--accent-ink); }
.cal-day.selected { outline: 2px solid var(--accent); outline-offset: -1px; }
.num { font-size: var(--t-xs); font-weight: 600; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.chip { font-size: var(--t-xs); padding: 1px 5px; border-radius: var(--r-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--accent-soft); color: var(--accent); }
.chip.task { background: var(--panel-2); color: var(--muted); }
.more { font-size: var(--t-xs); color: var(--muted); }

/* ===== Notes ===== */
.notes-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; min-height: 70vh; }
.note-list { display: flex; flex-direction: column; gap: 6px; max-height: 75vh; overflow: auto; }
.note-card { text-align: left; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--panel); cursor: pointer; transition: border-color .12s ease-out; }
.note-card:hover { border-color: color-mix(in srgb, var(--muted) 45%, var(--border)); }
.note-card.active { border-color: var(--accent); background: var(--accent-soft); }
.note-card .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-card .p { color: var(--muted); font-size: var(--t-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.editor { display: flex; flex-direction: column; gap: 10px; padding: 24px 32px 28px; }
.editor > * { width: 100%; max-width: 72ch; } /* a comfortable line length, however wide the window */
.note-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.editor .note-title { font-family: var(--font-display); font-size: var(--t-xl); font-weight: 500; border: 0; background: transparent; padding: 4px 0; outline: none; }
.editor textarea { flex: 1; min-height: 55vh; resize: vertical; border: 0; background: transparent; outline: none; line-height: 1.65; }
/* Borderless text fields show the keyboard focus as a line under them */
.editor .note-title:focus-visible, .editor textarea:focus-visible, .drawer-title:focus-visible { outline: none; box-shadow: 0 2px 0 var(--accent); }

/* ===== Task details drawer ===== */
.item .body.clickable, .task-card .body.clickable { cursor: pointer; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--panel);
  border-left: 1px solid var(--border); box-shadow: var(--shadow-float); z-index: 40;
  transform: translateX(105%); transition: transform .22s cubic-bezier(.2, .8, .2, 1); display: flex; flex-direction: column;
}
body.drawer-open .drawer { transform: none; }
.drawer-backdrop { display: none; position: fixed; inset: 0; background: var(--scrim); z-index: 39; }
body.drawer-open .drawer-backdrop { display: block; }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; border-bottom: 1px solid var(--border); }
.drawer-title { flex: 1; min-width: 0; font-family: var(--font-display); font-size: var(--t-lg); font-weight: 500; border: 0; background: transparent; outline: none; padding: 4px 0; }
.drawer-body { flex: 1; overflow: auto; padding: 12px 16px 20px; border: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.drawer-body > * { flex-shrink: 0; } /* scroll instead of squashing the notes box */
.drawer-body h3 { margin: 10px 0 0; font-size: var(--t-sm); font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.drawer-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field-grid label, .field { display: flex; flex-direction: column; gap: 3px; font-size: var(--t-xs); color: var(--muted); }
.field-grid .input, .field .input { color: var(--text); font-size: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.step { display: flex; align-items: center; gap: 8px; }
.step .check { width: 17px; height: 17px; }
.step-text { flex: 1; min-width: 0; border: 0; border-bottom: 1px solid transparent; background: transparent; padding: 5px 0; outline: none; }
.step-text:focus { border-bottom-color: var(--accent); }
.step.done .step-text { text-decoration: line-through; color: var(--muted); }
textarea.input { resize: vertical; line-height: 1.5; }
.pill.doing { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }

/* ===== Sticky top, board filling the window, group headings ===== */
.sticky-top { position: sticky; top: 0; z-index: 15; background: var(--bg); margin: -28px -32px 0; padding: 22px 32px 2px; }
.main.fill { height: 100vh; display: flex; flex-direction: column; padding-bottom: 12px; }
.main.fill #main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.main.fill .sticky-top { position: static; }
.main.fill .board { flex: 1; min-height: 0; overflow: auto; }
.board-head { position: sticky; top: -10px; z-index: 2; background: var(--panel-2); padding: 10px 0 6px; margin-top: -10px; }
.group-h { margin: 18px 4px 2px; font-size: var(--t-sm); font-weight: 600; color: var(--muted); display: flex; gap: 8px; }
.group-h:first-child { margin-top: 0; }

/* ===== Board, buckets & labels ===== */
.toolbar { margin-bottom: 12px; }
.toolbar .input { padding: 6px 10px; font-size: 14px; }
.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; align-items: flex-start; }
/* Columns share the width (280 to 380px each); more buckets than fit scroll sideways */
.board-col { flex: 1 0 280px; max-width: 380px; background: var(--panel-2); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; border: 2px solid transparent; }
.board-col.edit-only { flex: 0 0 260px; }
.board-col.over { border-color: var(--accent); }
.board-head { display: flex; align-items: center; gap: 6px; }
.board-head b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.board-head .meta { font-variant-numeric: tabular-nums; background: var(--panel); border-radius: 999px; padding: 0 8px; font-size: var(--t-xs); }
.board-tools .icon-btn { padding: 2px 5px; }
.board-cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
.task-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; box-shadow: var(--shadow-sm); display: flex; gap: 10px; align-items: flex-start; transition: border-color .12s ease-out; }
.task-card:hover { border-color: color-mix(in srgb, var(--muted) 45%, var(--border)); }
.task-card .body { flex: 1; min-width: 0; }
.task-card .title { overflow-wrap: anywhere; }
.task-card.done .title { color: var(--muted); }
.task-card.dragging { opacity: .5; }
/* Touch drag: the card that follows the finger, and no text selection or callout on a held card */
.drag-ghost { position: fixed; z-index: 60; pointer-events: none; opacity: .92; transform: rotate(2deg); box-shadow: var(--shadow-float); }
@media (prefers-reduced-motion: reduce) { .drag-ghost { transform: none; } }
@media (pointer: coarse) { .task-card { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; } }
.board-add-btn { width: 100%; text-align: left; border: 0; background: transparent; color: var(--muted); padding: 8px 10px; border-radius: var(--r-md); cursor: pointer; font-size: 14px; }
.board-add-btn:hover { background: var(--panel); color: var(--text); }
.add-card { flex-direction: column; align-items: stretch; gap: 8px; border-color: var(--accent); }
.add-card .input { padding: 7px 10px; font-size: 14px; }
.add-card .row { flex-wrap: nowrap; }
.add-card input[type="date"] { flex: 1; min-width: 0; }

/* ===== Quick add bar (To Do style) ===== */
.quick-add { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-md); margin-bottom: 12px; }
.card .quick-add { background: var(--bg); } /* inside a card it sits as a field, not a second card */
.quick-add:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.qa-main { display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px 14px; flex-wrap: wrap; }
.qa-circle { width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; color: var(--muted); font-size: 16px; line-height: 1; }
.quick-add:not(:focus-within) .qa-circle::before { content: "+"; }
.quick-add:not(:focus-within) .qa-circle { border-color: transparent; color: var(--accent); font-size: 22px; }
.qa-input { flex: 1; min-width: 200px; border: 0; background: transparent; padding: 10px 0; outline: none; font-size: var(--t-base); }
.qa-input:focus-visible { outline: none; } /* the whole bar shows the focus */
.qa-tools { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.qa-tool { position: relative; }
.qa-btn, .qa-select {
  display: inline-flex; align-items: center; gap: 5px;
  border: 0; background: transparent; color: var(--muted); padding: 6px 8px; border-radius: var(--r-sm); cursor: pointer; font-size: var(--t-sm); white-space: nowrap;
}
.qa-btn:hover, .qa-select:hover { background: var(--panel-2); color: var(--text); }
.qa-btn.set, .qa-select.set { color: var(--accent); font-weight: 600; }
.qa-select option { color: var(--text); background: var(--panel); }
.qa-native { position: absolute; inset: 0; opacity: 0; pointer-events: none; width: 100%; }
/* On a phone, opening the picker from code (showPicker) can be ignored: the tap lands on the invisible date box itself,
   which always opens the phone's own picker. */
body.phone .qa-native { pointer-events: auto; }
.qa-preview { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 12px 10px 44px; font-size: var(--t-sm); }
.qa-preview:empty { display: none; }
.qa-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 9px; }
.qa-chip.off { background: var(--panel-2); color: var(--muted); text-decoration: line-through; }
.qa-hint { color: var(--muted); }
.qa-link { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: var(--t-xs); padding: 0 4px; }
.empty.small { padding: 8px; font-size: var(--t-sm); }
.label-pill {
  display: inline-block; font-size: var(--t-xs); padding: 1px 8px; border-radius: 999px; white-space: nowrap;
  background: color-mix(in srgb, var(--lc) 18%, transparent); color: color-mix(in srgb, var(--lc) 80%, var(--text));
}
button.label-pill { border: 1px solid transparent; cursor: pointer; opacity: .5; }
button.label-pill.on { opacity: 1; border-color: var(--lc); }
.label-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.manage-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.manage-row .name { flex: 1; min-width: 0; }
.manage-row .input { padding: 4px 8px; font-size: var(--t-sm); }

/* ===== Recurring ===== */
.input.num { width: 64px; padding: 6px 8px; }
.weekdays { gap: 4px; }
.day-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel); cursor: pointer; font-size: var(--t-sm); }
.day-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.repeat { background: transparent; border: 1px dashed var(--border); color: var(--muted); }
.chip.repeat.est { border-style: dotted; font-style: italic; opacity: .8; } /* "after I finish it": an estimate */
/* Calendar colours: three meanings only. Late (overdue, or missed and done later) = danger; today = accent; everything
   else is ink: coming up on a quiet fill, done struck through and faded, events outlined, repeats dashed. */
:root { --c-overdue: var(--danger); --c-today: var(--accent); --c-late: var(--danger); --c-event: var(--muted); }
.chip.t-overdue, .pill.t-overdue { background: color-mix(in srgb, var(--c-overdue) 14%, transparent); color: var(--c-overdue); }
.chip.t-today, .pill.t-today { background: color-mix(in srgb, var(--c-today) 16%, transparent); color: var(--c-today); font-weight: 600; }
.chip.t-upcoming, .pill.t-upcoming { background: var(--panel-2); color: var(--text); }
/* Done: no colour of its own, the name faded with a clear strike line */
.chip.t-done, .pill.t-done, .chip.doneon, .pill.doneon { background: transparent; color: var(--muted); }
.chip.event, .pill.event { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
/* Late: on the due day "missed" (the late colour, no strike); on the done day "done" with a late outline */
.late { color: var(--c-late); font-weight: 600; }
.chip.t-latedue, .pill.t-latedue { background: color-mix(in srgb, var(--c-late) 14%, transparent); color: var(--c-late); }
.chip.doneon, .pill.doneon { box-shadow: inset 0 0 0 1px var(--c-late); }
.chip.doneon .chip-note { color: var(--c-late); }
.pill.doneon, .pill.t-latedue { white-space: normal; text-decoration: none; }
.day-item { padding-left: 4px; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-size: var(--t-xs); color: var(--muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legend .chip { font-style: normal; }
/* The phone shows a mark per day instead of names: late days get the late colour */
.cal-legend.phone-only { display: none; }
.cal-mark { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.cal-mark.late { background: var(--c-late); }
/* Pointing at one half of a late task lights up the other */
.chip.late-hl { outline: 2px solid var(--c-late); outline-offset: 1px; }
.repeat-box { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--panel-2); }

/* ===== Attachments ===== */
.attachments { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.attach { display: flex; align-items: center; gap: 8px; }
.link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-align: left; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-btn:hover { text-decoration: underline; }
.link-btn:disabled { color: var(--text); cursor: default; text-decoration: none; }
.keep-btn { opacity: .45; }
.keep-btn.on { opacity: 1; color: var(--accent); }
.history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.history-item { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-md); display: flex; flex-direction: column; gap: 4px; }
.history-note { font-style: italic; }

/* ===== Task panel cards (To Do style) ===== */
.p-card { background: var(--panel-2); border-radius: var(--r-md); display: flex; flex-direction: column; overflow: hidden; }
.p-row {
  display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 12px; width: 100%;
  border: 0; background: transparent; color: var(--text); text-align: left; font-size: 14px;
}
.p-row + .p-row, .p-sub + .p-row, .p-row + .p-sub { border-top: 1px solid var(--border); }
.p-wrap { flex-wrap: wrap; }
.p-click { cursor: pointer; }
.p-click:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.p-row.on, .p-row.on .p-input, .p-row.on .p-select { color: var(--accent); }
.p-row.overdue, .p-row.overdue .p-input { color: var(--danger); }
.p-ico { width: 22px; display: inline-grid; place-items: center; flex-shrink: 0; color: var(--muted); }
.p-row.on .p-ico, .p-row.overdue .p-ico { color: inherit; }
.p-ico.accent, .p-input.accent::placeholder { color: var(--accent); }
.p-lbl { color: var(--muted); width: 62px; flex-shrink: 0; font-size: var(--t-sm); }
.p-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.p-text.muted { color: var(--muted); }
.p-select, .p-input {
  flex: 1; min-width: 0; border: 0; background: transparent; color: inherit; padding: 6px 6px;
  border-radius: var(--r-sm); font-size: 14px;
}
.p-select:hover, .p-input:hover { background: var(--panel); }
.p-select:focus, .p-input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.p-select option { color: var(--text); background: var(--panel); }
.p-input:disabled { opacity: .45; cursor: not-allowed; }
.p-row > .p-input[type="date"] { flex: 1 0 9.5em; } /* wide enough to show the whole date */
body.readonly .p-input:disabled, body.readonly .p-select:disabled { opacity: 1; cursor: default; } /* read-only: plain, readable values */
/* Phones draw an empty date or time box as nothing at all: give it a visible box to tap, and hide the time until there's a date. */
body.phone .p-input[type="date"], body.phone .p-input[type="time"] { border: 1px solid var(--border); background: var(--panel); min-height: 36px; }
body.phone:not(.readonly) .p-input[type="time"]:disabled { display: none; } /* read-only keeps a set time on show */
/* A phone's date box needs room to show its date (too narrow, it shows only its arrow): the time goes onto the next line when it doesn't fit. */
body.phone .p-row:has(> .p-input[type="date"]) { flex-wrap: wrap; }
body.phone .p-input[type="date"] { flex: 1 1 150px !important; }
body.phone .p-input[type="time"] { flex: 1 1 120px !important; }
.p-check { display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 8px; }
.p-check input { margin-top: 2px; flex-shrink: 0; }
.p-mini { border: 0; background: none; color: var(--muted); font-size: var(--t-xs); cursor: pointer; text-decoration: underline; padding: 0 2px; }
.p-sub { padding: 8px 12px 12px 44px; display: flex; flex-direction: column; gap: 8px; }
.p-sub.row { flex-direction: row; flex-wrap: wrap; align-items: center; }
.p-sub .repeat-box { background: transparent; border: 0; padding: 0; }
.period-row { flex-wrap: nowrap; gap: 8px; white-space: nowrap; }
.period-row .input { flex: 1; min-width: 0; }
.period-hint, .repeat-next { display: block; margin: 0; } /* plain text, so bold parts stay in the sentence */
.p-head { display: flex; justify-content: space-between; padding: 10px 12px 2px; font-size: var(--t-sm); font-weight: 600; color: var(--muted); }
.p-card .steps { padding: 4px 12px 0; }
.p-notes { width: 100%; min-height: 110px; border: 0; background: transparent; padding: 12px; resize: vertical; color: inherit; outline: none; font: inherit; line-height: 1.5; }
.p-notes:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.p-notes::placeholder { color: var(--muted); }
.num-box {
  width: 70px; padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--panel);
  color: var(--text); text-align: center; font-size: 14px;
}
.num-box:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

/* ===== Pop-up (Done on…) ===== */
.modal-back { position: fixed; inset: 0; background: var(--scrim); z-index: 60; }
.modal {
  position: fixed; z-index: 61; left: 50%; top: 30%; transform: translate(-50%, -30%); width: min(380px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-float);
  padding: 20px; display: flex; flex-direction: column; gap: 12px;
}
.modal h3 { margin: 0; font-size: var(--t-md); font-weight: 600; }
.modal .field { flex: 1; min-width: 130px; }
.modal .ask-q { margin: 0; line-height: 1.45; overflow-wrap: anywhere; }

/* ===== Banners & toasts ===== */
.banner { padding: 12px 14px; border-radius: var(--r-md); background: var(--accent-soft); margin-bottom: 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner > span:first-child { display: flex; align-items: flex-start; gap: 8px; min-width: 0; flex: 1 1 260px; }
.banner > span:first-child > .i { margin-top: 2px; }
.banner.warn { background: color-mix(in srgb, var(--warn) 14%, var(--panel)); }
.banner.error { background: color-mix(in srgb, var(--danger) 12%, var(--panel)); }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.status-dot.on { background: var(--ok); }
.status-dot.warn { background: var(--warn); }
.status-dot.bad { background: var(--danger); }
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: var(--r-md); box-shadow: var(--shadow-float); max-width: 320px; animation: pop .2s ease-out; }
.toast-undo { display: flex; align-items: center; gap: 14px; }
.toast-undo > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast-btn { border: 0; background: transparent; color: var(--accent-soft); font-weight: 600; cursor: pointer; padding: 4px 6px; border-radius: var(--r-sm); text-decoration: underline; text-underline-offset: 3px; }
.toast-btn:hover { background: color-mix(in srgb, var(--bg) 14%, transparent); }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } }

/* ===== Phones & narrow screens ===== */
@media (max-width: 900px) {
  .grid-2, .grid-main, .cal-layout, .notes-layout { grid-template-columns: 1fr; }
  .cal-day { min-height: 60px; }
}
@media (max-width: 680px) {
  .app { flex-direction: column; }
  .sidebar {
    position: fixed; bottom: 0; top: auto; left: 0; right: 0; height: auto; width: auto; z-index: 20;
    flex-direction: row; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    border-right: 0; border-top: 1px solid var(--border);
  }
  .brand, .side-foot { display: none; }
  .nav-btn { flex-direction: column; gap: 2px; font-size: var(--t-xs); padding: 6px 2px; flex: 1; min-width: 0; align-items: center; }
  .nav-btn > span:not(.ico):not(.nav-count) { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-btn .nav-count { position: absolute; margin: 0 0 0 22px; top: 4px; }
  .nav-btn { position: relative; }
  .nav-btn .lbl-long { display: none; }
  .nav-btn .lbl-short { display: inline; }
  .main { padding: 20px 16px 90px; }
  /* The phone's status banner is one compact line, so today's tasks are on the first screen */
  .banner { padding: 8px 12px; font-size: var(--t-sm); gap: 8px; margin-bottom: 12px; }
  .banner .btn.small { padding: 4px 9px; }
  .page-head { margin-bottom: 16px; }
  .page-head h1 { font-size: var(--t-xl); }
  .tl-date { width: 74px; }
  .tl .time, .tl-now .time { width: 62px; font-size: var(--t-xs); }
  .tl-now { padding-left: 32px; }
  .editor { padding: 16px; }
  .settings-grid { grid-template-columns: 1fr; }
  .cal-day .chip, .cal-day .more { display: none; }
  .cal-day { min-height: 46px; align-items: center; }
  .cal-day.has-items::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .cal-day.has-late::after { background: var(--c-late); }
  .cal-legend.desk-only { display: none; }
  .cal-legend.phone-only { display: flex; }
  .toasts { bottom: 80px; }
  .drawer { width: 100%; }
  .field-grid { grid-template-columns: 1fr; }
  .board-col { flex-basis: 82vw; }
  .sticky-top { margin: -20px -16px 0; padding: 16px 16px 2px; }
  .main.fill { height: auto; display: block; }
  .main.fill .board { overflow: auto; }
  .qa-input { min-width: 0; flex-basis: calc(100% - 40px); }
  .qa-tools { padding-left: 22px; }
  .qa-preview { padding-left: 14px; }
}
</style>
