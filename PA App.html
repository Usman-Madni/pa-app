<script>
'use strict';
/* PA App — tasks, reminders, notes and a calendar in one file.
   Data lives in localStorage (pa_* keys) and is mirrored to a JSON data file the user links once
   (File System Access API, Chrome/Edge desktop). Browsers without that API (phones) are read-only:
   they open the data file to view it but can never change it, so copies can't drift apart.
   Read PA_APP_CONTEXT.md before changing the data model or the save logic. */

// ===================== Helpers =====================
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// An icon from the sprite at the end of <body> (Tabler outline). Decorative: the words beside it carry the meaning.
const ic = (name, cls = '') => `<svg class="i${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
// Some messages and quick-add notes are kept as text starting with a symbol ("🔔 Pay rent"): stored notifications keep
// that wording. Shown, the symbol becomes the matching icon.
const GLYPH_ICONS = { '🔔': 'bell', '📅': 'calendar-event', '↻': 'repeat', '❗': 'exclamation-mark', '▦': 'layout-kanban', '🏷': 'tag' };
const iconText = (s) => {
  const m = /^(\S+) ([\s\S]*)$/.exec(String(s ?? ''));
  return m && GLYPH_ICONS[m[1]] ? `${ic(GLYPH_ICONS[m[1]], 'sm')} ${esc(m[2])}` : esc(s);
};
const pad = (n) => String(n).padStart(2, '0');

// Dates are always local YYYY-MM-DD. Never use .toISOString() for a date: it converts to UTC and
// shifts the day in any timezone away from UTC. toISOString is only for exact instants such as savedAt.
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const parseISO = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const monthStart = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
const fmtTime = (hhmm) => {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  return new Date(2000, 0, 1, h, m).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true }); // "1:52 PM", whatever the region's clock
};
const fmtDay = (k) => parseISO(k).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
const fmtClock = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }; // 'HH:mm' for a time box
const fmtStamp = (iso) => (iso ? new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short', hour12: true }) : '—');

// Record IDs: time + crypto random + a counter, so two devices (or two clicks in the same millisecond) never collide.
let idCounter = 0;
function uid() {
  const r = new Uint32Array(2);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(r);
  else { r[0] = Math.random() * 2 ** 32; r[1] = Math.random() * 2 ** 32; }
  return `${Date.now().toString(36)}-${r[0].toString(36)}${r[1].toString(36)}-${(idCounter++).toString(36)}`;
}

// A message for 5 seconds; it's also kept in Notifications (Notices). task = the task it's about, if one.
function toast(msg, task) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = iconText(msg);
  $('#toasts').append(el);
  setTimeout(() => el.remove(), 5000);
  Notices.add(msg, task);
}

// A deleted task waits UNDO_MS with an Undo button before it's really deleted. Until then it's only hidden here:
// nothing (the data file, the other device, To Do) sees a deletion that might be taken back. Leaving the page, or
// the screen going to the background on a phone, carries it out at once.
const PendingDelete = {
  UNDO_MS: 6000,
  ids: new Map(), // task id → { timer, toast }
  has(id) { return this.ids.has(id); },
  start(t) {
    const toastEl = document.createElement('div');
    toastEl.className = 'toast toast-undo';
    toastEl.innerHTML = `<span>Deleted "${esc(fullTitle(t))}"</span><button type="button" class="toast-btn" data-action="undo-delete" data-id="${esc(t.id)}">Undo</button>`;
    $('#toasts').append(toastEl);
    const timer = setTimeout(() => this.commit(t.id), this.UNDO_MS);
    this.ids.set(t.id, { timer, toast: toastEl });
    if (state.openTask === t.id) closeTaskDrawer();
    render();
  },
  commit(id) {
    const p = this.ids.get(id);
    if (!p) return;
    clearTimeout(p.timer);
    p.toast.remove();
    this.ids.delete(id);
    const before = DB.tasks.length;
    DB.tasks = DB.tasks.filter((x) => x.id !== id);
    if (DB.tasks.length !== before) changed('tasks');
    render();
  },
  undo(id) {
    const p = this.ids.get(id);
    if (!p) return;
    clearTimeout(p.timer);
    p.toast.remove();
    this.ids.delete(id);
    render();
  },
  flush() { for (const id of [...this.ids.keys()]) this.commit(id); },
};
const hiddenTask = (t) => PendingDelete.has(t.id);

// ===================== Questions =====================
// The app's own question box, in its style, instead of the browser's grey one. ask() answers true/false;
// askText() answers the text typed, or null if cancelled. Enter = yes; Esc, Cancel or a click outside = no.
let asking = null; // {resolve, withText} while a question is open
const ask = (question, opts) => openAsk(question, opts, false);
const askText = (question, value = '', opts) => openAsk(question, opts, true, value);
function openAsk(question, { yes = 'OK', no = 'Cancel', danger = false } = {}, withText = false, value = '') {
  if (asking) answerAsk(false); // only one at a time
  return new Promise((resolve) => {
    asking = { resolve, withText };
    $('#modal').innerHTML = `
      <div class="modal-back" data-action="ask-no"></div>
      <form class="modal" data-form="ask" role="alertdialog" aria-label="${esc(question)}">
        <p class="ask-q">${esc(question)}</p>
        ${withText ? `<input class="input" name="answer" value="${esc(value)}" autocomplete="off" aria-label="${esc(question)}">` : ''}
        <div class="row" style="justify-content:flex-end">
          <button type="button" class="btn" data-action="ask-no">${esc(no)}</button>
          <button class="btn ${danger ? 'danger' : 'primary'}" data-ask-yes>${esc(yes)}</button>
        </div>
      </form>`;
    const first = $(withText ? '#modal [name="answer"]' : '#modal [data-ask-yes]');
    first.focus();
    if (withText) first.select();
  });
}
function answerAsk(yes) {
  if (!asking) return;
  const { resolve, withText } = asking;
  const text = withText ? $('#modal [name="answer"]').value : '';
  asking = null;
  $('#modal').innerHTML = '';
  resolve(withText ? (yes ? text : null) : yes);
}

// ===================== Per-device settings =====================
// Things that belong to this browser only (theme, open screen, save bookkeeping). They never go
// into the data file or backups, otherwise one computer's flags would overwrite another's.
const device = {
  get(key, fallback) {
    try { const v = localStorage.getItem('dev_' + key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem('dev_' + key, JSON.stringify(value)); } catch { /* private mode: settings just won't stick */ }
  },
  remove(key) { try { localStorage.removeItem('dev_' + key); } catch { /* ignore */ } },
};
const deviceName = () => device.get('name', /Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Phone' : 'Computer');

// ===================== Shared data =====================
// tasks:   see TASK_DEFAULTS below
// notes:   {id, title, body, updated}
// events:  {id, title, date:'YYYY-MM-DD', time:'HH:mm'|''}
// buckets: {id, name, order}
// labels:  {id, name, color:'#rrggbb'}
// Changing these shapes means old data files must still load — see PA_APP_CONTEXT.md.
// notices: {id, at: ms, text, task?: id, read} — every message shown, kept 30 days (see Notices)
// deleted: {key, id, at: ms} — a record deleted here, kept 30 days so a merge doesn't bring it back (see Stamps)
// Every record above also gets `updated` (ms): when it last changed (see Stamps; notes already had it).
const DATA_KEYS = ['tasks', 'notes', 'events', 'buckets', 'labels', 'notices', 'deleted'];
const RECORD_KEYS = DATA_KEYS.filter((k) => k !== 'deleted'); // lists of records, merged record by record
const REQUIRED_KEYS = ['tasks', 'notes', 'events']; // files from before buckets/labels have only these

// Every task field with its default. Old tasks get the missing fields filled in on load.
const TASK_DEFAULTS = {
  title: '',
  due: '',            // 'YYYY-MM-DDTHH:mm' local time, or '' = no due date
  start: '',          // 'YYYY-MM-DD' or ''
  priority: 'low',    // 'low' | 'med' | 'high'
  progress: 'not',    // 'not' | 'doing' (done is the separate `done` flag)
  reminders: [],      // see Reminders: {id, kind:'before'|'dayof'|'at', minutes, daysBefore, time, at, fired}
  done: false,
  completedAt: 0,     // ms
  completedAllDay: false, // done "on a day" without a time
  created: 0,         // ms
  myDay: '',          // 'YYYY-MM-DD' the task was added to My Day; only counts on that day
  bucket: '',         // bucket id or ''
  labels: [],         // label ids
  notes: '',
  checklist: [],      // {id, text, done}
  repeat: null,       // see nextDue()
  seriesId: '',       // shared by all copies of a repeating task
  spawnedNext: '',    // id of the next copy, once created (so ticking twice never makes two)
  seriesIndex: 1,     // which copy of a repeating task this is (1 = the first) — for "ends after N times"
  attachments: [],    // {id, name, file, size, type, added} — file is the name inside the attachments folder
  period: '',         // the "moving part" shown after the title, e.g. "Oct 26" → "Phone bill (Oct 26)"; moves forward with each repeat
  todo: null,         // its copy in Microsoft To Do: {id, base} (base = how both sides looked after the last sync), {removed:true}, or null — see TD
};
function normalizeTask(t) {
  const n = { ...TASK_DEFAULTS, ...t };
  // Before the moving part had its own field, dates in a repeating task's title moved forward ("Aug bill").
  if (!('period' in t) && t.repeat && !t.repeat.keepTitle) Object.assign(n, splitPeriod(n.title));
  for (const k of ['labels', 'checklist', 'attachments']) n[k] = Array.isArray(t[k]) ? t[k] : []; // fresh arrays, never shared
  // Before multiple reminders, a task had one: remind (minutes before due, -1 = none) + notified.
  if (!Array.isArray(t.reminders)) {
    n.reminders = t.remind != null && Number(t.remind) >= 0 ? [{ id: uid(), kind: 'before', minutes: Number(t.remind), fired: !!t.notified }] : [];
  }
  delete n.remind;
  delete n.notified;
  return n;
}

const DB = {
  tasks: [], notes: [], events: [], buckets: [], labels: [], notices: [], deleted: [],
  load() {
    for (const k of DATA_KEYS) {
      try { this[k] = JSON.parse(localStorage.getItem('pa_' + k)) || []; } catch { this[k] = []; }
    }
    this.tasks = this.tasks.map(normalizeTask);
    Stamps.reset();
  },
  persist(k) {
    if (state.readOnly) return;
    try { localStorage.setItem('pa_' + k, JSON.stringify(this[k])); } catch { toast('Could not save in this browser — storage is full or blocked'); }
  },
  exportAll() { return Object.fromEntries(DATA_KEYS.map((k) => [k, this[k]])); },
  loads: 0, // how many times everything was replaced (a sync in progress checks it: its tasks are old copies then)
  importAll(data) {
    if (!data || !REQUIRED_KEYS.every((k) => Array.isArray(data[k]))) throw new Error('This file has no PA App data in it');
    this.loads++;
    for (const k of DATA_KEYS) this[k] = Array.isArray(data[k]) ? data[k] : [];
    this.tasks = this.tasks.map(normalizeTask);
    Stamps.reset();
    for (const k of DATA_KEYS) this.persist(k);
  },
  // Nothing of yours here (messages shown and deleted markers don't count, so they never make a fresh browser
  // look like it has data).
  isEmpty() { return RECORD_KEYS.every((k) => k === 'notices' || this[k].length === 0); },
};

// ===================== When each record last changed =====================
// So two devices' copies of the data file can be merged record by record (mergeData), every record carries
// `updated`: when it last changed. changed() works it out by comparing each record with how it looked last time
// (so no edit has to remember to set it). A record that disappears leaves a deleted marker for 30 days, so a merge
// with a copy that still has it doesn't bring it back.
const Stamps = {
  KEEP_MS: 30 * 864e5,
  seen: {}, // key → Map(id → the record as it last looked, without `updated`)
  sig(r) { const { updated, ...rest } = r; return JSON.stringify(rest); },
  // Take the data as it is now as the starting point (after loading or merging): nothing counts as changed.
  reset() { for (const k of RECORD_KEYS) this.seen[k] = new Map(DB[k].map((r) => [r.id, this.sig(r)])); },
  // Stamp what changed in these keys and mark what went. Returns true if the deleted markers changed.
  touch(keys, now = Date.now()) {
    let marks = false;
    for (const k of keys) {
      if (!RECORD_KEYS.includes(k)) continue;
      const before = this.seen[k] || new Map();
      const after = new Map();
      for (const r of DB[k]) {
        const s = this.sig(r);
        if (before.get(r.id) !== s) r.updated = now;
        after.set(r.id, s);
      }
      for (const id of before.keys()) if (!after.has(id)) { DB.deleted.push({ key: k, id, at: now }); marks = true; }
      this.seen[k] = after;
    }
    const kept = DB.deleted.filter((m) => m.at > now - this.KEEP_MS);
    if (kept.length !== DB.deleted.length) { DB.deleted = kept; marks = true; }
    return marks;
  },
};

// Two copies of the data (this browser's and the data file's, saved elsewhere since) as one: record by record, the
// newer change wins the whole record; a record deleted on one side stays deleted unless it was changed after that.
function mergeData(mine, theirs, now = Date.now()) {
  const marks = new Map();
  for (const m of [...(mine.deleted || []), ...(theirs.deleted || [])]) {
    const k = `${m.key}:${m.id}`;
    if (m.at > now - Stamps.KEEP_MS && (!marks.has(k) || marks.get(k).at < m.at)) marks.set(k, m);
  }
  const out = { deleted: [...marks.values()] };
  for (const key of RECORD_KEYS) {
    const a = new Map((mine[key] || []).map((r) => [r.id, r]));
    const b = new Map((theirs[key] || []).map((r) => [r.id, r]));
    const ids = [...a.keys(), ...[...b.keys()].filter((id) => !a.has(id))]; // this side's order, then theirs
    out[key] = [];
    for (const id of ids) {
      const ra = a.get(id), rb = b.get(id);
      const r = ra && rb ? ((rb.updated || 0) > (ra.updated || 0) ? rb : ra) : ra || rb;
      const gone = marks.get(`${key}:${id}`);
      if (gone && gone.at >= (r.updated || 0)) continue;
      out[key].push(r);
    }
  }
  return out;
}

// Every edit goes through here: save in the browser, then queue a save to the data file (the phone: to OneDrive).
function changed(...keys) {
  if (state.readOnly) return;
  if (Stamps.touch(keys) && !keys.includes('deleted')) keys = [...keys, 'deleted'];
  keys.forEach((k) => DB.persist(k));
  if (state.phone) OD.markDirty(); else DF.markDirty();
  if (keys.includes('tasks')) TD.tasksChanged(); // the phone's copy in To Do follows a few seconds later
}

// ===================== Notifications =====================
// Every message PA App shows is kept with its time for 30 days, so one that came and went unseen can be read later
// (Notifications in the sidebar). It's in the data file, so the phone view can read it too; only the computer adds.
const Notices = {
  KEEP_MS: 30 * 864e5,
  adding: false,
  add(text, task) {
    if (state.readOnly || this.adding) return; // never from a read-only device; never while saving one (a save problem toasts)
    this.adding = true;
    try {
      const now = Date.now();
      DB.notices = DB.notices.filter((n) => n.at > now - this.KEEP_MS);
      DB.notices.push({ id: uid(), at: now, text, ...(task ? { task } : {}), read: state.view === 'notices' });
      changed('notices');
      renderUnread();
      if (state.view === 'notices' && !document.querySelector('#main :focus')) render();
    } finally { this.adding = false; }
  },
  unread() { return DB.notices.filter((n) => !n.read).length; },
  markRead() {
    if (state.readOnly || !this.unread()) return;
    DB.notices.forEach((n) => { n.read = true; });
    changed('notices');
  },
  clear() { DB.notices = []; changed('notices'); },
};
function renderUnread() {
  const el = $('#notice-count');
  if (!el) return;
  const n = state.readOnly ? 0 : Notices.unread();
  el.textContent = n > 99 ? '99+' : String(n);
  el.hidden = !n;
}

// ===================== Screen state =====================
const params = new URLSearchParams(location.search);
function isPhone() {
  if (navigator.userAgentData && navigator.userAgentData.mobile) return true;
  return /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPad asking for the desktop site
}
const state = {
  view: device.get('view', 'today'),
  taskFilter: 'active',
  noteQuery: '',
  activeNote: null,
  calMonth: monthStart(new Date()),
  selectedDay: todayISO(),
  // A phone: a phone or tablet (even one whose Chrome can write files — it must never make a second copy), a browser
  // that can't write files (Safari, Firefox), or ?readonly in the address. It reaches the data file through OneDrive,
  // never a file of its own, and leaves files, the To Do sync and the data-file settings to the laptop.
  phone: isPhone() || typeof window.showOpenFilePicker !== 'function' || params.has('readonly'),
  // Can't change anything right now: a phone that isn't signed in to OneDrive and online with the file read
  // (OD.canEdit), or ?readonly. Starts true on a phone; OD.refreshMode() opens editing up.
  readOnly: isPhone() || typeof window.showOpenFilePicker !== 'function' || params.has('readonly'),
  remindedHere: new Set(), // read-only devices remember shown reminders here instead of changing the data
  openTask: null,          // id of the task shown in the details drawer
  taskBucket: '',          // Tasks filter: '' all, '-' no bucket, or a bucket id
  taskLabel: '',           // Tasks filter: '' all, or a label id
  boardAdd: null,          // bucket id whose "+ Add task" card is open on the board ('' = No bucket)
  remCustom: null,         // which custom reminder form is open in the drawer: 'before' | 'dayof' | 'at'
  remEdit: null,           // id of the reminder being changed in that form (null = adding a new one)
  donePrompt: null,        // id of the task whose "Done on…" pop-up is open
  labelManage: false,      // the panel's label list is open for renaming / recolouring / deleting
};

// ===================== Data file (auto-save) =====================
const FILE_TYPES = [{ description: 'PA App data', accept: { 'application/json': ['.json'] } }];
// A daily backup's file name (local time), the same on the laptop and the phone: "PA App Backup 09-11-26 3-05pm.json".
const backupName = (now) => {
  const h = now.getHours() % 12 || 12;
  return `PA App Backup ${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${String(now.getFullYear()).slice(2)} ${h}-${pad(now.getMinutes())}${now.getHours() < 12 ? 'am' : 'pm'}.json`;
};
const DF = {
  DEBOUNCE_MS: 2000,
  POLL_MS: 20000,
  handle: null,
  backupDir: null,
  status: 'none',      // none | reconnect | ok | conflict | error
  conflict: null,      // the file's contents while a conflict is open
  fileInfo: null,      // {savedAt, savedFrom}
  error: '',
  saving: false,
  timer: null,

  async init() {
    if (state.phone) return; // the phone reaches the file through OneDrive (OD)
    const [h, b] = await Promise.all([idb.get('data'), idb.get('backups')]);
    this.backupDir = b || null;
    if (!h) { renderStatus(); return; }
    this.handle = h;
    if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted') await this.check();
    else { this.status = 'reconnect'; renderStatus(); }
  },

  // Browsers ask again for file access after a restart; this must run from a click.
  async reconnect() {
    try {
      if ((await this.handle.requestPermission({ mode: 'readwrite' })) !== 'granted') return toast('Permission not given — data is only saving in this browser');
      if (this.backupDir) await this.backupDir.requestPermission({ mode: 'readwrite' }).catch(() => {});
      if (AT.status === 'reconnect') await AT.reconnect(); // one click brings the attachments folder back too
      await this.check();
    } catch (e) { this.fail(e); }
  },

  async createNew() {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: 'pa-app-data.json', types: FILE_TYPES });
      await this.attach(h);
      await this.write();
      toast('Data file created — changes now save to it automatically');
    } catch (e) { if (e.name !== 'AbortError') this.fail(e); }
  },

  async openExisting() {
    try {
      const [h] = await window.showOpenFilePicker({ types: FILE_TYPES });
      if ((await h.requestPermission({ mode: 'readwrite' })) !== 'granted') return toast('Permission not given');
      await this.attach(h);
      await this.check();
    } catch (e) { if (e.name !== 'AbortError') this.fail(e); }
  },

  async attach(h) {
    this.handle = h;
    this.status = 'ok';
    // A different file means the last-seen version no longer applies.
    device.remove('seenToken');
    await idb.set('data', h);
  },

  async unlink() {
    this.handle = null;
    this.status = 'none';
    this.conflict = null;
    this.fileInfo = null;
    device.remove('seenToken');
    await idb.del('data');
    render();
  },

  async readFile() {
    const text = await (await this.handle.getFile()).text();
    if (!text.trim()) return null;
    const file = JSON.parse(text);
    if (!file || file.app !== 'PA App' || !file.data) throw new Error('That file is not a PA App data file');
    return file;
  },

  // Compare the file with this browser and decide: carry on, load the newer file, or ask.
  async check() {
    if (!this.handle || this.status === 'conflict') return;
    try {
      const file = await this.readFile();
      if (!file) { this.status = 'ok'; await this.write(); return; } // brand-new empty file
      this.fileInfo = { savedAt: file.savedAt, savedFrom: file.savedFrom };
      const seen = device.get('seenToken', null);
      const unsaved = device.get('unsaved', false);
      if (file.saveToken === seen) {
        this.status = 'ok';
        if (unsaved) this.schedule();
      } else if (!unsaved || DB.isEmpty()) {
        // Someone else saved and we have nothing of our own to lose. An empty browser never wins.
        this.load(file);
        toast(`Loaded the latest data (saved on ${file.savedFrom || 'another device'})`);
      } else if (seen) {
        await this.mergeIn(file); // the same file, saved elsewhere since: put both sides' changes together
      } else {
        // A different file, and this browser has data too: mixing two unrelated sets would be a mess, so ask.
        this.status = 'conflict';
        this.conflict = file;
      }
    } catch (e) { this.fail(e); } finally {
      renderStatus();
      if (this.status === 'ok') TD.soon(); // To Do waits for the data file (e.g. Reconnect after a restart)
    }
  },

  load(file) {
    DB.importAll(file.data);
    device.set('seenToken', file.saveToken);
    device.set('unsaved', false);
    this.fileInfo = { savedAt: file.savedAt, savedFrom: file.savedFrom };
    this.status = 'ok';
    this.conflict = null;
    this.error = '';
    render();
    renderDrawer();
  },

  // Both this browser and the file changed since they were last in step: record by record, the newer change wins
  // (mergeData). The result is shown here and saved to the file straight away.
  async mergeIn(file) {
    Stamps.touch(RECORD_KEYS); // anything changed here but not yet stamped counts as changed now
    DB.importAll(mergeData(DB.exportAll(), file.data));
    device.set('seenToken', file.saveToken); // what we write next replaces exactly that version
    this.status = 'ok';
    this.conflict = null;
    await this.write();
    toast(`Brought in changes saved on ${file.savedFrom || 'another device'}`);
    render();
    renderDrawer();
  },

  markDirty() {
    device.set('unsaved', true);
    this.schedule();
    renderStatus();
  },

  schedule() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.save(), this.DEBOUNCE_MS);
  },

  async save() {
    if (!this.handle || this.status !== 'ok') return;
    if (this.saving) return this.schedule();
    this.saving = true;
    try {
      const file = await this.readFile();
      // The file moved on since we last read it (saved elsewhere): merge both sides' changes, never overwrite them.
      if (file && file.saveToken !== device.get('seenToken', null)) await this.mergeIn(file);
      else await this.write();
    } catch (e) { this.fail(e); } finally { this.saving = false; renderStatus(); }
  },

  async write() {
    const payload = {
      app: 'PA App',
      version: 2,
      saveToken: uid(),
      savedAt: new Date().toISOString(), // instant, not a calendar date
      savedFrom: deviceName(),
      data: DB.exportAll(),
    };
    const w = await this.handle.createWritable(); // writes to a temp copy, swapped in on close
    await w.write(JSON.stringify(payload, null, 1));
    await w.close();
    device.set('seenToken', payload.saveToken);
    device.set('unsaved', false);
    this.fileInfo = { savedAt: payload.savedAt, savedFrom: payload.savedFrom };
    this.status = 'ok';
    this.error = '';
    await this.dailyBackup(payload);
  },

  async keepMine() {
    this.status = 'ok';
    this.conflict = null;
    try { await this.write(); toast("Saved this device's version to the file"); } catch (e) { this.fail(e); }
    renderStatus();
  },

  useTheirs() {
    this.load(this.conflict);
    toast("Loaded the file's version");
  },

  async pickBackupFolder() {
    try {
      this.backupDir = await window.showDirectoryPicker({ mode: 'readwrite' });
      await idb.set('backups', this.backupDir);
      device.remove('lastBackupDay');
      await this.dailyBackup({ app: 'PA App', version: 2, savedAt: new Date().toISOString(), savedFrom: deviceName(), data: DB.exportAll() });
      render();
    } catch (e) { if (e.name !== 'AbortError') this.fail(e); }
  },

  // First save of each day also drops a dated copy in the backups folder. Never overwrites a backup.
  async dailyBackup(payload) {
    if (!this.backupDir) return;
    const day = todayISO();
    if (device.get('lastBackupDay', '') === day) return;
    try {
      if ((await this.backupDir.queryPermission({ mode: 'readwrite' })) !== 'granted') return;
      const name = backupName(new Date());
      let exists = true;
      try { await this.backupDir.getFileHandle(name); } catch { exists = false; }
      if (!exists) {
        const w = await (await this.backupDir.getFileHandle(name, { create: true })).createWritable();
        await w.write(JSON.stringify(payload, null, 1));
        await w.close();
      }
      device.set('lastBackupDay', day);
    } catch (e) {
      toast('Daily backup failed: ' + e.message);
    }
  },

  fail(e) {
    this.status = this.handle ? 'error' : 'none';
    this.error = e && e.name === 'NotFoundError'
      ? 'The data file isn\'t where it was. If you moved it (say, into OneDrive › Apps › PA App › Data), choose it again: Settings › Open existing data file.'
      : e.message || String(e);
    renderStatus();
  },
};

// IndexedDB keeps the file handles so the link survives restarts (localStorage can't hold them).
const idb = {
  open() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('no IndexedDB'));
      const req = indexedDB.open('pa_datafile', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async run(mode, fn) {
    try {
      const db = await this.open();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction('handles', mode);
        const req = fn(tx.objectStore('handles'));
        tx.oncomplete = () => resolve(req.result);
        tx.onerror = () => reject(tx.error);
      });
    } catch { return undefined; }
  },
  get(key) { return this.run('readonly', (s) => s.get(key)); },
  set(key, value) { return this.run('readwrite', (s) => s.put(value, key)); },
  del(key) { return this.run('readwrite', (s) => s.delete(key)); },
};

// ===================== Read-only view (phones) =====================
const RO = {
  info: device.get('roInfo', null), // {fileName, savedAt, savedFrom, openedAt}
  boot() {
    const cached = device.get('roData', null);
    if (cached) { try { DB.importAll(cached); } catch { /* bad cache: start empty */ } }
  },
  // A data file picked by hand.
  async open(file) {
    try {
      this.show(JSON.parse(await file.text()), file.name);
      toast('Data file opened (read-only)');
    } catch (e) {
      toast(e.message.startsWith('That file') ? e.message : 'Could not read that file');
    }
  },
  // Show a data file's contents and keep them as the last copy. from = 'OneDrive' when read from there.
  show(parsed, fileName, from = '') {
    if (!parsed || parsed.app !== 'PA App' || !parsed.data) throw new Error('That file is not a PA App data file');
    DB.importAll(parsed.data);
    this.info = { fileName, from, savedAt: parsed.savedAt, savedFrom: parsed.savedFrom, openedAt: new Date().toISOString() };
    device.set('roData', parsed.data);
    device.set('roInfo', this.info);
    render();
    renderDrawer();
  },
};

// ===================== Attachments folder =====================
// Attached files are copied into a folder the user picks once (handle kept in IndexedDB, like the data file).
// The data file stores only {name, file, size, type} — never the file contents — so it stays small and fast.
const safeFileName = (n) => (String(n).replace(/[\\/:*?"<>|]/g, '_').slice(-120) || 'file');
const AT = {
  dir: null,
  status: 'none', // none | reconnect | ok

  async init() {
    if (state.phone) return; // files stay on the laptop for now (stage D)
    this.dir = (await idb.get('attachments')) || this.dir || null;
    if (this.dir) this.status = (await this.dir.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'reconnect';
    renderDrawer();
  },

  async pickFolder() {
    const inUse = DB.tasks.some((t) => t.attachments.length);
    if (this.dir && inUse && !(await ask('Files already attached stay in the current folder — move them into the new folder yourself, or they will show as missing. Change folder?', { yes: 'Change folder' }))) return;
    try {
      this.dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'pa-attachments' });
      await idb.set('attachments', this.dir);
      this.status = 'ok';
      toast(`Attachments will be saved in the "${this.dir.name}" folder`);
    } catch (e) {
      if (e.name !== 'AbortError') toast('Could not use that folder: ' + e.message);
    }
    render();
    renderDrawer();
  },

  // After a browser restart; must run from a click.
  async reconnect() {
    if (!this.dir) return this.pickFolder();
    try { this.status = (await this.dir.requestPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'reconnect'; } catch { this.status = 'reconnect'; }
    renderDrawer();
  },

  async uniqueName(name) {
    const dot = name.lastIndexOf('.');
    const base = dot > 0 ? name.slice(0, dot) : name;
    const ext = dot > 0 ? name.slice(dot) : '';
    for (let i = 1; i < 500; i++) {
      const candidate = i === 1 ? name : `${base} (${i})${ext}`;
      try { await this.dir.getFileHandle(candidate); } catch { return candidate; } // not there yet = free
    }
    return `${base} ${uid()}${ext}`;
  },

  async add(task, files) {
    if (state.readOnly || !task) return;
    if (state.phone) return OD.addFiles(task, files); // straight into OneDrive (stage D)
    if (this.status !== 'ok') return toast('Choose or reconnect the attachments folder first');
    let added = 0;
    for (const f of files) {
      try {
        const stored = await this.uniqueName(safeFileName(this.suggestName(task, f.name))); // never overwrite an existing file
        const w = await (await this.dir.getFileHandle(stored, { create: true })).createWritable();
        await w.write(f);
        await w.close();
        // New attachments belong to this copy only; 📌 makes one carry over to every repeat.
        task.attachments.push({ id: uid(), name: stored, file: stored, original: f.name, size: f.size, type: f.type || '', added: Date.now(), keep: false });
        added++;
      } catch (e) {
        toast(`Could not attach ${f.name}: ${e.message}`);
      }
    }
    if (added) { changed('tasks'); toast(`Attached ${added} file${added > 1 ? 's' : ''}. The pencil beside a file renames it`); }
    render();
    renderDrawer();
  },

  // "Phone bill Oct 26.pdf": the title and moving part; with no moving part, the year is added when the
  // title doesn't have one ("Elec bill 2026.pdf").
  suggestName(task, original) {
    const dot = original.lastIndexOf('.');
    const ext = dot > 0 ? original.slice(dot).toLowerCase() : '';
    const year = (task.due ? task.due.slice(0, 4) : String(new Date().getFullYear()));
    const base = `${(task.title || 'Attachment').trim()}${task.period ? ` ${task.period}` : ''}`;
    return `${task.period || /\b(19|20)\d{2}\b/.test(base) ? base : `${base} ${year}`}${ext}`;
  },

  // Rename an attachment and its real file. A 📌 kept file is shared by every repeat, so they all
  // follow; a this-one-only file changes for this task alone (if an older copy still shares it,
  // this task gets its own renamed copy and the other keeps the old name).
  async rename(task, attId, newBase) {
    const att = task && task.attachments.find((a) => a.id === attId);
    if (!att || state.readOnly) return;
    if (!state.phone && this.status !== 'ok') return toast('Reconnect the attachments folder first');
    const dot = att.file.lastIndexOf('.');
    const ext = dot > 0 ? att.file.slice(dot) : '';
    const base = (newBase || '').trim().replace(new RegExp(`${ext.replace('.', '\\.')}$`, 'i'), '');
    if (!base || `${safeFileName(base)}${ext}` === att.file) return;
    const users = DB.tasks.filter((t) => t.attachments.some((a) => a.file === att.file));
    if (state.phone) {
      // In OneDrive the file is renamed for every task that uses it (an old file shared by two copies included).
      const target = await OD.renameFile(att.file, safeFileName(base), ext);
      if (!target) return;
      for (const t of users) for (const a of t.attachments) if (a.file === att.file) { a.file = target; a.name = target; }
      changed('tasks');
      toast(`Renamed to "${target}"`);
      render();
      renderDrawer();
      return;
    }
    const target = await this.uniqueName(`${safeFileName(base)}${ext}`);
    try {
      if (att.keep || users.length <= 1) {
        await this.moveFile(att.file, target);
        for (const t of users) for (const a of t.attachments) if (a.file === att.file) { a.file = target; a.name = target; }
      } else {
        await this.copyFile(att.file, target);
        att.file = target;
        att.name = target;
      }
    } catch (e) {
      return toast(`Could not rename: ${e.message}`);
    }
    changed('tasks');
    toast(`Renamed to "${target}"`);
    render();
    renderDrawer();
  },

  async copyFile(from, to) {
    const file = await (await this.dir.getFileHandle(from)).getFile();
    const w = await (await this.dir.getFileHandle(to, { create: true })).createWritable();
    await w.write(file);
    await w.close();
  },
  async moveFile(from, to) {
    const h = await this.dir.getFileHandle(from);
    if (typeof h.move === 'function') { await h.move(to); return; } // Chrome/Edge can rename in place
    await this.copyFile(from, to);
    await this.dir.removeEntry(from);
  },

  async open(att) {
    if (state.phone) {
      if (!OD.canRead()) return toast(OD.offline ? 'No connection: files open when you\'re back online' : 'Sign in to OneDrive to open attached files');
      return OD.openFile(att, window.open('', '_blank')); // the tab opens now, at the tap
    }
    if (this.status !== 'ok') return toast('Reconnect the attachments folder first');
    let file;
    try { file = await (await this.dir.getFileHandle(att.file)).getFile(); } catch { return toast(`"${att.name}" is not in the attachments folder any more`); }
    const url = URL.createObjectURL(file);
    if (/^(image\/|application\/pdf|text\/)/.test(att.type)) window.open(url, '_blank'); // the browser can show these
    else { const a = document.createElement('a'); a.href = url; a.download = att.name; a.click(); } // e.g. Word files: save a copy
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  },

  async remove(task, attId) {
    const att = task && task.attachments.find((a) => a.id === attId);
    if (!att || state.readOnly) return;
    if (!(await ask(`Remove "${att.name}" from this task?`, { yes: 'Remove', danger: true }))) return;
    task.attachments = task.attachments.filter((a) => a !== att);
    changed('tasks');
    // Delete the file only when no other task (e.g. another copy of a repeating task) still uses it.
    const stillUsed = DB.tasks.some((t) => t.attachments.some((a) => a.file === att.file));
    if (!stillUsed && state.phone) { try { await OD.graph('DELETE', OD.filePath(att.file)); } catch { /* already gone, or no signal: the file stays */ } } // to the OneDrive recycle bin
    else if (!stillUsed && this.status === 'ok') { try { await this.dir.removeEntry(att.file); } catch { /* already gone */ } }
    render();
    renderDrawer();
  },
};

function attachCard() {
  return `
    <div class="card edit-only">
      <h2>Attachments folder</h2>
      <p class="sub">${AT.dir
        ? `Files you attach to tasks are copied into the <b>${esc(AT.dir.name)}</b> folder.`
        : 'Pick a folder once and files you attach to tasks are copied there.'}
        For the phone to open and add them, it must be the <b>Attachments</b> folder in OneDrive › Apps › PA App, beside the Data folder.</p>
      <div class="row">
        ${AT.status === 'reconnect' ? '<button class="btn primary" data-action="at-reconnect">Reconnect</button>' : ''}
        <button class="btn" data-action="at-folder">${AT.dir ? 'Change folder' : 'Choose folder'}</button>
      </div>
    </div>`;
}

// ===================== Derived data =====================
const fullTitle = (t) => (t.period ? `${t.title} (${t.period})` : t.title); // "Phone bill (Oct 26)"
const taskDate =(t) => (t.due ? t.due.slice(0, 10) : '');
// A due date without a time is stored at 23:59 ("any time that day") and shown without a time.
const ALL_DAY = '23:59';
const taskTime = (t) => (t.due && t.due.slice(11, 16) !== ALL_DAY ? t.due.slice(11, 16) : '');
const taskLayout = () => device.get('taskLayout', 'board'); // Board is the default; List is one click away
const isOverdue = (t) => !t.done && !!t.due && new Date(t.due) < new Date();
const inMyDay = (t) => t.myDay === todayISO(); // My Day empties itself each morning
// Done after it was due? Whole days between the due date and the done date; a timed task done later the
// same day counts as "late (same day)". An all-day task is only late from the next day.
function lateDays(t) {
  if (!t.done || !t.due || !t.completedAt) return 0;
  const days = Math.round((parseISO(toISO(new Date(t.completedAt))) - parseISO(taskDate(t))) / DAY_MS);
  if (days > 0) return days;
  return days === 0 && taskTime(t) && !t.completedAllDay && t.completedAt > new Date(t.due).getTime() ? 0.5 : 0;
}
const lateText = (t) => { const d = lateDays(t); return d >= 1 ? `Done ${d} day${d === 1 ? '' : 's'} late` : d ? 'Done late (same day)' : ''; };
const currentTask = () => DB.tasks.find((t) => t.id === state.openTask) || null;

// Sort orders for the Tasks screen (chosen per device). Done tasks go last, except when sorting by completion.
const SORTS = {
  due: 'Due date', priority: 'Priority', name: 'Name A–Z', newest: 'Newest added',
  oldest: 'Oldest added', bucket: 'Bucket', completed: 'Completed (latest first)',
};
function sortTasks(list, mode = 'due') {
  const prio = { high: 0, med: 1, low: 2 };
  const byDue = (a, b) => (!!a.due !== !!b.due ? (a.due ? -1 : 1) : a.due !== b.due ? (a.due < b.due ? -1 : 1) : 0);
  const bucketPos = (t) => { const b = bucketOf(t); return b ? b.order : -Infinity; };
  const cmp = {
    due: byDue,
    priority: (a, b) => prio[a.priority] - prio[b.priority] || byDue(a, b),
    name: (a, b) => fullTitle(a).localeCompare(fullTitle(b), undefined, { sensitivity: 'base', numeric: true }),
    newest: (a, b) => (b.created || 0) - (a.created || 0),
    oldest: (a, b) => (a.created || 0) - (b.created || 0),
    bucket: (a, b) => bucketPos(a) - bucketPos(b) || byDue(a, b),
    completed: (a, b) => (b.completedAt || 0) - (a.completedAt || 0) || byDue(a, b),
  }[mode] || byDue;
  return [...list].sort((a, b) => (a.done !== b.done ? (a.done === (mode !== 'completed') ? 1 : -1) : 0)
    || cmp(a, b) || prio[a.priority] - prio[b.priority]);
}

// List view headings: by due date (Overdue / Today / Tomorrow / Next 7 days / Later / No date / Done) or by bucket.
function groupTasks(list, mode) {
  if (mode === 'bucket') {
    const groups = [{ label: 'No bucket', items: list.filter((t) => !bucketOf(t)) },
      ...sortedBuckets().map((b) => ({ label: b.name, items: list.filter((t) => t.bucket === b.id) }))];
    return groups.filter((g) => g.items.length);
  }
  const today = todayISO();
  const tomorrow = toISO(addDays(parseISO(today), 1));
  const week = toISO(addDays(parseISO(today), 7));
  const which = (t) => {
    if (t.done) return 'Done';
    if (!t.due) return 'No date';
    if (isOverdue(t)) return 'Overdue';
    const d = taskDate(t);
    return d === today ? 'Today' : d === tomorrow ? 'Tomorrow' : d <= week ? 'Next 7 days' : 'Later';
  };
  return ['Overdue', 'Today', 'Tomorrow', 'Next 7 days', 'Later', 'No date', 'Done']
    .map((label) => ({ label, items: list.filter((t) => which(t) === label) }))
    .filter((g) => g.items.length);
}

// Colour on the calendar: done (green), overdue (red), today (accent), upcoming (blue).
const taskStatus = (t) => (t.done ? 'done' : isOverdue(t) ? 'overdue' : taskDate(t) === todayISO() ? 'today' : 'upcoming');
// A task done late shows twice: on its due day as "missed" (orange, t-latedue) and on the day it was done
// as done with an orange outline (doneon).
const chipClass = (it) => (it.kind === 'task' ? (it.late ? 't-latedue' : `t-${it.status}`)
  : it.kind === 'repeat' ? `repeat${it.est ? ' est' : ''}` : it.kind === 'doneon' ? 'doneon' : 'event');
const chipPrefix = (it) => (it.kind === 'repeat' ? (it.est ? `${ic('repeat')}≈ ` : `${ic('repeat')} `)
  : it.kind === 'doneon' || (it.kind === 'task' && it.done && !it.late) ? `${ic('check')} ` : '');

// previews: optional {date: [upcoming repeats]} from repeatPreviews()
function itemsForDay(key, previews) {
  const events = DB.events.filter((e) => e.date === key).map((e) => ({ ...e, kind: 'event' }));
  const tasks = DB.tasks.filter((t) => taskDate(t) === key && !hiddenTask(t)).map((t) => ({ id: t.id, title: fullTitle(t), time: taskTime(t), done: t.done, kind: 'task', status: taskStatus(t), late: lateDays(t) > 0, lateBy: lateDays(t), doneDay: t.done && t.completedAt ? toISO(new Date(t.completedAt)) : '' }));
  // A task done late also shows (faded, ✓) on the day it was actually done.
  const doneHere = DB.tasks.filter((t) => lateDays(t) >= 1 && toISO(new Date(t.completedAt)) === key).map((t) => ({
    id: t.id, title: fullTitle(t), time: t.completedAllDay ? '' : fmtClock(t.completedAt), done: true, kind: 'doneon', dueDay: taskDate(t), lateBy: lateText(t),
  }));
  const repeats = (previews && previews[key]) || [];
  // What's due/happening that day comes first (so a busy day's 3 chips show it), then "done here", then previews.
  const rank = { task: 0, event: 0, doneon: 1, repeat: 2 };
  return [...events, ...tasks, ...doneHere, ...repeats]
    .sort((a, b) => rank[a.kind] - rank[b.kind] || (a.time || '99').localeCompare(b.time || '99'));
}

// ===================== Rendering =====================
function render() {
  document.body.classList.toggle('readonly', state.readOnly);
  document.body.classList.toggle('phone', state.phone);
  $$('.nav-btn').forEach((b) => { const on = b.dataset.view === state.view; b.classList.toggle('active', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  renderUnread();
  const views = { today: renderToday, tasks: renderTasks, calendar: renderCalendar, notes: renderNotes, notices: renderNotices, settings: renderSettings };
  // Redrawing would jump the page and the board back to the top — keep where you were on the same screen.
  const oldBoard = $('#main .board');
  const keep = state.view === render.lastView
    ? { y: window.scrollY, top: oldBoard ? oldBoard.scrollTop : 0, left: oldBoard ? oldBoard.scrollLeft : 0 } : null;
  render.lastView = state.view;
  $('#main').innerHTML = (views[state.view] || renderToday)();
  if (keep) {
    const board = $('#main .board');
    if (board) { board.scrollTop = keep.top; board.scrollLeft = keep.left; }
    if (window.scrollY !== keep.y) try { window.scrollTo(0, keep.y); } catch { /* not available in tests */ }
  }
  $('.main').classList.toggle('wide', state.view === 'tasks' && taskLayout() === 'board');
  // Board: the page fits the window and only the board scrolls, so the top stays put and column names stick.
  $('.main').classList.toggle('fill', state.view === 'tasks' && taskLayout() === 'board');
  renderStatus();
}

// Status bits only — safe to call while the user is typing (doesn't rebuild the page).
function renderStatus() {
  const theme = device.get('theme', 'auto');
  $('#theme-btn').innerHTML = `${ic('sun-moon', 'sm')}Theme: ${theme[0].toUpperCase() + theme.slice(1)}`;
  $('#df-badge').innerHTML = statusBadge();
  $('#banner').innerHTML = statusBanner();
  const card = $('#df-card');
  if (card) card.innerHTML = dataFileCard();
}

function statusBadge() {
  if (state.readOnly) return '<span class="status-dot warn"></span>Read-only';
  if (state.phone) {
    return OD.saving || device.get('odUnsaved', false) ? '<span class="status-dot warn"></span>Saving to OneDrive…' : '<span class="status-dot on"></span>Saved to OneDrive';
  }
  const unsaved = device.get('unsaved', false);
  switch (DF.status) {
    case 'ok': return unsaved ? '<span class="status-dot warn"></span>Saving…' : '<span class="status-dot on"></span>Saved to file';
    case 'reconnect': return '<span class="status-dot warn"></span>Reconnect file';
    case 'conflict': return '<span class="status-dot bad"></span>Needs a decision';
    case 'error': return '<span class="status-dot bad"></span>Save problem';
    default: return '<span class="status-dot"></span>Browser only';
  }
}

// What the read-only view (phone) is showing, and the buttons for getting the latest: from OneDrive once signed in
// there, otherwise by picking the file. Used by the banner and the Settings card.
function roState(small = '') {
  const i = RO.info;
  const shown = i ? `Showing <b>${esc(i.fileName)}</b>${i.from ? ` from ${esc(i.from)}` : ''}, saved ${esc(fmtStamp(i.savedAt))} on ${esc(i.savedFrom || '?')}.` : '';
  const pick = `<label class="btn ${small} ${OD.connected() ? '' : 'primary'}">${i ? 'Open newer file' : 'Open data file'}<input type="file" accept=".json,application/json" data-input="ro-open" hidden></label>`;
  if (!OD.connected()) {
    return { text: shown || 'Open your data file to see your tasks, notes and events, or sign in to OneDrive to always see the latest.', buttons: `<button class="btn ${small} primary" data-action="od-connect">Sign in to OneDrive</button>${pick}` };
  }
  if (OD.needsSignIn()) return { text: `${shown} Sign in to OneDrive again to see the latest.`, buttons: `<button class="btn ${small} primary" data-action="od-connect">Sign in again</button>` };
  const where = `OneDrive › Apps › ${esc(OD.folder || 'PA App')}`;
  if (OD.empty) return { text: `Signed in. Now move your data file into <b>${where} › ${OD.DATA_DIR}</b> on the laptop (see the Guide), then tap Refresh.`, buttons: `<button class="btn ${small} primary" data-action="od-refresh">Refresh</button>` };
  const note = OD.offline ? ` <b>Offline</b> — showing the last copy${device.get('odUnsaved', false) ? '; your last change saves when you\'re back online' : ''}.`
    : OD.error ? ` <span style="color:var(--danger)">${esc(OD.error)}</span>` : '';
  const refresh = `<button class="btn ${small} primary" data-action="od-refresh" ${OD.reading ? 'disabled' : ''}>${OD.reading ? 'Reading…' : 'Refresh'}</button>`;
  if (!state.readOnly) return { text: `${shown}${note}`, buttons: refresh, editing: true };
  return { text: `${shown || 'Reading from OneDrive…'}${note}`, buttons: refresh };
}

function statusBanner() {
  if (state.phone) {
    const s = roState('small');
    if (s.editing) return `<div class="banner"><span>${ic('pencil')}<span><b>Editing.</b> Every change saves to OneDrive. ${s.text}</span></span><span class="row">${s.buttons}</span></div>`;
    return `<div class="banner warn"><span>${ic('eye')}<span><b>Read-only view.</b> ${s.text}</span></span><span class="row">${s.buttons}</span></div>`;
  }
  switch (DF.status) {
    case 'reconnect':
      return `<div class="banner warn"><span>Your data file needs permission again after the restart. Until then changes only save in this browser.</span>
        <button class="btn small primary" data-action="df-reconnect">Reconnect data file</button></div>`;
    case 'conflict': {
      const c = DF.conflict || {};
      return `<div class="banner error"><span><b>Your data changed here and in the file.</b> The file was saved ${esc(fmtStamp(c.savedAt))} on ${esc(c.savedFrom || 'another device')}. Saving is paused until you choose.</span>
        <span class="row"><button class="btn small" data-action="df-keep-mine">Keep this device's version</button>
        <button class="btn small primary" data-action="df-use-theirs">Use the file's version</button></span></div>`;
    }
    case 'error':
      return `<div class="banner error"><span>Couldn't save to the data file: ${esc(DF.error)}</span><button class="btn small" data-action="df-retry">Try again</button></div>`;
    default:
      return TD.needsSignIn()
        ? `<div class="banner warn"><span>${ic('device-mobile')}<span>Phone reminders are paused: Microsoft asks you to sign in again about once a day.</span></span>
          <button class="btn small primary" data-action="td-connect">Sign in</button></div>`
        : '';
  }
}

// ===================== Reminders =====================
// A task can have several reminders. Each is one of:
//   {kind:'before', minutes}           N minutes before the due time (all-day tasks: before 9:00 on the due day)
//   {kind:'dayof', daysBefore, time}   a time of day, N days before the due date (0 = on the day)
//   {kind:'at', at:'YYYY-MM-DDTHH:mm'} an exact date and time, whatever the due date
// `fired` is set once it has gone off; changing the due date resets it.
const REMINDER_PRESETS = [
  ['b0', 'At due time', { kind: 'before', minutes: 0 }],
  ['b10', '10 min before', { kind: 'before', minutes: 10 }],
  ['b60', '1 hour before', { kind: 'before', minutes: 60 }],
  ['b1440', '1 day before', { kind: 'before', minutes: 1440 }],
  ['d0-09:00', '9:00 am on the day', { kind: 'dayof', daysBefore: 0, time: '09:00' }],
  ['d1-21:00', 'Evening before (9:00 pm)', { kind: 'dayof', daysBefore: 1, time: '21:00' }],
];
const presetReminder = (key) => {
  const p = REMINDER_PRESETS.find(([k]) => k === key);
  return p ? { id: uid(), ...p[2], fired: false } : null;
};

const localStamp = (ms) => { const d = new Date(ms); return `${toISO(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }; // 'YYYY-MM-DDTHH:mm', as tasks keep times
const sameMinute = (a, b) => a != null && b != null && Math.round(a / 60000) === Math.round(b / 60000);

// Every rule about a task's reminders: when each goes off, its wording, which are due, the next one still to come
// (the one To Do holds), and what happens to them when the due date changes or the task is copied. Nothing here
// shows anything; changes report {ok, note} like TaskEdit, and the caller calls changed().
const Reminders = {
  // When it goes off (ms), or null: a relative one needs a due date.
  time(t, r) {
    if (r.kind === 'at') return r.at ? new Date(r.at).getTime() : null;
    if (!t.due) return null;
    if (r.kind === 'dayof') {
      const d = addDays(parseISO(t.due.slice(0, 10)), -(r.daysBefore || 0));
      const [h, m] = (r.time || '09:00').split(':').map(Number);
      return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m).getTime();
    }
    const base = taskTime(t) ? new Date(t.due) : new Date(`${t.due.slice(0, 10)}T09:00`);
    return base.getTime() - (r.minutes || 0) * 60000;
  },
  text(t, r) {
    if (r.kind === 'at') return r.at ? `${fmtDay(r.at.slice(0, 10))} ${fmtTime(r.at.slice(11, 16))}` : 'Exact time';
    if (r.kind === 'dayof') {
      const at = fmtTime(r.time || '09:00');
      if (!r.daysBefore) return `${at} on the day`;
      if (r.daysBefore === 1) return r.time === '21:00' ? 'Evening before (9:00 pm)' : `${at} the day before`;
      return `${r.daysBefore} days before, ${at}`;
    }
    const m = r.minutes || 0;
    if (!m) return taskTime(t) ? 'At due time' : '9:00 am on the day';
    const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'} before`;
    return m % 1440 === 0 ? plural(m / 1440, 'day') : m % 60 === 0 ? plural(m / 60, 'hour') : `${m} min before`;
  },
  // A new reminder ({kind, …}); one counting from the due date needs a due date.
  add(t, r) {
    if (r.kind !== 'at' && !t.due) return { ok: false, note: 'Set a due date first — or use "On a date and time"' };
    t.reminders.push({ ...r, id: uid(), fired: false });
    return { ok: true, note: '' };
  },
  // New settings for one, keeping its place in the list; it's ready to go off again.
  replace(t, id, r) {
    const was = t.reminders.find((x) => x.id === id);
    if (!was) return { ok: false, note: '' };
    for (const key of ['minutes', 'daysBefore', 'time', 'at']) delete was[key];
    Object.assign(was, r, { fired: false });
    return { ok: true, note: '' };
  },
  // The due date changed: those counting from it go off again; exact-time ones stay as they were.
  rearm(t) { t.reminders.forEach((r) => { if (r.kind !== 'at') r.fired = false; }); },
  // For a new copy of a task: new ids, all ready again; exact-time ones move by shiftDays (a repeat's next copy), and
  // one whose time has already passed counts as gone off, so a copy never pops up a reminder the moment it's made.
  copy(list, shiftDays = 0, now = Date.now()) {
    return list.map((r) => {
      const c = { ...r, id: uid(), fired: false };
      if (c.kind !== 'at' || !c.at) return c;
      if (shiftDays) c.at = `${toISO(addDays(parseISO(c.at.slice(0, 10)), shiftDays))}${c.at.slice(10)}`;
      c.fired = new Date(c.at).getTime() <= now;
      return c;
    });
  },
  // An exact-time reminder at ms, as To Do gives them; one already past counts as gone off.
  exact(ms, now = Date.now()) { return { id: uid(), kind: 'at', at: localStamp(ms), fired: ms <= now }; },
  // The next one still to come (ms) or null. To Do holds one reminder per task: this is the one it's sent.
  next(t, now = Date.now()) {
    const times = t.reminders.filter((r) => !r.fired).map((r) => this.time(t, r)).filter((x) => x != null && x > now);
    return times.length ? Math.min(...times) : null;
  },
  // To Do changed or turned off the one it held (sent = its time, ms): that one is done with, and a new time there
  // becomes an exact-time reminder here. The next one here still goes to To Do after it.
  fromToDo(t, sent, newTime) {
    for (const r of t.reminders) if (sameMinute(this.time(t, r), sent)) r.fired = true;
    if (newTime != null && !t.reminders.some((r) => sameMinute(this.time(t, r), newTime))) t.reminders.push(this.exact(newTime)); // never twice
  },
  // [{t, r, at}] whose time has come (not gone off yet, not in `shown`: the keys a read-only device has shown).
  due(tasks, now = Date.now(), shown = new Set()) {
    const out = [];
    for (const t of tasks) {
      if (t.done) continue;
      for (const r of t.reminders) {
        if (r.fired || shown.has(`${t.id}:${r.id}`)) continue;
        const at = this.time(t, r);
        if (at != null && at <= now) out.push({ t, r, at });
      }
    }
    return out;
  },
};

// Title line + the small details under it; shared by list rows and board cards.
// noDue: the row already shows when (My Day's timeline), so the due date isn't repeated underneath.
function taskSummary(t, { noDue = false } = {}) {
  const meta = [];
  if (t.due && !noDue) {
    const when = `${taskDate(t) === todayISO() ? 'Today' : fmtDay(taskDate(t))}${taskTime(t) ? ' ' + fmtTime(taskTime(t)) : ''}`;
    meta.push(`<span class="${isOverdue(t) ? 'overdue' : ''}">${ic('calendar-event', 'sm')}${isOverdue(t) ? 'Overdue: ' : ''}${esc(when)}</span>`);
  }
  if (lateText(t)) meta.push(`<span class="late">${lateText(t)}</span>`);
  if (t.start && t.start > todayISO() && !t.done) meta.push(`<span>Starts ${esc(fmtDay(t.start))}</span>`);
  if (t.reminders.length && !t.done) meta.push(`<span title="Reminder">${ic('bell', 'sm')}${esc(Reminders.text(t, t.reminders[0]))}${t.reminders.length > 1 ? ` +${t.reminders.length - 1}` : ''}</span>`);
  if (t.repeat) meta.push(`<span title="Repeats">${ic('repeat', 'sm')}${esc(repeatText(t.repeat))}</span>`);
  if (t.progress === 'doing' && !t.done) meta.push('<span class="pill doing">In progress</span>');
  if (inMyDay(t)) meta.push(`<span>${ic('sun', 'sm')}My Day</span>`);
  if (t.checklist.length) meta.push(`<span title="Checklist">${ic('checklist', 'sm')}${t.checklist.filter((s) => s.done).length}/${t.checklist.length}</span>`);
  if (t.notes.trim()) meta.push(`<span title="Has notes">${ic('note', 'sm')}<span class="sr-only">Has notes</span></span>`);
  if (t.attachments.length) meta.push(`<span title="Attachments">${ic('paperclip', 'sm')}${t.attachments.length}</span>`);
  const bucket = DB.buckets.find((b) => b.id === t.bucket);
  const onBoard = state.view === 'tasks' && taskLayout() === 'board'; // the column already says it
  if (bucket && !onBoard) meta.push(`<span>${ic('layout-kanban', 'sm')}${esc(bucket.name)}</span>`);
  const labels = t.labels.map((id) => DB.labels.find((l) => l.id === id)).filter(Boolean);
  return `
    <div class="title"><span class="tt">${esc(fullTitle(t)) || '<span class="meta">New task…</span>'}</span> ${t.priority !== 'low' ? `<span class="pill ${t.priority}">${t.priority === 'high' ? 'High' : 'Medium'}</span>` : ''} ${labels.map(labelPill).join(' ')}</div>
    ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}`;
}

function taskItem(t) {
  if (hiddenTask(t)) return '';
  return `
    <li class="item ${t.done ? 'done' : ''}">
      <input type="checkbox" class="check" data-action="toggle-task" data-id="${esc(t.id)}" ${t.done ? 'checked' : ''} ${state.readOnly ? 'disabled' : ''} aria-label="Mark done">
      <div class="body clickable" data-action="open-task" data-id="${esc(t.id)}">${taskSummary(t)}</div>
      <button class="icon-btn edit-only" data-action="delete-task" data-id="${esc(t.id)}" title="Delete" aria-label="Delete task">${ic('x')}</button>
    </li>`;
}

const labelPill = (l) => `<span class="label-pill" style="--lc:${labelInk(l.color)}">${esc(l.name)}</span>`;

function dayItem(i) {
  const statusText = { overdue: 'Overdue', today: 'Due today', upcoming: 'Task', done: 'Done' };
  const tag = i.kind === 'task' ? `<span class="pill ${chipClass(i)}">${i.late
      ? `Missed — done ${esc(i.doneDay ? fmtDay(i.doneDay) : 'later')} (${esc(lateText(DB.tasks.find((t) => t.id === i.id)).replace(/^Done /, ''))})`
      : statusText[i.status]}</span>`
    : i.kind === 'repeat' ? `<span class="pill">${ic('repeat')}${i.est ? '≈ Estimated repeat (after I finish it)' : ' Upcoming repeat'}</span>`
    : i.kind === 'doneon' ? `<span class="pill doneon">${ic('check')} Done this day — was due ${esc(fmtDay(i.dueDay))} (${esc(i.lateBy.replace(/^Done /, ''))})</span>` : '';
  const del = i.kind === 'event' ? `<button class="icon-btn edit-only" data-action="delete-event" data-id="${esc(i.id)}" title="Delete" aria-label="Delete event">${ic('x')}</button>` : '';
  const open = i.kind === 'task' || i.kind === 'doneon' ? ` clickable" data-action="open-task" data-id="${esc(i.id)}` : '';
  // Tasks get a tick box right here (it opens the usual "Done on…" pop-up); events and previews don't.
  const tick = i.kind === 'task' || i.kind === 'doneon'
    ? `<input type="checkbox" class="check" data-action="toggle-task" data-id="${esc(i.id)}" ${i.done ? 'checked' : ''} ${state.readOnly ? 'disabled' : ''} aria-label="${i.done ? 'Mark not done' : 'Mark done'}">`
    : '<span class="check-space"></span>';
  return `
    <li class="item day-item ${chipClass(i)} ${i.done && i.kind === 'task' && !i.late ? 'done' : ''}">
      ${tick}
      <span class="time">${i.time ? fmtTime(i.time) : 'All day'}</span>
      <div class="body${open}"><div class="title"><span class="tt">${esc(i.title)}</span> ${tag}</div></div>
      ${del}
    </li>`;
}

// ===================== Quick add =====================
// One box, like Microsoft To Do: type "Pay utilities bill Friday 6pm #bills @home every month !high"
// and the dates, repeat, labels, bucket and priority are picked out. A preview under the box shows
// what was understood, with a link to keep the words as typed. The small buttons on the right
// (bucket, due date, reminder, repeat) set the same things by clicking.

  return `
    <form class="quick-add edit-only" data-form="quick-add" data-ctx="${ctx}" data-key="bar-${ctx}" autocomplete="off">
      <div class="qa-main">
        <span class="qa-circle" aria-hidden="true"></span>
        <input class="qa-input" name="title" data-qa placeholder="${esc(where)}, like 'Pay utilities bill Friday 6pm'" aria-label="${esc(where)}">
        <span class="qa-tools">
          <select class="qa-select ${bucket ? 'set' : ''}" name="bucket" title="Bucket" data-qa-tool>
            ${opt('', 'Bucket', bucket)}${sortedBuckets().map((b) => opt(b.id, b.name, bucket)).join('')}
          </select>
          <span class="qa-tool">
            <button type="button" class="qa-btn" data-action="qa-pick" title="Due date">${ic('calendar-event', 'sm')}<span class="qa-val">Due</span></button>
            <input class="qa-native" type="date" name="dueDate" tabindex="-1" aria-label="Due date" data-qa-tool>
          </span>
          <select class="qa-select" name="remind" title="Reminder" data-qa-tool>
            ${opt('', 'Remind', '')}${REMINDER_PRESETS.map(([k, label]) => opt(k, label, '')).join('')}
          </select>
          <select class="qa-select" name="repeat" title="Repeat" data-qa-tool>
            ${opt('', 'Repeat', '')}${opt('daily', 'Daily', '')}${opt('weekdays', 'Weekdays', '')}${opt('weekly', 'Weekly', '')}${opt('monthly', 'Monthly', '')}${opt('yearly', 'Yearly', '')}
          </select>
        </span>

      <div class="qa-preview"></div>

}
