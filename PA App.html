<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PA App</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
/* ===== Colours: light by default, dark follows Windows unless the 🌓 switch says otherwise ===== */
:root {
  --bg: #f6f7fb;
  --panel: #ffffff;
  --panel-2: #f1f3f9;
  --text: #1c2030;
  --muted: #6b7185;
  --border: #e3e6ef;
  --accent: #4f46e5;
  --accent-soft: #eceafd;
  --danger: #dc2626;
  --ok: #16a34a;
  --warn: #d97706;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 4px 16px rgba(20, 24, 40, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11131a; --panel: #1a1d27; --panel-2: #232736; --text: #e8eaf2; --muted: #9aa0b4; --border: #2c3142;
    --accent: #8b85ff; --accent-soft: #2a2850; --danger: #f87171; --ok: #4ade80; --warn: #fbbf24; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11131a; --panel: #1a1d27; --panel-2: #232736; --text: #e8eaf2; --muted: #9aa0b4; --border: #2c3142;
  --accent: #8b85ff; --accent-soft: #2a2850; --danger: #f87171; --ok: #4ade80; --warn: #fbbf24; --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; font-size: 13px; }

.app { display: flex; min-height: 100vh; }

/* ===== Sidebar ===== */
.sidebar {
  width: 220px; flex-shrink: 0; padding: 20px 12px; border-right: 1px solid var(--border); background: var(--panel);
  display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 700; font-size: 17px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.nav-btn {
  display: flex; align-items: center; gap: 12px; padding: 9px 12px; border: 0; border-radius: 9px;
  background: transparent; cursor: pointer; text-align: left; color: var(--muted);
}
.nav-btn:hover { background: var(--panel-2); color: var(--text); }
.nav-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ico { width: 20px; text-align: center; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 0 4px; }
.df-badge { font-size: 12px; color: var(--muted); padding: 6px 8px; border-radius: 8px; background: var(--panel-2); }
.theme-btn { font-size: 12px; border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 5px 8px; cursor: pointer; color: var(--muted); }

/* ===== Main ===== */
.main { flex: 1; min-width: 0; padding: 28px 32px 60px; max-width: 1100px; }
.main.wide { max-width: none; } /* the board uses the whole screen */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 26px; }
.sub { color: var(--muted); margin: 2px 0 0; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.card h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-main { grid-template-columns: 1.4fr 1fr; }
.stat { font-size: 30px; font-weight: 700; }
.stat-label { color: var(--muted); font-size: 13px; }

/* ===== Forms & buttons ===== */
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.input { padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); min-width: 0; }
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.grow { flex: 1; min-width: 160px; }
.btn { padding: 9px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.icon-btn { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 4px 6px; border-radius: 6px; }
.icon-btn:hover { background: var(--panel-2); color: var(--danger); }
.tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 10px; max-width: 100%; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.tab.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }

/* Read-only devices (phones): editing controls disappear */
body.readonly .edit-only { display: none !important; }

/* ===== Lists ===== */
.list { list-style: none; margin: 0; padding: 0; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
.item:last-child { border-bottom: 0; }
.item .body { flex: 1; min-width: 0; }
.item .title { overflow-wrap: anywhere; }
.item.done .title { text-decoration: line-through; color: var(--muted); }
.meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; }
.meta .overdue { color: var(--danger); font-weight: 600; }
.check { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.pill.high { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.pill.med { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); width: 54px; flex-shrink: 0; font-size: 13px; }

/* ===== Calendar ===== */
.cal-layout { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-head h2 { margin: 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
.cal-day {
  min-height: 88px; padding: 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel);
  cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 3px; overflow: hidden;
}
.cal-day:hover { border-color: var(--accent); }
.cal-day.other { opacity: .45; }
.cal-day.today .num { background: var(--accent); color: #fff; }
.cal-day.selected { outline: 2px solid var(--accent); outline-offset: -1px; }
.num { font-size: 12px; font-weight: 600; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.chip { font-size: 11px; padding: 1px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--accent-soft); color: var(--accent); }
.chip.task { background: var(--panel-2); color: var(--muted); }
.more { font-size: 11px; color: var(--muted); }

/* ===== Notes ===== */
.notes-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; min-height: 70vh; }
.note-list { display: flex; flex-direction: column; gap: 6px; max-height: 75vh; overflow: auto; }
.note-card { text-align: left; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); cursor: pointer; }
.note-card.active { border-color: var(--accent); background: var(--accent-soft); }
.note-card .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-card .p { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.editor { display: flex; flex-direction: column; gap: 10px; }
.editor .note-title { font-size: 20px; font-weight: 700; border: 0; background: transparent; padding: 4px 0; outline: none; }
.editor textarea { flex: 1; min-height: 55vh; resize: vertical; border: 0; background: transparent; outline: none; line-height: 1.6; }

/* ===== Task details drawer ===== */
.item .body.clickable, .task-card .body.clickable { cursor: pointer; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel);
  border-left: 1px solid var(--border); box-shadow: -8px 0 32px rgba(0, 0, 0, .14); z-index: 40;
  transform: translateX(105%); transition: transform .18s ease-out; display: flex; flex-direction: column;
}
body.drawer-open .drawer { transform: none; }
.drawer-backdrop { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .25); z-index: 39; }
body.drawer-open .drawer-backdrop { display: block; }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; border-bottom: 1px solid var(--border); }
.drawer-title { flex: 1; min-width: 0; font-size: 18px; font-weight: 700; border: 0; background: transparent; outline: none; padding: 4px 0; }
.drawer-body { flex: 1; overflow: auto; padding: 12px 16px 20px; border: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.drawer-body > * { flex-shrink: 0; } /* scroll instead of squashing the notes box */
.drawer-body h3 { margin: 10px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.drawer-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field-grid label, .field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.field-grid .input, .field .input { color: var(--text); font-size: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.step { display: flex; align-items: center; gap: 8px; }
.step .check { width: 17px; height: 17px; }
.step-text { flex: 1; min-width: 0; border: 0; border-bottom: 1px solid transparent; background: transparent; padding: 5px 0; outline: none; }
.step-text:focus { border-bottom-color: var(--accent); }
.step.done .step-text { text-decoration: line-through; color: var(--muted); }
textarea.input { resize: vertical; line-height: 1.5; }
.pill.doing { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }

/* ===== Board, buckets & labels ===== */
.toolbar { margin-bottom: 12px; }
.toolbar .input { padding: 6px 10px; font-size: 14px; }
.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; align-items: flex-start; }
.board-col { flex: 0 0 272px; background: var(--panel-2); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; border: 2px solid transparent; }
.board-col.over { border-color: var(--accent); }
.board-head { display: flex; align-items: center; gap: 6px; }
.board-head b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-tools .icon-btn { padding: 2px 5px; }
.board-cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
.task-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start; }
.task-card .body { flex: 1; min-width: 0; }
.task-card .title { overflow-wrap: anywhere; }
.task-card.done .title { text-decoration: line-through; color: var(--muted); }
.task-card.dragging { opacity: .5; }
.board-add-btn { width: 100%; text-align: left; border: 0; background: transparent; color: var(--muted); padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.board-add-btn:hover { background: var(--panel); color: var(--text); }
.add-card { flex-direction: column; align-items: stretch; gap: 8px; border-color: var(--accent); }
.add-card .input { padding: 7px 10px; font-size: 14px; }
.add-card .row { flex-wrap: nowrap; }
.add-card input[type="date"] { flex: 1; min-width: 0; }

/* ===== Quick add bar (To Do style) ===== */
.quick-add { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; }
.quick-add:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.qa-main { display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px 14px; flex-wrap: wrap; }
.qa-circle { width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; color: var(--muted); font-size: 16px; line-height: 1; }
.quick-add:not(:focus-within) .qa-circle::before { content: "+"; }
.quick-add:not(:focus-within) .qa-circle { border-color: transparent; color: var(--accent); font-size: 22px; }
.qa-input { flex: 1; min-width: 200px; border: 0; background: transparent; padding: 10px 0; outline: none; font-size: 15px; }
.qa-tools { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.qa-tool { position: relative; }
.qa-btn, .qa-select {
  border: 0; background: transparent; color: var(--muted); padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; white-space: nowrap;
}
.qa-btn:hover, .qa-select:hover { background: var(--panel-2); color: var(--text); }
.qa-btn.set, .qa-select.set { color: var(--accent); font-weight: 600; }
.qa-select option { color: var(--text); background: var(--panel); }
.qa-native { position: absolute; inset: 0; opacity: 0; pointer-events: none; width: 100%; }
.qa-preview { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 12px 10px 44px; font-size: 13px; }
.qa-preview:empty { display: none; }
.qa-chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 9px; }
.qa-chip.off { background: var(--panel-2); color: var(--muted); text-decoration: line-through; }
.qa-hint { color: var(--muted); }
.qa-link { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0 4px; }
.empty.small { padding: 8px; font-size: 13px; }
.label-pill {
  display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
  background: color-mix(in srgb, var(--lc) 18%, transparent); color: color-mix(in srgb, var(--lc) 80%, var(--text));
}
button.label-pill { border: 1px solid transparent; cursor: pointer; opacity: .5; }
button.label-pill.on { opacity: 1; border-color: var(--lc); }
.label-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.manage-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.manage-row .name { flex: 1; min-width: 0; }
.manage-row .input { padding: 4px 8px; font-size: 13px; }

/* ===== Recurring ===== */
.input.num { width: 64px; padding: 6px 8px; }
.weekdays { gap: 4px; }
.day-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel); cursor: pointer; font-size: 13px; }
.day-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.repeat { background: transparent; border: 1px dashed var(--border); color: var(--muted); }
.repeat-box { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); }

/* ===== Attachments ===== */
.attachments { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.attach { display: flex; align-items: center; gap: 8px; }
.link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-align: left; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-btn:hover { text-decoration: underline; }
.link-btn:disabled { color: var(--text); cursor: default; text-decoration: none; }

/* ===== Banners & toasts ===== */
.banner { padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); margin-bottom: 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); }
.banner.error { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.status-dot.on { background: var(--ok); }
.status-dot.warn { background: var(--warn); }
.status-dot.bad { background: var(--danger); }
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.2); max-width: 320px; animation: pop .2s ease-out; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } }

/* ===== Phones & narrow screens ===== */
@media (max-width: 900px) {
  .grid-2, .grid-main, .cal-layout, .notes-layout { grid-template-columns: 1fr; }
  .cal-day { min-height: 60px; }
}
@media (max-width: 680px) {
  .app { flex-direction: column; }
  .sidebar {
    position: fixed; bottom: 0; top: auto; left: 0; right: 0; height: auto; width: auto; z-index: 20;
    flex-direction: row; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    border-right: 0; border-top: 1px solid var(--border);
  }
  .brand, .side-foot { display: none; }
  .nav-btn { flex-direction: column; gap: 0; font-size: 11px; padding: 6px 4px; flex: 1; align-items: center; }
  .ico { font-size: 18px; }
  .main { padding: 20px 16px 90px; }
  .cal-day .chip, .cal-day .more { display: none; }
  .cal-day { min-height: 46px; align-items: center; }
  .cal-day.has-items::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .toasts { bottom: 80px; }
  .drawer { width: 100vw; }
  .field-grid { grid-template-columns: 1fr; }
  .board-col { flex-basis: 82vw; }
  .qa-input { min-width: 0; flex-basis: calc(100% - 40px); }
  .qa-tools { padding-left: 22px; }
  .qa-preview { padding-left: 14px; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="brand"><span class="logo">✓</span><span>PA App</span></div>
    <button class="nav-btn" data-view="today"><span class="ico">☀</span><span>My Day</span></button>
    <button class="nav-btn" data-view="tasks"><span class="ico">☑</span><span>Tasks</span></button>
    <button class="nav-btn" data-view="calendar"><span class="ico">▦</span><span>Calendar</span></button>
    <button class="nav-btn" data-view="notes"><span class="ico">✎</span><span>Notes</span></button>
    <button class="nav-btn" data-view="settings"><span class="ico">⚙</span><span>Settings</span></button>
    <div class="side-foot">
      <div class="df-badge" id="df-badge"></div>
      <button class="theme-btn" data-action="cycle-theme" id="theme-btn"></button>
    </div>
  </nav>
  <main class="main"><div id="banner"></div><div id="main"></div></main>
</div>
<div class="drawer-backdrop" data-action="close-task"></div>
<aside id="drawer" class="drawer" aria-label="Task details"></aside>
<div id="toasts" class="toasts"></div>

<script>
'use strict';
/* PA App — tasks, reminders, notes and a calendar in one file.
   Data lives in localStorage (pa_* keys) and is mirrored to a JSON data file the user links once
   (File System Access API, Chrome/Edge desktop). Browsers without that API (phones) are read-only:
   they open the data file to view it but can never change it, so copies can't drift apart.
   Read PA_APP_CONTEXT.md before changing the data model or the save logic. */

// ===================== Helpers =====================
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');

// Dates are always local YYYY-MM-DD. Never use .toISOString() for a date: it converts to UTC and
// shifts the day in any timezone away from UTC. toISOString is only for exact instants such as savedAt.
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const parseISO = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const monthStart = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
const fmtTime = (hhmm) => {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  return new Date(2000, 0, 1, h, m).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
};
const fmtDay = (k) => parseISO(k).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
const fmtStamp = (iso) => (iso ? new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '—');

// Record IDs: time + crypto random + a counter, so two devices (or two clicks in the same millisecond) never collide.
let idCounter = 0;
function uid() {
  const r = new Uint32Array(2);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(r);
  else { r[0] = Math.random() * 2 ** 32; r[1] = Math.random() * 2 ** 32; }
  return `${Date.now().toString(36)}-${r[0].toString(36)}${r[1].toString(36)}-${(idCounter++).toString(36)}`;
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), 5000);
}

// ===================== Per-device settings =====================
// Things that belong to this browser only (theme, open screen, save bookkeeping). They never go
// into the data file or backups, otherwise one computer's flags would overwrite another's.
const device = {
  get(key, fallback) {
    try { const v = localStorage.getItem('dev_' + key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem('dev_' + key, JSON.stringify(value)); } catch { /* private mode: settings just won't stick */ }
  },
  remove(key) { try { localStorage.removeItem('dev_' + key); } catch { /* ignore */ } },
};
const deviceName = () => device.get('name', /Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Phone' : 'Computer');

// ===================== Shared data =====================
// tasks:   see TASK_DEFAULTS below
// notes:   {id, title, body, updated}
// events:  {id, title, date:'YYYY-MM-DD', time:'HH:mm'|''}
// buckets: {id, name, order}
// labels:  {id, name, color:'#rrggbb'}
// Changing these shapes means old data files must still load — see PA_APP_CONTEXT.md.
const DATA_KEYS = ['tasks', 'notes', 'events', 'buckets', 'labels'];
const REQUIRED_KEYS = ['tasks', 'notes', 'events']; // files from before buckets/labels have only these

// Every task field with its default. Old tasks get the missing fields filled in on load.
const TASK_DEFAULTS = {
  title: '',
  due: '',            // 'YYYY-MM-DDTHH:mm' local time, or '' = no due date
  start: '',          // 'YYYY-MM-DD' or ''
  priority: 'low',    // 'low' | 'med' | 'high'
  progress: 'not',    // 'not' | 'doing' (done is the separate `done` flag)
  reminders: [],      // see reminderTime(): {id, kind:'before'|'dayof'|'at', minutes, daysBefore, time, at, fired}
  done: false,
  completedAt: 0,     // ms
  created: 0,         // ms
  myDay: '',          // 'YYYY-MM-DD' the task was added to My Day; only counts on that day
  bucket: '',         // bucket id or ''
  labels: [],         // label ids
  notes: '',
  checklist: [],      // {id, text, done}
  repeat: null,       // see nextDue()
  seriesId: '',       // shared by all copies of a repeating task
  spawnedNext: '',    // id of the next copy, once created (so ticking twice never makes two)
  seriesIndex: 1,     // which copy of a repeating task this is (1 = the first) — for "ends after N times"
  attachments: [],    // {id, name, file, size, type, added} — file is the name inside the attachments folder
};
function normalizeTask(t) {
  const n = { ...TASK_DEFAULTS, ...t };
  for (const k of ['labels', 'checklist', 'attachments']) n[k] = Array.isArray(t[k]) ? t[k] : []; // fresh arrays, never shared
  // Before multiple reminders, a task had one: remind (minutes before due, -1 = none) + notified.
  if (!Array.isArray(t.reminders)) {
    n.reminders = t.remind != null && Number(t.remind) >= 0 ? [{ id: uid(), kind: 'before', minutes: Number(t.remind), fired: !!t.notified }] : [];
  }
  delete n.remind;
  delete n.notified;
  return n;
}

const DB = {
  tasks: [], notes: [], events: [], buckets: [], labels: [],
  load() {
    for (const k of DATA_KEYS) {
      try { this[k] = JSON.parse(localStorage.getItem('pa_' + k)) || []; } catch { this[k] = []; }
    }
    this.tasks = this.tasks.map(normalizeTask);
  },
  persist(k) {
    if (state.readOnly) return;
    try { localStorage.setItem('pa_' + k, JSON.stringify(this[k])); } catch { toast('Could not save in this browser — storage is full or blocked'); }
  },
  exportAll() { return Object.fromEntries(DATA_KEYS.map((k) => [k, this[k]])); },
  importAll(data) {
    if (!data || !REQUIRED_KEYS.every((k) => Array.isArray(data[k]))) throw new Error('This file has no PA App data in it');
    for (const k of DATA_KEYS) this[k] = Array.isArray(data[k]) ? data[k] : [];
    this.tasks = this.tasks.map(normalizeTask);
    for (const k of DATA_KEYS) this.persist(k);
  },
  isEmpty() { return DATA_KEYS.every((k) => this[k].length === 0); },
};

// Every edit goes through here: save in the browser, then queue a save to the data file.
function changed(...keys) {
  if (state.readOnly) return;
  keys.forEach((k) => DB.persist(k));
  DF.markDirty();
}

// ===================== Screen state =====================
const params = new URLSearchParams(location.search);
function isPhone() {
  if (navigator.userAgentData && navigator.userAgentData.mobile) return true;
  return /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPad asking for the desktop site
}
const state = {
  view: device.get('view', 'today'),
  taskFilter: 'active',
  noteQuery: '',
  activeNote: null,
  calMonth: monthStart(new Date()),
  selectedDay: todayISO(),
  // Read-only on phones/tablets (even ones whose Chrome can write files — the phone must never make a
  // second copy), in browsers that can't write files (Safari, Firefox), or with ?readonly in the address.
  readOnly: isPhone() || typeof window.showOpenFilePicker !== 'function' || params.has('readonly'),
  remindedHere: new Set(), // read-only devices remember shown reminders here instead of changing the data
  openTask: null,          // id of the task shown in the details drawer
  taskBucket: '',          // Tasks filter: '' all, '-' no bucket, or a bucket id
  taskLabel: '',           // Tasks filter: '' all, or a label id
  boardAdd: null,          // bucket id whose "+ Add task" card is open on the board ('' = No bucket)
  remCustom: null,         // which custom reminder form is open in the drawer: 'before' | 'dayof' | 'at'
};

// ===================== Data file (auto-save) =====================
const FILE_TYPES = [{ description: 'PA App data', accept: { 'application/json': ['.json'] } }];
const DF = {
  DEBOUNCE_MS: 2000,
  POLL_MS: 20000,
  handle: null,
  backupDir: null,
  status: 'none',      // none | reconnect | ok | conflict | error
  conflict: null,      // the file's contents while a conflict is open
  fileInfo: null,      // {savedAt, savedFrom}
  error: '',
  saving: false,
  timer: null,

  async init() {
    if (state.readOnly) return;
    const [h, b] = await Promise.all([idb.get('data'), idb.get('backups')]);
    this.backupDir = b || null;
    if (!h) { renderStatus(); return; }
    this.handle = h;
    if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted') await this.check();
    else { this.status = 'reconnect'; renderStatus(); }
  },

  // Browsers ask again for file access after a restart; this must run from a click.
  async reconnect() {
    try {
      if ((await this.handle.requestPermission({ mode: 'readwrite' })) !== 'granted') return toast('Permission not given — data is only saving in this browser');
      if (this.backupDir) await this.backupDir.requestPermission({ mode: 'readwrite' }).catch(() => {});
      if (AT.status === 'reconnect') await AT.reconnect(); // one click brings the attachments folder back too
      await this.check();
    } catch (e) { this.fail(e); }
  },

  async createNew() {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: 'pa-app-data.json', types: FILE_TYPES });
      await this.attach(h);
      await this.write();
      toast('Data file created — changes now save to it automatically');
    } catch (e) { if (e.name !== 'AbortError') this.fail(e); }
  },

  async openExisting() {
    try {
      const [h] = await window.showOpenFilePicker({ types: FILE_TYPES });
      if ((await h.requestPermission({ mode: 'readwrite' })) !== 'granted') return toast('Permission not given');
      await this.attach(h);
      await this.check();
    } catch (e) { if (e.name !== 'AbortError') this.fail(e); }
  },

  async attach(h) {
    this.handle = h;
    this.status = 'ok';
    // A different file means the last-seen version no longer applies.
    device.remove('seenToken');
    await idb.set('data', h);
  },

  async unlink() {
    this.handle = null;
    this.status = 'none';
    this.conflict = null;
    this.fileInfo = null;
    device.remove('seenToken');
    await idb.del('data');
    render();
  },

  async readFile() {
    const text = await (await this.handle.getFile()).text();
    if (!text.trim()) return null;
    const file = JSON.parse(text);
    if (!file || file.app !== 'PA App' || !file.data) throw new Error('That file is not a PA App data file');
    return file;
  },

  // Compare the file with this browser and decide: carry on, load the newer file, or ask.
  async check() {
    if (!this.handle || this.status === 'conflict') return;
    try {
      const file = await this.readFile();
      if (!file) { this.status = 'ok'; await this.write(); return; } // brand-new empty file
      this.fileInfo = { savedAt: file.savedAt, savedFrom: file.savedFrom };
      const seen = device.get('seenToken', null);
      const unsaved = device.get('unsaved', false);
      if (file.saveToken === seen) {
        this.status = 'ok';
        if (unsaved) this.schedule();
      } else if (!unsaved || DB.isEmpty()) {
        // Someone else saved and we have nothing of our own to lose. An empty browser never wins.
        this.load(file);
        toast(`Loaded the latest data (saved on ${file.savedFrom || 'another device'})`);
      } else {
        this.status = 'conflict';
        this.conflict = file;
      }
    } catch (e) { this.fail(e); } finally { renderStatus(); }
  },

  load(file) {
    DB.importAll(file.data);
    device.set('seenToken', file.saveToken);
    device.set('unsaved', false);
    this.fileInfo = { savedAt: file.savedAt, savedFrom: file.savedFrom };
    this.status = 'ok';
    this.conflict = null;
    this.error = '';
    render();
    renderDrawer();
  },

  markDirty() {
    device.set('unsaved', true);
    this.schedule();
    renderStatus();
  },

  schedule() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.save(), this.DEBOUNCE_MS);
  },

  async save() {
    if (!this.handle || this.status !== 'ok') return;
    if (this.saving) return this.schedule();
    this.saving = true;
    try {
      const file = await this.readFile();
      // The file moved on since we last read it: stop and ask instead of overwriting someone's work.
      if (file && file.saveToken !== device.get('seenToken', null)) {
        this.status = 'conflict';
        this.conflict = file;
        return;
      }
      await this.write();
    } catch (e) { this.fail(e); } finally { this.saving = false; renderStatus(); }
  },

  async write() {
    const payload = {
      app: 'PA App',
      version: 2,
      saveToken: uid(),
      savedAt: new Date().toISOString(), // instant, not a calendar date
      savedFrom: deviceName(),
      data: DB.exportAll(),
    };
    const w = await this.handle.createWritable(); // writes to a temp copy, swapped in on close
    await w.write(JSON.stringify(payload, null, 1));
    await w.close();
    device.set('seenToken', payload.saveToken);
    device.set('unsaved', false);
    this.fileInfo = { savedAt: payload.savedAt, savedFrom: payload.savedFrom };
    this.status = 'ok';
    this.error = '';
    await this.dailyBackup(payload);
  },

  async keepMine() {
    this.status = 'ok';
    this.conflict = null;
    try { await this.write(); toast("Saved this device's version to the file"); } catch (e) { this.fail(e); }
    renderStatus();
  },

  useTheirs() {
    this.load(this.conflict);
    toast("Loaded the file's version");
  },

  async pickBackupFolder() {
    try {
      this.backupDir = await window.showDirectoryPicker({ mode: 'readwrite' });
      await idb.set('backups', this.backupDir);
      device.remove('lastBackupDay');
      await this.dailyBackup({ app: 'PA App', version: 2, savedAt: new Date().toISOString(), savedFrom: deviceName(), data: DB.exportAll() });
      render();
    } catch (e) { if (e.name !== 'AbortError') this.fail(e); }
  },

  // First save of each day also drops a dated copy in the backups folder. Never overwrites a backup.
  async dailyBackup(payload) {
    if (!this.backupDir) return;
    const day = todayISO();
    if (device.get('lastBackupDay', '') === day) return;
    try {
      if ((await this.backupDir.queryPermission({ mode: 'readwrite' })) !== 'granted') return;
      const now = new Date();
      const h = now.getHours() % 12 || 12;
      const name = `PA App Backup ${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${String(now.getFullYear()).slice(2)} ${h}-${pad(now.getMinutes())}${now.getHours() < 12 ? 'am' : 'pm'}.json`;
      let exists = true;
      try { await this.backupDir.getFileHandle(name); } catch { exists = false; }
      if (!exists) {
        const w = await (await this.backupDir.getFileHandle(name, { create: true })).createWritable();
        await w.write(JSON.stringify(payload, null, 1));
        await w.close();
      }
      device.set('lastBackupDay', day);
    } catch (e) {
      toast('Daily backup failed: ' + e.message);
    }
  },

  fail(e) {
    this.status = this.handle ? 'error' : 'none';
    this.error = e.message || String(e);
    renderStatus();
  },
};

// IndexedDB keeps the file handles so the link survives restarts (localStorage can't hold them).
const idb = {
  open() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('no IndexedDB'));
      const req = indexedDB.open('pa_datafile', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async run(mode, fn) {
    try {
      const db = await this.open();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction('handles', mode);
        const req = fn(tx.objectStore('handles'));
        tx.oncomplete = () => resolve(req.result);
        tx.onerror = () => reject(tx.error);
      });
    } catch { return undefined; }
  },
  get(key) { return this.run('readonly', (s) => s.get(key)); },
  set(key, value) { return this.run('readwrite', (s) => s.put(value, key)); },
  del(key) { return this.run('readwrite', (s) => s.delete(key)); },
};

// ===================== Read-only view (phones) =====================
const RO = {
  info: device.get('roInfo', null), // {fileName, savedAt, savedFrom, openedAt}
  boot() {
    const cached = device.get('roData', null);
    if (cached) { try { DB.importAll(cached); } catch { /* bad cache: start empty */ } }
  },
  async open(file) {
    try {
      const parsed = JSON.parse(await file.text());
      if (!parsed || parsed.app !== 'PA App' || !parsed.data) throw new Error('That file is not a PA App data file');
      DB.importAll(parsed.data);
      this.info = { fileName: file.name, savedAt: parsed.savedAt, savedFrom: parsed.savedFrom, openedAt: new Date().toISOString() };
      device.set('roData', parsed.data);
      device.set('roInfo', this.info);
      toast('Data file opened (read-only)');
      render();
      renderDrawer();
    } catch (e) {
      toast(e.message.startsWith('That file') ? e.message : 'Could not read that file');
    }
  },
};

// ===================== Attachments folder =====================
// Attached files are copied into a folder the user picks once (handle kept in IndexedDB, like the data file).
// The data file stores only {name, file, size, type} — never the file contents — so it stays small and fast.
const safeFileName = (n) => (String(n).replace(/[\\/:*?"<>|]/g, '_').slice(-120) || 'file');
const AT = {
  dir: null,
  status: 'none', // none | reconnect | ok

  async init() {
    if (state.readOnly) return;
    this.dir = (await idb.get('attachments')) || this.dir || null;
    if (this.dir) this.status = (await this.dir.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'reconnect';
    renderDrawer();
  },

  async pickFolder() {
    const inUse = DB.tasks.some((t) => t.attachments.length);
    if (this.dir && inUse && !confirm('Files already attached stay in the current folder — move them into the new folder yourself, or they will show as missing. Change folder?')) return;
    try {
      this.dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'pa-attachments' });
      await idb.set('attachments', this.dir);
      this.status = 'ok';
      toast(`Attachments will be saved in the "${this.dir.name}" folder`);
    } catch (e) {
      if (e.name !== 'AbortError') toast('Could not use that folder: ' + e.message);
    }
    render();
    renderDrawer();
  },

  // After a browser restart; must run from a click.
  async reconnect() {
    if (!this.dir) return this.pickFolder();
    try { this.status = (await this.dir.requestPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'reconnect'; } catch { this.status = 'reconnect'; }
    renderDrawer();
  },

  async uniqueName(name) {
    const dot = name.lastIndexOf('.');
    const base = dot > 0 ? name.slice(0, dot) : name;
    const ext = dot > 0 ? name.slice(dot) : '';
    for (let i = 1; i < 500; i++) {
      const candidate = i === 1 ? name : `${base} (${i})${ext}`;
      try { await this.dir.getFileHandle(candidate); } catch { return candidate; } // not there yet = free
    }
    return `${base} ${uid()}${ext}`;
  },

  async add(task, files) {
    if (state.readOnly || !task) return;
    if (this.status !== 'ok') return toast('Choose or reconnect the attachments folder first');
    let added = 0;
    for (const f of files) {
      try {
        const stored = await this.uniqueName(safeFileName(f.name)); // never overwrite an existing file
        const w = await (await this.dir.getFileHandle(stored, { create: true })).createWritable();
        await w.write(f);
        await w.close();
        task.attachments.push({ id: uid(), name: f.name, file: stored, size: f.size, type: f.type || '', added: Date.now() });
        added++;
      } catch (e) {
        toast(`Could not attach ${f.name}: ${e.message}`);
      }
    }
    if (added) { changed('tasks'); toast(`Attached ${added} file${added > 1 ? 's' : ''}`); }
    render();
    renderDrawer();
  },

  async open(att) {
    if (state.readOnly) return toast('Attached files open on your computer only, for now');
    if (this.status !== 'ok') return toast('Reconnect the attachments folder first');
    let file;
    try { file = await (await this.dir.getFileHandle(att.file)).getFile(); } catch { return toast(`"${att.name}" is not in the attachments folder any more`); }
    const url = URL.createObjectURL(file);
    if (/^(image\/|application\/pdf|text\/)/.test(att.type)) window.open(url, '_blank'); // the browser can show these
    else { const a = document.createElement('a'); a.href = url; a.download = att.name; a.click(); } // e.g. Word files: save a copy
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  },

  async remove(task, attId) {
    const att = task && task.attachments.find((a) => a.id === attId);
    if (!att || state.readOnly) return;
    if (!confirm(`Remove "${att.name}" from this task?`)) return;
    task.attachments = task.attachments.filter((a) => a !== att);
    changed('tasks');
    // Delete the file only when no other task (e.g. another copy of a repeating task) still uses it.
    const stillUsed = DB.tasks.some((t) => t.attachments.some((a) => a.file === att.file));
    if (!stillUsed && this.status === 'ok') { try { await this.dir.removeEntry(att.file); } catch { /* already gone */ } }
    render();
    renderDrawer();
  },
};

function attachCard() {
  return `
    <div class="card edit-only">
      <h2>Attachments folder</h2>
      <p class="sub">${AT.dir
        ? `Files you attach to tasks are copied into the <b>${esc(AT.dir.name)}</b> folder. Keep it in your synced folder next to the data file so every computer sees them.`
        : 'Pick a folder once and files you attach to tasks are copied there. Keep it next to your data file.'}</p>
      <div class="row">
        ${AT.status === 'reconnect' ? '<button class="btn primary" data-action="at-reconnect">Reconnect</button>' : ''}
        <button class="btn" data-action="at-folder">${AT.dir ? 'Change folder' : 'Choose folder'}</button>
      </div>
    </div>`;
}

// ===================== Derived data =====================
const taskDate = (t) => (t.due ? t.due.slice(0, 10) : '');
// A due date without a time is stored at 23:59 ("any time that day") and shown without a time.
const ALL_DAY = '23:59';
const taskTime = (t) => (t.due && t.due.slice(11, 16) !== ALL_DAY ? t.due.slice(11, 16) : '');
const taskLayout = () => device.get('taskLayout', 'board'); // Board is the default; List is one click away
const isOverdue = (t) => !t.done && !!t.due && new Date(t.due) < new Date();
const inMyDay = (t) => t.myDay === todayISO(); // My Day empties itself each morning
const currentTask = () => DB.tasks.find((t) => t.id === state.openTask) || null;

function sortTasks(list) {
  const prio = { high: 0, med: 1, low: 2 };
  return [...list].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (!!a.due !== !!b.due) return a.due ? -1 : 1;
    if (a.due !== b.due) return a.due < b.due ? -1 : 1;
    return prio[a.priority] - prio[b.priority];
  });
}

// previews: optional {date: [upcoming repeats]} from repeatPreviews()
function itemsForDay(key, previews) {
  const events = DB.events.filter((e) => e.date === key).map((e) => ({ ...e, kind: 'event' }));
  const tasks = DB.tasks.filter((t) => taskDate(t) === key).map((t) => ({ id: t.id, title: t.title, time: taskTime(t), done: t.done, kind: 'task' }));
  const repeats = (previews && previews[key]) || [];
  return [...events, ...tasks, ...repeats].sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
}

// ===================== Rendering =====================
function render() {
  document.body.classList.toggle('readonly', state.readOnly);
  $$('.nav-btn').forEach((b) => b.classList.toggle('active', b.dataset.view === state.view));
  const views = { today: renderToday, tasks: renderTasks, calendar: renderCalendar, notes: renderNotes, settings: renderSettings };
  $('#main').innerHTML = (views[state.view] || renderToday)();
  $('.main').classList.toggle('wide', state.view === 'tasks' && taskLayout() === 'board');
  renderStatus();
}

// Status bits only — safe to call while the user is typing (doesn't rebuild the page).
function renderStatus() {
  const theme = device.get('theme', 'auto');
  $('#theme-btn').textContent = `🌓 Theme: ${theme[0].toUpperCase() + theme.slice(1)}`;
  $('#df-badge').innerHTML = statusBadge();
  $('#banner').innerHTML = statusBanner();
  const card = $('#df-card');
  if (card) card.innerHTML = dataFileCard();
}

function statusBadge() {
  if (state.readOnly) return '<span class="status-dot warn"></span>Read-only';
  const unsaved = device.get('unsaved', false);
  switch (DF.status) {
    case 'ok': return unsaved ? '<span class="status-dot warn"></span>Saving…' : '<span class="status-dot on"></span>Saved to file';
    case 'reconnect': return '<span class="status-dot warn"></span>Reconnect file';
    case 'conflict': return '<span class="status-dot bad"></span>Needs a decision';
    case 'error': return '<span class="status-dot bad"></span>Save problem';
    default: return '<span class="status-dot"></span>Browser only';
  }
}

function statusBanner() {
  if (state.readOnly) {
    const i = RO.info;
    return `<div class="banner warn">
      <span>👁 <b>Read-only view.</b> ${i ? `Showing <b>${esc(i.fileName)}</b>, saved ${esc(fmtStamp(i.savedAt))} on ${esc(i.savedFrom || '?')}.` : 'Open your data file to see your tasks, notes and events.'}</span>
      <label class="btn small primary">${i ? 'Open newer file' : 'Open data file'}<input type="file" accept=".json,application/json" data-input="ro-open" hidden></label>
    </div>`;
  }
  switch (DF.status) {
    case 'reconnect':
      return `<div class="banner warn"><span>Your data file needs permission again after the restart. Until then changes only save in this browser.</span>
        <button class="btn small primary" data-action="df-reconnect">Reconnect data file</button></div>`;
    case 'conflict': {
      const c = DF.conflict || {};
      return `<div class="banner error"><span><b>Your data changed here and in the file.</b> The file was saved ${esc(fmtStamp(c.savedAt))} on ${esc(c.savedFrom || 'another device')}. Saving is paused until you choose.</span>
        <span class="row"><button class="btn small" data-action="df-keep-mine">Keep this device's version</button>
        <button class="btn small primary" data-action="df-use-theirs">Use the file's version</button></span></div>`;
    }

      return `<div class="banner error"><span>Couldn't save to the data file: ${esc(DF.error)}</span><button class="btn small" data-action="df-retry">Try again</button></div>`;
    default:
      return '';
  }
}

// ===================== Reminders =====================
// A task can have several reminders. Each is one of:
//   {kind:'before', minutes}           N minutes before the due time (all-day tasks: before 9:00 on the due day)
//   {kind:'dayof', daysBefore, time}   a time of day, N days before the due date (0 = on the day)
//   {kind:'at', at:'YYYY-MM-DDTHH:mm'} an exact date and time, whatever the due date
// `fired` is set once it has gone off; changing the due date resets it.
const REMINDER_PRESETS = [
  ['b0', 'At due time', { kind: 'before', minutes: 0 }],
  ['b10', '10 min before', { kind: 'before', minutes: 10 }],
  ['b60', '1 hour before', { kind: 'before', minutes: 60 }],
  ['b1440', '1 day before', { kind: 'before', minutes: 1440 }],
  ['d0-09:00', '9:00 am on the day', { kind: 'dayof', daysBefore: 0, time: '09:00' }],
  ['d1-21:00', 'Evening before (9:00 pm)', { kind: 'dayof', daysBefore: 1, time: '21:00' }],
];
const presetReminder = (key) => {
  const p = REMINDER_PRESETS.find(([k]) => k === key);
  return p ? { id: uid(), ...p[2], fired: false } : null;
};

function reminderTime(t, r) {
  if (r.kind === 'at') return r.at ? new Date(r.at).getTime() : null;
  if (!t.due) return null;
  if (r.kind === 'dayof') {
    const d = addDays(parseISO(t.due.slice(0, 10)), -(r.daysBefore || 0));
    const [h, m] = (r.time || '09:00').split(':').map(Number);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m).getTime();
  }
  const base = taskTime(t) ? new Date(t.due) : new Date(`${t.due.slice(0, 10)}T09:00`);
  return base.getTime() - (r.minutes || 0) * 60000;
}

function reminderText(t, r) {
  if (r.kind === 'at') return r.at ? `${fmtDay(r.at.slice(0, 10))} ${fmtTime(r.at.slice(11, 16))}` : 'Exact time';
  if (r.kind === 'dayof') {
    const at = fmtTime(r.time || '09:00');
    if (!r.daysBefore) return `${at} on the day`;
    if (r.daysBefore === 1) return r.time === '21:00' ? 'Evening before (9:00 pm)' : `${at} the day before`;
    return `${r.daysBefore} days before, ${at}`;
  }
  const m = r.minutes || 0;
  if (!m) return taskTime(t) ? 'At due time' : '9:00 am on the day';
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'} before`;
  return m % 1440 === 0 ? plural(m / 1440, 'day') : m % 60 === 0 ? plural(m / 60, 'hour') : `${m} min before`;
}

function addReminder(t, r) {
  if (r.kind !== 'at' && !t.due) { toast('Set a due date first — or use "On a date and time"'); return false; }
  t.reminders.push(r);
  askNotifications();
  return true;
}

// Title line + the small details under it; shared by list rows and board cards.
function taskSummary(t) {
  const meta = [];
  if (t.due) {
    const when = `${taskDate(t) === todayISO() ? 'Today' : fmtDay(taskDate(t))}${taskTime(t) ? ' ' + fmtTime(taskTime(t)) : ''}`;
    meta.push(`<span class="${isOverdue(t) ? 'overdue' : ''}">${isOverdue(t) ? 'Overdue · ' : ''}${esc(when)}</span>`);
  }
  if (t.start && t.start > todayISO() && !t.done) meta.push(`<span>Starts ${esc(fmtDay(t.start))}</span>`);
  if (t.reminders.length && !t.done) meta.push(`<span>🔔 ${esc(reminderText(t, t.reminders[0]))}${t.reminders.length > 1 ? ` +${t.reminders.length - 1}` : ''}</span>`);
  if (t.repeat) meta.push(`<span title="Repeats">↻ ${esc(repeatText(t.repeat))}</span>`);
  if (t.progress === 'doing' && !t.done) meta.push('<span class="pill doing">In progress</span>');
  if (inMyDay(t)) meta.push('<span>☀ My Day</span>');
  if (t.checklist.length) meta.push(`<span title="Checklist">☑ ${t.checklist.filter((s) => s.done).length}/${t.checklist.length}</span>`);
  if (t.notes.trim()) meta.push('<span title="Has notes">📝</span>');
  if (t.attachments.length) meta.push(`<span title="Attachments">📎 ${t.attachments.length}</span>`);
  const bucket = DB.buckets.find((b) => b.id === t.bucket);
  const onBoard = state.view === 'tasks' && taskLayout() === 'board'; // the column already says it
  if (bucket && !onBoard) meta.push(`<span>▦ ${esc(bucket.name)}</span>`);
  const labels = t.labels.map((id) => DB.labels.find((l) => l.id === id)).filter(Boolean);
  return `
    <div class="title">${esc(t.title)} ${t.priority !== 'low' ? `<span class="pill ${t.priority}">${t.priority === 'high' ? 'High' : 'Medium'}</span>` : ''} ${labels.map(labelPill).join(' ')}</div>
    ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}`;
}

function taskItem(t) {
  return `
    <li class="item ${t.done ? 'done' : ''}">
      <input type="checkbox" class="check" data-action="toggle-task" data-id="${esc(t.id)}" ${t.done ? 'checked' : ''} ${state.readOnly ? 'disabled' : ''} aria-label="Mark done">
      <div class="body clickable" data-action="open-task" data-id="${esc(t.id)}">${taskSummary(t)}</div>
      <button class="icon-btn edit-only" data-action="delete-task" data-id="${esc(t.id)}" title="Delete">✕</button>
    </li>`;
}

const labelPill = (l) => `<span class="label-pill" style="--lc:${esc(l.color)}">${esc(l.name)}</span>`;

function dayItem(i) {
  const tag = i.kind === 'task' ? '<span class="pill">Task</span>' : i.kind === 'repeat' ? '<span class="pill">↻ Upcoming repeat</span>' : '';
  const del = i.kind === 'event' ? `<button class="icon-btn edit-only" data-action="delete-event" data-id="${esc(i.id)}" title="Delete">✕</button>` : '';
  return `
    <li class="item ${i.done ? 'done' : ''}">
      <span class="time">${i.time ? fmtTime(i.time) : 'All day'}</span>
      <div class="body"><div class="title">${esc(i.title)} ${tag}</div></div>
      ${del}
    </li>`;
}

const DOW_NAMES = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
const DOW_WORD = 'sunday|sun|monday|mon|tuesday|tues|tue|wednesday|wed|thursday|thurs|thur|thu|friday|fri|saturday|sat';
const MONTH_WORD = 'january|jan|february|feb|march|mar|april|apr|may|june|jun|july|jul|august|aug|september|sept|sep|october|oct|november|nov|december|dec';
const monthIndex = (w) => ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'].indexOf(w.slice(0, 3).toLowerCase());
const dowIndex = (w) => DOW_NAMES[w.slice(0, 3).toLowerCase()];
const squash = (s) => s.toLowerCase().replace(/[\s_-]+/g, '');

// Reads a quick-add line. Returns {title, date, time, repeat, priority, labels:[names], bucket, parts:[preview text]}.
function parseQuickAdd(text, now = new Date()) {
  let s = ` ${text} `;
  const out = { title: '', date: '', time: '', repeat: null, priority: '', labels: [], bucket: '', parts: [] };
  const today = parseISO(toISO(now));
  // Find the first match, let fn accept it (anything but false), then cut it out of the text.
  const cut = (re, fn) => {
    const m = s.match(re);
    if (!m || fn(m) === false) return false;
    s = s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length);
    return true;
  };
  const before = '(?:\\s(?:by|on|due|for|this|next))?'; // little words that belong to the date
  const end = '(?=[\\s,.;!?])';

  // Repeat: "every day", "every 2 weeks", "every other month", "every Monday", "weekdays", "daily"…
  cut(new RegExp(`(?:\\srepeats?)?\\s(every\\s+(other\\s+)?(?:(\\d{1,2})\\s+)?(days?|weeks?|months?|years?|weekdays?|${DOW_WORD})|daily|weekly|monthly|yearly|annually|weekdays)${end}`, 'i'), (m) => {
    const n = m[3] ? Number(m[3]) : m[2] ? 2 : 1;
    const unit = (m[4] || m[1]).toLowerCase();
    if (/^(daily|days?)$/.test(unit)) out.repeat = { freq: 'daily', interval: n };
    else if (/^weekdays?$/.test(unit)) out.repeat = { freq: 'weekdays', interval: 1 };
    else if (/^(weekly|weeks?)$/.test(unit)) out.repeat = { freq: 'weekly', interval: n, days: [] };
    else if (/^(monthly|months?)$/.test(unit)) out.repeat = { freq: 'monthly', interval: n };
    else if (/^(yearly|annually|years?)$/.test(unit)) out.repeat = { freq: 'yearly', interval: n };
    else out.repeat = { freq: 'weekly', interval: n, days: [dowIndex(unit)] };
  });

  // Priority: "!" or "!high", "!med", "!low"
  cut(new RegExp(`\\s!(high|urgent|medium|med|low)?${end}`, 'i'), (m) => {
    out.priority = !m[1] || /high|urgent/i.test(m[1]) ? 'high' : /low/i.test(m[1]) ? 'low' : 'med';
  });
  // Labels: "#bills" (made if new). Bucket: "@home" (must already exist).
  while (cut(new RegExp(`\\s#([^\\s#@!,]+)${end}`), (m) => { out.labels.push(m[1]); }));
  cut(new RegExp(`\\s@([^\\s#@!,]+)${end}`), (m) => {
    const b = DB.buckets.find((x) => squash(x.name) === squash(m[1])) || DB.buckets.find((x) => squash(x.name).startsWith(squash(m[1])));
    if (!b) return false;
    out.bucket = b.id;
  });

  // Time: "6pm", "6:30 pm", "at 18:00", "noon"
  const setTime = (h, mi, ap) => {
    h = Number(h); mi = Number(mi || 0);
    if (ap) {
      if (h < 1 || h > 12) return false;
      if (/pm/i.test(ap) && h < 12) h += 12;
      if (/am/i.test(ap) && h === 12) h = 0;
    }
    if (h > 23 || mi > 59) return false;
    out.time = `${pad(h)}:${pad(mi)}`;
  };
  cut(new RegExp(`(?:\\s(?:at|by))?\\s(\\d{1,2})(?::(\\d{2}))?\\s?(am|pm)${end}`, 'i'), (m) => setTime(m[1], m[2], m[3]))
    || cut(new RegExp(`(?:\\s(?:at|by))?\\s([01]?\\d|2[0-3]):([0-5]\\d)${end}`, 'i'), (m) => setTime(m[1], m[2]))
    || cut(new RegExp(`(?:\\s(?:at|by))?\\s(noon|midday)${end}`, 'i'), () => { out.time = '12:00'; });

  // Date
  const setDate = (d) => { out.date = toISO(d); };
  const dated = (y, mIdx, d) => {
    if (mIdx < 0 || d < 1 || d > 31) return false;
    let yy = y ? Number(y) : today.getFullYear();
    if (yy < 100) yy += 2000;
    if (d > daysInMonth(yy, mIdx)) return false;
    let date = new Date(yy, mIdx, d);
    if (!y && date < today) date = new Date(yy + 1, mIdx, Math.min(d, daysInMonth(yy + 1, mIdx))); // "5 Jan" in December = next year
    setDate(date);
  };
  cut(new RegExp(`${before}\\s(today|tonight)${end}`, 'i'), (m) => { setDate(today); if (/tonight/i.test(m[1]) && !out.time) out.time = '20:00'; })
    || cut(new RegExp(`${before}\\s(day after tomorrow)${end}`, 'i'), () => setDate(addDays(today, 2)))
    || cut(new RegExp(`${before}\\s(tomorrow|tmrw|tmr)${end}`, 'i'), () => setDate(addDays(today, 1)))
    || cut(new RegExp(`\\sin\\s(\\d{1,3})\\s(days?|weeks?|months?)${end}`, 'i'), (m) => {
      const n = Number(m[1]);
      setDate(/day/i.test(m[2]) ? addDays(today, n) : /week/i.test(m[2]) ? addDays(today, 7 * n) : addMonthsClamped(today, n));
    })
    || cut(new RegExp(`(?:\\s(?:by|on|due|for))?\\snext\\s(week|month)${end}`, 'i'), (m) => {
      setDate(/week/i.test(m[1]) ? addDays(today, ((8 - today.getDay()) % 7) || 7) : new Date(today.getFullYear(), today.getMonth() + 1, 1));
    })
    || cut(new RegExp(`${before}\\s(${DOW_WORD})${end}`, 'i'), (m) => {
      const diff = (dowIndex(m[1]) - today.getDay() + 7) % 7 || 7; // the coming one, never today
      setDate(addDays(today, diff));
    })
    || cut(new RegExp(`${before}\\s(\\d{1,2})(?:st|nd|rd|th)?\\s(?:of\\s)?(${MONTH_WORD})\\.?(?:,?\\s(\\d{4}))?${end}`, 'i'), (m) => dated(m[3], monthIndex(m[2]), Number(m[1])))
    || cut(new RegExp(`${before}\\s(${MONTH_WORD})\\.?\\s(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s(\\d{4}))?${end}`, 'i'), (m) => dated(m[3], monthIndex(m[1]), Number(m[2])))
    // Day/month numbers: only with a year ("28/10/2026") or after by/on/due ("due 28/10"), so "1/2 kg" stays text.
    || cut(new RegExp(`${before}\\s(\\d{1,2})[/.-](\\d{1,2})[/.-](\\d{2,4})${end}`), (m) => dated(m[3], Number(m[2]) - 1, Number(m[1])))
    || cut(new RegExp(`\\s(?:by|on|due)\\s(\\d{1,2})[/.-](\\d{1,2})${end}`, 'i'), (m) => dated('', Number(m[2]) - 1, Number(m[1])));

  // Fill in what's implied
  const nowKey = `${toISO(now)}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  if (out.repeat && !out.date) {
    // "every Monday" starts on the next Monday (today if it is Monday); other repeats start today —
    // unless the time has already gone today, then at the next repeat.
    const days = out.repeat.days || [];
    let d = today;
    if (days.length) while (!days.includes(d.getDay())) d = addDays(d, 1);
    if (out.repeat.freq === 'weekdays') while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1);
    setDate(d);
    if (out.time && `${out.date}T${out.time}` <= nowKey) {
      const next = nextDue({ due: `${out.date}T${out.time}`, repeat: { interval: 1, days: [], ...out.repeat, anchorDay: d.getDate() } }, now);
      if (next) out.date = next.slice(0, 10);
    }
  }
  if (out.time && !out.date) {
    // "6pm" alone means today, or tomorrow if 6pm has already gone
    setDate(`${toISO(today)}T${out.time}` <= nowKey ? addDays(today, 1) : today);
  }

  let title = s.replace(/\s+/g, ' ').trim();
  for (let i = 0; i < 3; i++) title = title.replace(/[\s,;:-]+(by|on|at|due|for|this|next|every|and)$/i, '').replace(/[\s,;:-]+$/, '');
  out.title = title || text.trim();

  if (out.date) out.parts.push(`📅 ${out.date === toISO(today) ? 'Today' : fmtDay(out.date)}${out.time ? ' ' + fmtTime(out.time) : ''}`);
  if (out.repeat) out.parts.push(`↻ ${repeatText({ interval: 1, days: [], ...out.repeat })}`);
  if (out.priority) out.parts.push(out.priority === 'high' ? '❗ High' : out.priority === 'med' ? 'Medium' : 'Low');
  if (out.bucket) out.parts.push(`▦ ${DB.buckets.find((b) => b.id === out.bucket).name}`);
  for (const l of out.labels) out.parts.push(`🏷 ${l}${DB.labels.some((x) => squash(x.name) === squash(l)) ? '' : ' (new)'}`);
  return out;
}

// Live preview under the box while typing.
function updateQuickPreview(form) {
  const box = form.querySelector('.qa-preview');
  const text = form.elements.title.value;
  // Tool buttons show what they're set to
  const dueDate = form.elements.dueDate;
  const val = form.querySelector('.qa-val');
  if (val) { val.textContent = dueDate.value ? fmtDay(dueDate.value) : 'Due'; val.parentElement.classList.toggle('set', !!dueDate.value); }
  form.querySelectorAll('select.qa-select').forEach((s) => s.classList.toggle('set', !!s.value));
  if (!text.trim()) { box.innerHTML = ''; return; }
  if (form.dataset.raw === '1') {
    box.innerHTML = '<span class="qa-hint">Adding exactly as typed.</span><button type="button" class="qa-link" data-action="qa-raw">Pick out dates again</button>';
    return;
  }
  const p = parseQuickAdd(text);
  if (!p.parts.length) { box.innerHTML = form.dataset.ctx === 'board' ? '' : '<span class="qa-hint">Tip: dates like "tomorrow 5pm" or "every Monday", #label, @bucket, !high — press Enter to add</span>'; return; }
  box.innerHTML = `<span class="qa-hint">“${esc(p.title)}”</span>${p.parts.map((x) => `<span class="qa-chip">${esc(x)}</span>`).join('')}<button type="button" class="qa-link" data-action="qa-raw">Keep words as typed</button>`;
}

function applyRepeat(t, r) {
  if (!t.due) t.due = `${todayISO()}T${ALL_DAY}`;
  t.repeat = { interval: 1, days: [], monthMode: 'date', unit: 'days', until: '', ...r };
  if (t.repeat.freq === 'weekly' && !t.repeat.days.length) t.repeat.days = [parseISO(t.due.slice(0, 10)).getDay()];
  syncRepeatAnchor(t);
}

// Add a task from a quick-add box. Clicked choices beat typed ones; typed ones beat where you are.
function quickAdd(form) {
  const f = form.elements;
  const text = f.title.value;
  const p = form.dataset.raw === '1' ? { title: text.trim(), date: '', time: '', labels: [] } : parseQuickAdd(text);
  if (!p.title) return null;
  const ctx = form.dataset.ctx;
  const date = (f.dueDate && f.dueDate.value) || p.date;
  const due = date ? `${date}T${p.time || ALL_DAY}` : '';
  const pickedBucket = f.bucket && f.bucket.value;
  const t = addTask({
    title: p.title,
    due,
    priority: p.priority || 'low',
    reminders: f.remind && f.remind.value ? [presetReminder(f.remind.value)] : [], // no reminder unless you pick one
    bucket: pickedBucket || p.bucket || (ctx === 'board' ? form.dataset.bucket : undefined),
    myDay: ctx === 'today' ? todayISO() : '',
  });
  if (p.bucket && !pickedBucket) t.bucket = p.bucket;
  for (const name of p.labels) {
    let l = DB.labels.find((x) => squash(x.name) === squash(name));
    if (!l) { addLabel(name, '', null); l = DB.labels[DB.labels.length - 1]; }
    if (!t.labels.includes(l.id)) t.labels.push(l.id);
  }
  const repeatPick = f.repeat && f.repeat.value;
  if (repeatPick) applyRepeat(t, { freq: repeatPick });
  else if (p.repeat) applyRepeat(t, p.repeat);
  changed('tasks', 'labels');
  const bits = [taskDate(t) ? (taskDate(t) === todayISO() ? 'today' : fmtDay(taskDate(t))) + (taskTime(t) ? ' ' + fmtTime(taskTime(t)) : '') : '', t.repeat ? repeatText(t.repeat).toLowerCase() : ''].filter(Boolean);
  toast(`Added “${t.title}”${bits.length ? ' — ' + bits.join(', ') : ''}`);
  return t;
}

function renderToday() {
  const now = new Date();
  const hour = now.getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const tk = todayISO();
  const open = DB.tasks.filter((t) => !t.done);
  const dueToday = sortTasks(DB.tasks.filter((t) => (!t.done && (taskDate(t) === tk || isOverdue(t))) || inMyDay(t)));
  const noDate = sortTasks(open.filter((t) => !t.due && !inMyDay(t))).slice(0, 5);
  const schedule = itemsForDay(tk).filter((i) => i.kind !== 'task');
  return `
    <div class="page-head">
      <div><h1>☀ My Day</h1><p class="sub">${greet} — ${now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })}</p></div>
    </div>
    <div class="grid grid-2" style="margin-bottom:16px">
      <div class="card"><div class="stat">${dueToday.filter((t) => !t.done).length}</div><div class="stat-label">Tasks for today (added to My Day, due today, overdue)</div></div>
      <div class="card"><div class="stat">${schedule.length}</div><div class="stat-label">Events today</div></div>
    </div>
    <div class="grid grid-main">
      <div class="card">
        <h2>Today's tasks</h2>
        ${quickAddBar('today')}
        <ul class="list">${dueToday.map(taskItem).join('') || '<li class="empty">Nothing for today 🎉</li>'}</ul>
        ${noDate.length ? `<h2 style="margin-top:16px">Anytime</h2><ul class="list">${noDate.map(taskItem).join('')}</ul>` : ''}
      </div>
      <div class="card">
        <h2>Schedule <button class="btn small" data-goto="calendar">Open calendar</button></h2>
        <ul class="list">${schedule.map(dayItem).join('') || '<li class="empty">No events today</li>'}</ul>
      </div>
    </div>`;
}

// The Tasks tabs. My Day has its own screen (the first in the sidebar), so it isn't a tab.
const TASK_TABS = {
  all: { label: 'All', test: () => true },
  active: { label: 'Open', test: (t) => !t.done },
  overdue: { label: 'Overdue', test: (t) => isOverdue(t) },
  done: { label: 'Done', test: (t) => t.done },
};

const bucketOf = (t) => DB.buckets.find((b) => b.id === t.bucket) || null; // a deleted bucket counts as none
function matchesFilters(t) {
  const b = state.taskBucket;
  if (b === '-' ? !!bucketOf(t) : b && t.bucket !== b) return false;
  if (state.taskLabel && !t.labels.includes(state.taskLabel)) return false;
  return true;
}

function renderTasks() {
  const f = TASK_TABS[state.taskFilter] ? state.taskFilter : 'active';
  if (state.taskBucket && state.taskBucket !== '-' && !DB.buckets.some((b) => b.id === state.taskBucket)) state.taskBucket = '';
  if (state.taskLabel && !DB.labels.some((l) => l.id === state.taskLabel)) state.taskLabel = '';
  const layout = taskLayout();
  const list = sortTasks(DB.tasks.filter((t) => TASK_TABS[f].test(t) && matchesFilters(t)));
  const tab = (key, label) => `<button class="tab ${f === key ? 'active' : ''}" data-filter="${key}">${label}</button>`;
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(label)}</option>`;
  return `
    <div class="page-head">
      <div><h1>Tasks</h1><p class="sub">${DB.tasks.filter((t) => !t.done).length} open</p></div>
      <div class="tabs">${Object.entries(TASK_TABS).map(([k, v]) => tab(k, v.label)).join('')}</div>
    </div>
    <div class="row toolbar">
      <select class="input" data-input="task-bucket" aria-label="Filter by bucket">
        ${opt('', 'All buckets', state.taskBucket)}${opt('-', 'No bucket', state.taskBucket)}${sortedBuckets().map((b) => opt(b.id, '▦ ' + b.name, state.taskBucket)).join('')}
      </select>
      ${DB.labels.length ? `<select class="input" data-input="task-label" aria-label="Filter by label">
        ${opt('', 'All labels', state.taskLabel)}${DB.labels.map((l) => opt(l.id, l.name, state.taskLabel)).join('')}
      </select>` : ''}
      <span style="flex:1"></span>
      <div class="tabs">
        <button class="tab ${layout === 'list' ? 'active' : ''}" data-action="layout" data-layout="list">☰ List</button>
        <button class="tab ${layout === 'board' ? 'active' : ''}" data-action="layout" data-layout="board">▦ Board</button>
      </div>
    </div>
    ${quickAddBar('tasks')}
    ${layout === 'board' ? renderBoard(list) : `<div class="card">
      <ul class="list">${list.map(taskItem).join('') || '<li class="empty">No tasks here</li>'}</ul>
      ${f === 'done' && list.length ? '<div class="row edit-only" style="justify-content:flex-end;margin-top:8px"><button class="btn small danger" data-action="clear-done">Clear completed</button></div>' : ''}
    </div>`}`;
}

// One column per bucket (plus "No bucket" when it has tasks). Cards drag between columns on a computer.
function renderBoard(list) {
  const cols = [{ id: '', name: 'No bucket' }, ...sortedBuckets()];
  const columns = cols.map((b) => {
    const cards = list.filter((t) => (b.id ? t.bucket === b.id : !bucketOf(t)));
    if (!b.id && !cards.length && DB.buckets.length) return ''; // hide an empty "No bucket" once you have buckets
    return `
      <section class="board-col" data-bucket-col="${esc(b.id)}">
        <header class="board-head">
          <b title="${esc(b.name)}">${esc(b.name)}</b><span class="meta">${cards.length}</span>
          ${b.id ? `<span class="board-tools edit-only">
            <button class="icon-btn" data-action="bucket-left" data-id="${esc(b.id)}" title="Move left">‹</button>
            <button class="icon-btn" data-action="bucket-right" data-id="${esc(b.id)}" title="Move right">›</button>
            <button class="icon-btn" data-action="rename-bucket" data-id="${esc(b.id)}" title="Rename">✎</button>
            <button class="icon-btn" data-action="delete-bucket" data-id="${esc(b.id)}" title="Delete bucket">✕</button>
          </span>` : ''}
        </header>
        ${state.readOnly ? '' : state.boardAdd === b.id ? boardAddCard(b.id) : `<button class="board-add-btn" data-action="board-add" data-bucket="${esc(b.id)}">+ Add task</button>`}
        <div class="board-cards">${cards.map(taskCard).join('') || '<div class="empty small">Nothing here</div>'}</div>
      </section>`;
  }).join('');
  return `
    <div class="board">${columns}
      <section class="board-col edit-only">
        <form class="row" data-form="add-bucket"><input class="input grow" name="title" placeholder="+ New bucket" autocomplete="off" maxlength="40"><button class="btn small primary">Add</button></form>
        <p class="meta">e.g. Home, Work, Bills, Shopping</p>
      </section>

}

function taskCard(t) {
  return `
    <div class="task-card ${t.done ? 'done' : ''}" draggable="${state.readOnly ? 'false' : 'true'}" data-card="${esc(t.id)}">
      <input type="checkbox" class="check" data-action="toggle-task" data-id="${esc(t.id)}" ${t.done ? 'checked' : ''} ${state.readOnly ? 'disabled' : ''} aria-label="Mark done">

}

// ===================== Buckets & labels =====================
const LABEL_COLORS = [
  { name: 'Red', hex: '#ef4444' }, { name: 'Orange', hex: '#f97316' }, { name: 'Green', hex: '#22c55e' },
  { name: 'Blue', hex: '#3b82f6' }, { name: 'Purple', hex: '#a855f7' }, { name: 'Pink', hex: '#ec4899' }, { name: 'Grey', hex: '#64748b' },
];
const colorSelect = (cur, attrs = 'name="color"') =>
  `<select class="input" ${attrs} aria-label="Colour">${LABEL_COLORS.map((c) => `<option value="${c.hex}" ${c.hex === cur ? 'selected' : ''}>${c.name}</option>`).join('')}</select>`;

function addBucket(name) {
  const order = DB.buckets.reduce((m, b) => Math.max(m, b.order), 0) + 1;
  DB.buckets.push({ id: uid(), name: name.trim(), order });
  changed('buckets');
}
function renameBucket(id) {
  const b = DB.buckets.find((x) => x.id === id);
  const name = b && prompt('Rename bucket', b.name);
  if (!name || !name.trim()) return;
  b.name = name.trim();
  changed('buckets');
}
function deleteBucket(id) {
  const b = DB.buckets.find((x) => x.id === id);
  if (!b) return;
  const inIt = DB.tasks.filter((t) => t.bucket === id);
  if (!confirm(`Delete bucket "${b.name}"?${inIt.length ? ` Its ${inIt.length} task(s) move to No bucket.` : ''}`)) return;
  inIt.forEach((t) => { t.bucket = ''; });
  DB.buckets = DB.buckets.filter((x) => x.id !== id);
  changed('buckets', 'tasks');
}
function moveBucket(id, dir) {
  const list = sortedBuckets();
  const i = list.findIndex((b) => b.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i].order, list[j].order] = [list[j].order, list[i].order];
  changed('buckets');
}
function moveTaskToBucket(taskId, bucketId) {
  const t = DB.tasks.find((x) => x.id === taskId);
  if (!t || state.readOnly || t.bucket === bucketId) return;
  t.bucket = bucketId;
  changed('tasks');
  render();
  renderDrawer();
}

function addLabel(name, color, task) {
  const l = { id: uid(), name: name.trim(), color: color || LABEL_COLORS[DB.labels.length % LABEL_COLORS.length].hex };
  DB.labels.push(l);
  if (task) task.labels.push(l.id);
  changed('labels', 'tasks');
}
function renameLabel(id) {
  const l = DB.labels.find((x) => x.id === id);
  const name = l && prompt('Rename label', l.name);
  if (!name || !name.trim()) return;
  l.name = name.trim();
  changed('labels');
}
function deleteLabel(id) {
  const l = DB.labels.find((x) => x.id === id);
  if (!l) return;
  const used = DB.tasks.filter((t) => t.labels.includes(id));
  if (!confirm(`Delete label "${l.name}"?${used.length ? ` It comes off ${used.length} task(s).` : ''}`)) return;
  used.forEach((t) => { t.labels = t.labels.filter((x) => x !== id); });
  DB.labels = DB.labels.filter((x) => x.id !== id);
  changed('labels', 'tasks');
}

function labelBlock(t) {

      <button class="label-pill ${t.labels.includes(l.id) ? 'on' : ''}" style="--lc:${esc(l.color)}" data-action="toggle-label" data-label="${esc(l.id)}" aria-pressed="${t.labels.includes(l.id)}">${esc(l.name)}</button>`).join('')

      <form class="row edit-only" data-form="add-label" style="margin-top:8px"><input class="input grow" name="title" placeholder="New label, e.g. Waiting, Call" autocomplete="off" maxlength="30">${colorSelect(LABEL_COLORS[DB.labels.length % LABEL_COLORS.length].hex)}<button class="btn small primary">Add</button></form>
