const DOW_NAMES = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
const DOW_WORD = 'sunday|sun|monday|mon|tuesday|tues|tue|wednesday|wed|thursday|thurs|thur|thu|friday|fri|saturday|sat';
const MONTH_WORD = 'january|jan|february|feb|march|mar|april|apr|may|june|jun|july|jul|august|aug|september|sept|sep|october|oct|november|nov|december|dec';
const monthIndex = (w) => ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'].indexOf(w.slice(0, 3).toLowerCase());
const dowIndex = (w) => DOW_NAMES[w.slice(0, 3).toLowerCase()];
const squash = (s) => s.toLowerCase().replace(/[\s_-]+/g, '');

// Reads a quick-add line. Returns {title, date, time, repeat, priority, labels:[names], bucket, parts:[preview text]}.
function parseQuickAdd(text, now = new Date()) {
  let s = ` ${text} `;
  const out = { title: '', date: '', time: '', repeat: null, priority: '', labels: [], bucket: '', parts: [] };
  const today = parseISO(toISO(now));
  // Find the first match, let fn accept it (anything but false), then cut it out of the text.
  const cut = (re, fn) => {
    const m = s.match(re);
    if (!m || fn(m) === false) return false;
    s = s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length);
    return true;
  };
  const before = '(?:\\s(?:by|on|due|for|this|next))?'; // little words that belong to the date
  const end = '(?=[\\s,.;!?])';

  // Repeat: "every day", "every 2 weeks", "every other month", "every Monday", "weekdays", "daily"…
  cut(new RegExp(`(?:\\srepeats?)?\\s(every\\s+(other\\s+)?(?:(\\d{1,2})\\s+)?(days?|weeks?|months?|years?|weekdays?|${DOW_WORD})|daily|weekly|monthly|yearly|annually|weekdays)${end}`, 'i'), (m) => {
    const n = m[3] ? Number(m[3]) : m[2] ? 2 : 1;
    const unit = (m[4] || m[1]).toLowerCase();
    if (/^(daily|days?)$/.test(unit)) out.repeat = { freq: 'daily', interval: n };
    else if (/^weekdays?$/.test(unit)) out.repeat = { freq: 'weekdays', interval: 1 };
    else if (/^(weekly|weeks?)$/.test(unit)) out.repeat = { freq: 'weekly', interval: n, days: [] };
    else if (/^(monthly|months?)$/.test(unit)) out.repeat = { freq: 'monthly', interval: n };
    else if (/^(yearly|annually|years?)$/.test(unit)) out.repeat = { freq: 'yearly', interval: n };
    else out.repeat = { freq: 'weekly', interval: n, days: [dowIndex(unit)] };
  });

  // Priority: "!" or "!high", "!med", "!low"
  cut(new RegExp(`\\s!(high|urgent|medium|med|low)?${end}`, 'i'), (m) => {
    out.priority = !m[1] || /high|urgent/i.test(m[1]) ? 'high' : /low/i.test(m[1]) ? 'low' : 'med';
  });
  // Labels: "#bills" (made if new). Bucket: "@home" (must already exist).
  while (cut(new RegExp(`\\s#([^\\s#@!,]+)${end}`), (m) => { out.labels.push(m[1]); }));
  cut(new RegExp(`\\s@([^\\s#@!,]+)${end}`), (m) => {
    const b = DB.buckets.find((x) => squash(x.name) === squash(m[1])) || DB.buckets.find((x) => squash(x.name).startsWith(squash(m[1])));
    if (!b) return false;
    out.bucket = b.id;
  });

  // Time: "6pm", "6:30 pm", "at 18:00", "noon"
  const setTime = (h, mi, ap) => {
    h = Number(h); mi = Number(mi || 0);
    if (ap) {
      if (h < 1 || h > 12) return false;
      if (/pm/i.test(ap) && h < 12) h += 12;
      if (/am/i.test(ap) && h === 12) h = 0;
    }
    if (h > 23 || mi > 59) return false;
    out.time = `${pad(h)}:${pad(mi)}`;
  };
  cut(new RegExp(`(?:\\s(?:at|by))?\\s(\\d{1,2})(?::(\\d{2}))?\\s?(am|pm)${end}`, 'i'), (m) => setTime(m[1], m[2], m[3]))
    || cut(new RegExp(`(?:\\s(?:at|by))?\\s([01]?\\d|2[0-3]):([0-5]\\d)${end}`, 'i'), (m) => setTime(m[1], m[2]))
    || cut(new RegExp(`(?:\\s(?:at|by))?\\s(noon|midday)${end}`, 'i'), () => { out.time = '12:00'; });

  // Date
  const setDate = (d) => { out.date = toISO(d); };
  const dated = (y, mIdx, d) => {
    if (mIdx < 0 || d < 1 || d > 31) return false;
    let yy = y ? Number(y) : today.getFullYear();
    if (yy < 100) yy += 2000;
    if (d > daysInMonth(yy, mIdx)) return false;
    let date = new Date(yy, mIdx, d);
    if (!y && date < today) date = new Date(yy + 1, mIdx, Math.min(d, daysInMonth(yy + 1, mIdx))); // "5 Jan" in December = next year
    setDate(date);
  };
  cut(new RegExp(`${before}\\s(today|tonight)${end}`, 'i'), (m) => { setDate(today); if (/tonight/i.test(m[1]) && !out.time) out.time = '20:00'; })
    || cut(new RegExp(`${before}\\s(day after tomorrow)${end}`, 'i'), () => setDate(addDays(today, 2)))
    || cut(new RegExp(`${before}\\s(tomorrow|tmrw|tmr)${end}`, 'i'), () => setDate(addDays(today, 1)))
    || cut(new RegExp(`\\sin\\s(\\d{1,3})\\s(days?|weeks?|months?)${end}`, 'i'), (m) => {
      const n = Number(m[1]);
      setDate(/day/i.test(m[2]) ? addDays(today, n) : /week/i.test(m[2]) ? addDays(today, 7 * n) : addMonthsClamped(today, n));
    })
    || cut(new RegExp(`(?:\\s(?:by|on|due|for))?\\snext\\s(week|month)${end}`, 'i'), (m) => {
      setDate(/week/i.test(m[1]) ? addDays(today, ((8 - today.getDay()) % 7) || 7) : new Date(today.getFullYear(), today.getMonth() + 1, 1));
    })
    || cut(new RegExp(`${before}\\s(${DOW_WORD})${end}`, 'i'), (m) => {
      const diff = (dowIndex(m[1]) - today.getDay() + 7) % 7 || 7; // the coming one, never today
      setDate(addDays(today, diff));
    })
    || cut(new RegExp(`${before}\\s(\\d{1,2})(?:st|nd|rd|th)?\\s(?:of\\s)?(${MONTH_WORD})\\.?(?:,?\\s(\\d{4}))?${end}`, 'i'), (m) => dated(m[3], monthIndex(m[2]), Number(m[1])))
    || cut(new RegExp(`${before}\\s(${MONTH_WORD})\\.?\\s(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s(\\d{4}))?${end}`, 'i'), (m) => dated(m[3], monthIndex(m[1]), Number(m[2])))
    // Day/month numbers: only with a year ("28/10/2026") or after by/on/due ("due 28/10"), so "1/2 kg" stays text.
    || cut(new RegExp(`${before}\\s(\\d{1,2})[/.-](\\d{1,2})[/.-](\\d{2,4})${end}`), (m) => dated(m[3], Number(m[2]) - 1, Number(m[1])))
    || cut(new RegExp(`\\s(?:by|on|due)\\s(\\d{1,2})[/.-](\\d{1,2})${end}`, 'i'), (m) => dated('', Number(m[2]) - 1, Number(m[1])));

  // Fill in what's implied
  const nowKey = `${toISO(now)}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  if (out.repeat && !out.date) {
    // "every Monday" starts on the next Monday (today if it is Monday); other repeats start today —
    // unless the time has already gone today, then at the next repeat.
    const days = out.repeat.days || [];
    let d = today;
    if (days.length) while (!days.includes(d.getDay())) d = addDays(d, 1);
    if (out.repeat.freq === 'weekdays') while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1);
    setDate(d);
    if (out.time && `${out.date}T${out.time}` <= nowKey) {
      const next = nextDue({ due: `${out.date}T${out.time}`, repeat: { interval: 1, days: [], ...out.repeat, anchorDay: d.getDate() } }, now);
      if (next) out.date = next.slice(0, 10);
    }
  }
  if (out.time && !out.date) {
    // "6pm" alone means today, or tomorrow if 6pm has already gone
    setDate(`${toISO(today)}T${out.time}` <= nowKey ? addDays(today, 1) : today);
  }

  let title = s.replace(/\s+/g, ' ').trim();
  for (let i = 0; i < 3; i++) title = title.replace(/[\s,;:-]+(by|on|at|due|for|this|next|every|and)$/i, '').replace(/[\s,;:-]+$/, '');
  out.title = title || text.trim();

  if (out.date) out.parts.push(`📅 ${out.date === toISO(today) ? 'Today' : fmtDay(out.date)}${out.time ? ' ' + fmtTime(out.time) : ''}`);
  if (out.repeat) out.parts.push(`↻ ${repeatText({ interval: 1, days: [], ...out.repeat })}`);
  if (out.priority) out.parts.push(out.priority === 'high' ? '❗ High' : out.priority === 'med' ? 'Medium' : 'Low');
  if (out.bucket) out.parts.push(`▦ ${DB.buckets.find((b) => b.id === out.bucket).name}`);
  for (const l of out.labels) out.parts.push(`🏷 ${l}${DB.labels.some((x) => squash(x.name) === squash(l)) ? '' : ' (new)'}`);
  return out;
}

// Live preview under the box while typing.
function updateQuickPreview(form) {
  const box = form.querySelector('.qa-preview');
  const text = form.elements.title.value;
  // Tool buttons show what they're set to
  const dueDate = form.elements.dueDate;
  const val = form.querySelector('.qa-val');
  if (val) { val.textContent = dueDate.value ? fmtDay(dueDate.value) : 'Due'; val.parentElement.classList.toggle('set', !!dueDate.value); }
  form.querySelectorAll('select.qa-select').forEach((s) => s.classList.toggle('set', !!s.value));
  if (!text.trim()) { box.innerHTML = ''; return; }
  if (form.dataset.raw === '1') {
    box.innerHTML = '<span class="qa-hint">Adding exactly as typed.</span><button type="button" class="qa-link" data-action="qa-raw">Pick out dates again</button>';
    return;
  }
  const p = parseQuickAdd(text);
  if (!p.parts.length) { box.innerHTML = form.dataset.ctx === 'board' ? '' : '<span class="qa-hint">Tip: dates like "tomorrow 5pm" or "every Monday", #label, @bucket, !high — press Enter to add</span>'; return; }
  box.innerHTML = `<span class="qa-hint">“${esc(p.title)}”</span>${p.parts.map((x) => `<span class="qa-chip">${iconText(x)}</span>`).join('')}<button type="button" class="qa-link" data-action="qa-raw">Keep words as typed</button>`;
}

// Add a task from a quick-add box. Clicked choices beat typed ones; typed ones beat where you are.
function quickAdd(form) {
  const f = form.elements;
  const text = f.title.value;
  const p = form.dataset.raw === '1' ? { title: text.trim(), date: '', time: '', labels: [] } : parseQuickAdd(text);
  if (!p.title) return null;
  const ctx = form.dataset.ctx;
  const date = (f.dueDate && f.dueDate.value) || p.date;
  const due = date ? `${date}T${p.time || ALL_DAY}` : '';
  const pickedBucket = f.bucket && f.bucket.value;
  const t = addTask({
    title: p.title,
    due,
    priority: p.priority || 'low',
    reminders: f.remind && f.remind.value ? [presetReminder(f.remind.value)] : [], // no reminder unless you pick one
    bucket: pickedBucket || p.bucket || (ctx === 'board' ? form.dataset.bucket : undefined),
    myDay: ctx === 'today' ? todayISO() : '',
  });
  if (p.bucket && !pickedBucket) t.bucket = p.bucket;
  for (const name of p.labels) {
    let l = DB.labels.find((x) => squash(x.name) === squash(name));
    if (!l) { addLabel(name, '', null); l = DB.labels[DB.labels.length - 1]; }
    if (!t.labels.includes(l.id)) t.labels.push(l.id);
  }
  const repeat = (f.repeat && f.repeat.value && { freq: f.repeat.value }) || p.repeat;
  if (repeat) TaskEdit.setRepeat(t, repeat); // the message below says it all
  changed('tasks', 'labels');
  const bits = [taskDate(t) ? (taskDate(t) === todayISO() ? 'today' : fmtDay(taskDate(t))) + (taskTime(t) ? ' ' + fmtTime(taskTime(t)) : '') : '', t.repeat ? repeatText(t.repeat).toLowerCase() : ''].filter(Boolean);
  toast(`Added “${fullTitle(t)}”${bits.length ? ' — ' + bits.join(', ') : ''}`);
  return t;
}

// My Day is one timeline of today: what's late from earlier days pinned on top, then today's tasks and events in
// time order with a "Now" line, then what's for any time today, then what's done. Beside it: tasks with no date
// and the next week.
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const andList = (parts) => (parts.length < 2 ? parts.join('') : `${parts.slice(0, -1).join(', ')} and ${parts[parts.length - 1]}`);

function todayPlan(now = new Date()) {
  const tk = toISO(now);
  const all = DB.tasks.filter((t) => !hiddenTask(t));
  const open = all.filter((t) => !t.done);
  const late = sortTasks(open.filter((t) => isOverdue(t) && taskDate(t) < tk));
  const lateIds = new Set(late.map((t) => t.id));
  const today = all.filter((t) => !lateIds.has(t.id) && ((!t.done && taskDate(t) === tk) || inMyDay(t)));
  const events = DB.events.filter((e) => e.date === tk);
  const timed = [
    ...today.filter((t) => !t.done && taskTime(t) && taskDate(t) === tk).map((t) => ({ kind: 'task', time: taskTime(t), t })),
    ...events.filter((e) => e.time).map((e) => ({ kind: 'event', time: e.time, e })),
  ].sort((a, b) => a.time.localeCompare(b.time));
  const anyTime = [
    ...events.filter((e) => !e.time).map((e) => ({ kind: 'event', e })),
    ...sortTasks(today.filter((t) => !t.done && !(taskTime(t) && taskDate(t) === tk))).map((t) => ({ kind: 'task', t })),
  ];
  const doneToday = all.filter((t) => t.done && t.completedAt && toISO(new Date(t.completedAt)) === tk)
    .sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt)); // newest first
  const noDate = sortTasks(open.filter((t) => !t.due && !inMyDay(t))).slice(0, 5);
  const week = toISO(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7));
  const coming = [
    ...open.filter((t) => taskDate(t) > tk && taskDate(t) <= week).map((t) => ({ kind: 'task', date: taskDate(t), time: taskTime(t), t })),
    ...DB.events.filter((e) => e.date > tk && e.date <= week).map((e) => ({ kind: 'event', date: e.date, time: e.time || '', e })),
  ].sort((a, b) => a.date.localeCompare(b.date) || (a.time || '99').localeCompare(b.time || '99')).slice(0, 6);
  return { late, timed, anyTime, doneToday, noDate, coming, taskCount: timed.filter((x) => x.kind === 'task').length + anyTime.filter((x) => x.kind === 'task').length, eventCount: events.length };
}

// One row of the timeline: a tick box (tasks) or a calendar mark (events), the time, and the thing itself.
function timelineRow(x, { time = true, date = false, noDue = time || date } = {}) {
  const when = `${date ? `<span class="tl-date">${esc(fmtDay(x.date))}</span>` : ''}${time ? `<span class="time">${x.time ? fmtTime(x.time) : ''}</span>` : ''}`;
  if (x.kind === 'event') {
    const e = x.e;
    return `
    <li class="item tl-row tl-event">
      <span class="tl-mark" title="Event">${ic('calendar-event')}</span>
      ${when}
      <div class="body"><div class="title">${esc(e.title)}</div>${!time && e.time ? `<div class="meta"><span>${fmtTime(e.time)}</span></div>` : ''}</div>
      <button class="icon-btn edit-only" data-action="delete-event" data-id="${esc(e.id)}" title="Delete" aria-label="Delete event">${ic('x')}</button>
    </li>`;
  }
  const t = x.t;
  return `
    <li class="item tl-row ${t.done ? 'done' : ''} ${x.time && isOverdue(t) ? 'tl-past' : ''}">
      <input type="checkbox" class="check" data-action="toggle-task" data-id="${esc(t.id)}" ${t.done ? 'checked' : ''} ${state.readOnly ? 'disabled' : ''} aria-label="${t.done ? 'Mark not done' : 'Mark done'}">
      ${when}
      <div class="body clickable" data-action="open-task" data-id="${esc(t.id)}">${taskSummary(t, { noDue })}</div>
      <button class="icon-btn edit-only" data-action="delete-task" data-id="${esc(t.id)}" title="Delete" aria-label="Delete task">${ic('x')}</button>
    </li>`;
}

function renderToday() {
  const now = new Date();
  const hour = now.getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const p = todayPlan(now);
  const counts = [p.taskCount ? plural(p.taskCount, 'task') : '', p.eventCount ? plural(p.eventCount, 'event') : ''].filter(Boolean);
  const summary = counts.length ? `${andList(counts)} today` : 'Nothing planned today';
  const lateNote = p.late.length ? `, ${p.late.length} late from before` : '';
  // The "Now" line goes between what's past and what's still to come today.
  const nowHM = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const cut = p.timed.findIndex((x) => x.time > nowHM);
  const timedRows = p.timed.map((x) => timelineRow(x));
  if (p.timed.length) timedRows.splice(cut === -1 ? timedRows.length : cut, 0, `<li class="tl-now" aria-label="Now"><span class="time">${fmtTime(nowHM)}</span><span class="tl-rule"></span></li>`);
  const section = (title, rows, cls = '') => (rows.length ? `<h2 class="tl-h ${cls}">${title}</h2><ul class="list tl">${rows.join('')}</ul>` : '');
  const nothing = !p.late.length && !p.timed.length && !p.anyTime.length && !p.doneToday.length;
  return `
    <div class="page-head">
      <div><h1>My Day</h1><p class="sub">${greet}. ${now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })}. ${summary}${lateNote}.</p></div>
      <button class="btn primary edit-only" data-action="new-task" title="Add a task and fill in its details">${ic('plus', 'sm')}New task</button>
    </div>
    <div class="grid grid-main today">
      <div class="card tl-card">
        ${quickAddBar('today')}
        ${section('Late', p.late.map((t) => timelineRow({ kind: 'task', t }, { time: false })), 'tl-late')}
        ${section('Today', timedRows)}
        ${section(p.timed.length ? 'Any time today' : 'Today', p.anyTime.map((x) => timelineRow(x, { time: false, noDue: true })))}
        ${section('Done today', p.doneToday.map((t) => timelineRow({ kind: 'task', t }, { time: false })), 'tl-done')}
        ${nothing ? '<p class="empty">Nothing due today. Add something above, or enjoy the space.</p>' : ''}
      </div>
      <div class="today-side">
        <div class="card">
          <h2>Coming up <button class="btn small" data-goto="calendar">${ic('calendar', 'sm')}Calendar</button></h2>
          <ul class="list tl">${p.coming.map((x) => timelineRow(x, { time: false, date: true })).join('') || '<li class="empty">Nothing in the next 7 days</li>'}</ul>
        </div>
        ${p.noDate.length ? `<div class="card"><h2>Anytime</h2><ul class="list tl">${p.noDate.map((t) => timelineRow({ kind: 'task', t }, { time: false })).join('')}</ul></div>` : ''}
      </div>
    </div>`;
}

// The Tasks tabs. My Day has its own screen (the first in the sidebar), so it isn't a tab.
const TASK_TABS = {
  all: { label: 'All', test: () => true },
  active: { label: 'Open', test: (t) => !t.done },
  overdue: { label: 'Overdue', test: (t) => isOverdue(t) },
  done: { label: 'Done', test: (t) => t.done },
};

const bucketOf = (t) => DB.buckets.find((b) => b.id === t.bucket) || null; // a deleted bucket counts as none
function matchesFilters(t) {
  const b = state.taskBucket;
  if (b === '-' ? !!bucketOf(t) : b && t.bucket !== b) return false;
  if (state.taskLabel && !t.labels.includes(state.taskLabel)) return false;
  return true;
}

function renderTasks() {
  const f = TASK_TABS[state.taskFilter] ? state.taskFilter : 'active';
  if (state.taskBucket && state.taskBucket !== '-' && !DB.buckets.some((b) => b.id === state.taskBucket)) state.taskBucket = '';
  if (state.taskLabel && !DB.labels.some((l) => l.id === state.taskLabel)) state.taskLabel = '';
  const layout = taskLayout();
  const sortBy = SORTS[device.get('taskSort', 'due')] ? device.get('taskSort', 'due') : 'due';
  const groupBy = device.get('taskGroup', 'none');
  const list = sortTasks(DB.tasks.filter((t) => TASK_TABS[f].test(t) && matchesFilters(t) && !hiddenTask(t)), sortBy);
  const tab = (key, label) => `<button class="tab ${f === key ? 'active' : ''}" data-filter="${key}">${label}</button>`;
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(label)}</option>`;
  const listHtml = (items) => items.map(taskItem).join('');
  const groups = groupBy === 'none' ? null : groupTasks(list, groupBy);
  return `
    <div class="sticky-top">
    <div class="page-head">
      <div><h1>Tasks</h1><p class="sub">${DB.tasks.filter((t) => !t.done).length} open</p></div>
      <div class="tabs">${Object.entries(TASK_TABS).map(([k, v]) => tab(k, v.label)).join('')}</div>
    </div>
    <div class="row toolbar">
      <select class="input" data-input="task-sort" aria-label="Sort by" title="Sort by">
        ${Object.entries(SORTS).map(([k, label]) => opt(k, label, sortBy)).join('')}
      </select>
      ${layout === 'list' ? `<select class="input" data-input="task-group" aria-label="Group by" title="Group by">
        ${opt('none', 'No groups', groupBy)}${opt('due', 'Group by due date', groupBy)}${opt('bucket', 'Group by bucket', groupBy)}
      </select>` : ''}
      <select class="input" data-input="task-bucket" aria-label="Filter by bucket">
        ${opt('', 'All buckets', state.taskBucket)}${opt('-', 'No bucket', state.taskBucket)}${sortedBuckets().map((b) => opt(b.id, b.name, state.taskBucket)).join('')}
      </select>
      ${DB.labels.length ? `<select class="input" data-input="task-label" aria-label="Filter by label">
        ${opt('', 'All labels', state.taskLabel)}${DB.labels.map((l) => opt(l.id, l.name, state.taskLabel)).join('')}
      </select>` : ''}
      <span style="flex:1"></span>
      <button class="btn primary edit-only" data-action="new-task" title="Add a task and fill in its details">+ New task</button>
      <div class="tabs">
        <button class="tab ${layout === 'list' ? 'active' : ''}" data-action="layout" data-layout="list">${ic('list', 'sm')}List</button>
        <button class="tab ${layout === 'board' ? 'active' : ''}" data-action="layout" data-layout="board">${ic('layout-kanban', 'sm')}Board</button>
      </div>
    </div>
    </div>
    ${quickAddBar('tasks')}
    ${layout === 'board' ? renderBoard(list) : `<div class="card">
      ${groups ? groups.map((g) => `<h3 class="group-h">${esc(g.label)} <span>${g.items.length}</span></h3><ul class="list">${listHtml(g.items)}</ul>`).join('') || '<p class="empty">No tasks here</p>'
        : `<ul class="list">${listHtml(list) || '<li class="empty">No tasks here</li>'}</ul>`}
      ${f === 'done' && list.length ? '<div class="row edit-only" style="justify-content:flex-end;margin-top:8px"><button class="btn small danger" data-action="clear-done">Clear completed</button></div>' : ''}
    </div>`}`;
}

// One column per bucket (plus "No bucket" when it has tasks). Cards drag between columns: with the mouse, or by
// holding and dragging on a touch screen (TouchDrag).
function renderBoard(list) {
  const cols = [{ id: '', name: 'No bucket' }, ...sortedBuckets()];
  const columns = cols.map((b) => {
    const cards = list.filter((t) => (b.id ? t.bucket === b.id : !bucketOf(t)));
    if (!b.id && !cards.length && DB.buckets.length) return ''; // hide an empty "No bucket" once you have buckets
    return `
      <section class="board-col" data-bucket-col="${esc(b.id)}">
        <header class="board-head">
          <b title="${esc(b.name)}">${esc(b.name)}</b><span class="meta">${cards.length}</span>
          ${b.id ? `<span class="board-tools edit-only">
            <button class="icon-btn" data-action="bucket-left" data-id="${esc(b.id)}" title="Move left" aria-label="Move left"><svg class="i" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
            <button class="icon-btn" data-action="bucket-right" data-id="${esc(b.id)}" title="Move right" aria-label="Move right"><svg class="i" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
            <button class="icon-btn" data-action="rename-bucket" data-id="${esc(b.id)}" title="Rename" aria-label="Rename"><svg class="i" aria-hidden="true"><use href="#i-pencil"/></svg></button>
            <button class="icon-btn" data-action="delete-bucket" data-id="${esc(b.id)}" title="Delete bucket" aria-label="Delete bucket"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
          </span>` : ''}
        </header>
        ${state.readOnly ? '' : state.boardAdd === b.id ? boardAddCard(b.id) : `<button class="board-add-btn" data-action="board-add" data-bucket="${esc(b.id)}">+ Add task</button>`}
        <div class="board-cards">${cards.map(taskCard).join('') || '<div class="empty small">Nothing here</div>'}</div>
      </section>`;
  }).join('');
  return `
    <div class="board">${columns}
      <section class="board-col edit-only">
        <form class="row" data-form="add-bucket"><input class="input grow" name="title" placeholder="+ New bucket" autocomplete="off" maxlength="40"><button class="btn small primary">Add</button></form>
        <p class="meta">e.g. Home, Work, Bills, Shopping</p>
      </section>
    </div>`;
}

function taskCard(t) {
  if (hiddenTask(t)) return '';
  return `
    <div class="task-card ${t.done ? 'done' : ''}" draggable="${state.readOnly ? 'false' : 'true'}" data-card="${esc(t.id)}">
      <input type="checkbox" class="check" data-action="toggle-task" data-id="${esc(t.id)}" ${t.done ? 'checked' : ''} ${state.readOnly ? 'disabled' : ''} aria-label="Mark done">
      <div class="body clickable" data-action="open-task" data-id="${esc(t.id)}">${taskSummary(t)}</div>
    </div>`;
}

// ===================== Buckets & labels =====================
// A label's colour is stored by these codes (the data file keeps them as they are). Shown, each is drawn in the
// matching warm shade from the design tokens (--lab-*), so labels sit with the rest of Butler in light and dark.
const LABEL_COLORS = [
  { name: 'Red', hex: '#ef4444', tok: 'red' }, { name: 'Orange', hex: '#f97316', tok: 'orange' }, { name: 'Green', hex: '#22c55e', tok: 'green' },
  { name: 'Blue', hex: '#3b82f6', tok: 'blue' }, { name: 'Purple', hex: '#a855f7', tok: 'purple' }, { name: 'Pink', hex: '#ec4899', tok: 'pink' }, { name: 'Grey', hex: '#64748b', tok: 'grey' },
];
const labelInk = (hex) => { const c = LABEL_COLORS.find((x) => x.hex === String(hex).toLowerCase()); return c ? `var(--lab-${c.tok})` : esc(hex); };
const colorSelect = (cur, attrs = 'name="color"') =>
  `<select class="input" ${attrs} aria-label="Colour">${LABEL_COLORS.map((c) => `<option value="${c.hex}" ${c.hex === cur ? 'selected' : ''}>${c.name}</option>`).join('')}</select>`;

function addBucket(name) {
  const order = DB.buckets.reduce((m, b) => Math.max(m, b.order), 0) + 1;
  DB.buckets.push({ id: uid(), name: name.trim(), order });
  changed('buckets');
}
async function renameBucket(id) {
  const b = DB.buckets.find((x) => x.id === id);
  const name = b && (await askText('Rename bucket', b.name, { yes: 'Rename' }));
  if (!name || !name.trim()) return;
  b.name = name.trim();
  changed('buckets');
}
async function deleteBucket(id) {
  const b = DB.buckets.find((x) => x.id === id);
  if (!b) return;
  const inIt = DB.tasks.filter((t) => t.bucket === id);
  if (!(await ask(`Delete bucket "${b.name}"?${inIt.length ? ` Its ${inIt.length} task(s) move to No bucket.` : ''}`, { yes: 'Delete', danger: true }))) return;
  inIt.forEach((t) => { t.bucket = ''; });
  DB.buckets = DB.buckets.filter((x) => x.id !== id);
  changed('buckets', 'tasks');
}
function moveBucket(id, dir) {
  const list = sortedBuckets();
  const i = list.findIndex((b) => b.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i].order, list[j].order] = [list[j].order, list[i].order];
  changed('buckets');
}
function moveTaskToBucket(taskId, bucketId) {
  const t = DB.tasks.find((x) => x.id === taskId);
  if (!t || state.readOnly || t.bucket === bucketId) return;
  t.bucket = bucketId;
  changed('tasks');
  render();
  renderDrawer();
}

function addLabel(name, color, task) {
  const l = { id: uid(), name: name.trim(), color: color || LABEL_COLORS[DB.labels.length % LABEL_COLORS.length].hex };
  DB.labels.push(l);
  if (task) task.labels.push(l.id);
  changed('labels', 'tasks');
}
async function renameLabel(id) {
  const l = DB.labels.find((x) => x.id === id);
  const name = l && (await askText('Rename label', l.name, { yes: 'Rename' }));
  if (!name || !name.trim()) return;
  l.name = name.trim();
  changed('labels');
}
async function deleteLabel(id) {
  const l = DB.labels.find((x) => x.id === id);
  if (!l) return;
  const used = DB.tasks.filter((t) => t.labels.includes(id));
  if (!(await ask(`Delete label "${l.name}"?${used.length ? ` It comes off ${used.length} task(s).` : ''}`, { yes: 'Delete', danger: true }))) return;
  used.forEach((t) => { t.labels = t.labels.filter((x) => x !== id); });
  DB.labels = DB.labels.filter((x) => x.id !== id);
  changed('labels', 'tasks');
}

        || '<span class="p-text muted">Labels</span>'}

        <button type="button" class="icon-btn" data-action="delete-label" data-id="${esc(l.id)}" title="Delete label" aria-label="Delete label"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>

function manageCard() {

    <div class="card">

      <form class="row edit-only" data-form="add-bucket" style="margin-top:8px"><input class="input grow" name="title" placeholder="New bucket, e.g. Home, Work, Bills" autocomplete="off" maxlength="40"><button class="btn small primary">Add</button></form>
      <h2 style="margin-top:18px">Labels</h2>

        </div>`).join('') || '<p class="sub">No labels yet.</p>'}
      <form class="row edit-only" data-form="add-label" style="margin-top:8px"><input class="input grow" name="title" placeholder="New label, e.g. Waiting, Call" autocomplete="off" maxlength="30">${colorSelect(LABEL_COLORS[DB.labels.length % LABEL_COLORS.length].hex)}<button class="btn small primary">Add</button></form>

// ===================== Task details drawer =====================
// Rebuilt only when its structure changes (open, close, checklist, labels…) — never while you type,
// so the cursor stays put. Typing updates the task in place.
function renderDrawer() {
  const el = $('#drawer');
  const t = currentTask();
  document.body.classList.toggle('drawer-open', !!t);
  if (!t) { state.openTask = null; el.innerHTML = ''; el.dataset.task = ''; return; }
  // Rebuilding the panel would jump it back to the top — keep the scroll position for the same task.
  const oldBody = el.querySelector('.drawer-body');
  const keepScroll = oldBody && el.dataset.task === t.id ? oldBody.scrollTop : 0;
  const ro = state.readOnly ? 'disabled' : '';
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${String(cur) === String(v) ? 'selected' : ''}>${esc(label)}</option>`;
  const doneSteps = t.checklist.filter((s) => s.done).length;
  el.dataset.task = t.id;
  queueMicrotask(() => { const b = el.querySelector('.drawer-body'); if (b && keepScroll) b.scrollTop = keepScroll; });
  el.innerHTML = `
    <div class="drawer-head">
      <input type="checkbox" class="check" data-action="toggle-task" data-id="${esc(t.id)}" ${t.done ? 'checked' : ''} ${ro} aria-label="Mark done">
      <input class="drawer-title" data-field="title" value="${esc(t.title)}" ${ro} aria-label="Task title" placeholder="Task name">

      <button class="icon-btn" data-action="close-task" title="Close (Esc)" aria-label="Close (Esc)"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <fieldset class="drawer-body" ${ro}>
      <section class="p-card">
        ${t.checklist.length ? `<div class="p-head">Steps <span>${doneSteps}/${t.checklist.length}</span></div>` : ''}
        <ul class="steps">${t.checklist.map((s) => `
          <li class="step ${s.done ? 'done' : ''}">
            <input type="checkbox" class="check" data-action="toggle-step" data-step="${esc(s.id)}" ${s.done ? 'checked' : ''} aria-label="Step done">
            <input class="step-text" data-step-text="${esc(s.id)}" value="${esc(s.text)}" aria-label="Step">
            <button class="icon-btn edit-only" data-action="promote-step" data-step="${esc(s.id)}" title="Turn into its own task" aria-label="Turn into its own task"><svg class="i" aria-hidden="true"><use href="#i-arrow-up-right"/></svg></button>
            <button class="icon-btn edit-only" data-action="delete-step" data-step="${esc(s.id)}" title="Delete step" aria-label="Delete step"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
          </li>`).join('')}</ul>
        <form class="p-row edit-only" data-form="add-step">
          <span class="p-ico accent">＋</span>
          <input class="p-input accent" name="title" placeholder="Add step" autocomplete="off" aria-label="Add step">
        </form>
      </section>

      <section class="p-card">
        <button class="p-row p-click ${inMyDay(t) ? 'on' : ''}" data-action="toggle-myday" data-id="${esc(t.id)}">
          <span class="p-ico"><svg class="i" aria-hidden="true"><use href="#i-sun"/></svg></span><span class="p-text">${inMyDay(t) ? 'Added to My Day' : 'Add to My Day'}</span>${inMyDay(t) ? '<span class="meta edit-only">✕</span>' : ''}
        </button>
      </section>

      <section class="p-card">
        ${t.done ? `<div class="p-row on">
          <span class="p-ico"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg></span><span class="p-lbl">Done on</span>
          <input class="p-input" type="date" data-field="doneDate" value="${esc(toISO(new Date(t.completedAt || Date.now())))}" aria-label="Done on">
          <input class="p-input" style="flex:0 0 auto" type="time" data-field="doneTime" value="${t.completedAllDay ? '' : esc(fmtClock(t.completedAt))}" aria-label="Done at">
          ${t.completedAllDay ? '' : '<button type="button" class="p-mini edit-only" data-action="clear-done-time" title="No time — just the date">no time</button>'}
        </div>${lateText(t) ? `<p class="p-sub late" style="padding-top:0">${lateText(t)}</p>` : ''}` : ''}
        <div class="p-row ${isOverdue(t) ? 'overdue' : t.due ? 'on' : ''}">
          <span class="p-ico"><svg class="i" aria-hidden="true"><use href="#i-calendar-event"/></svg></span><span class="p-lbl">Due</span>
          <input class="p-input" type="date" data-field="dueDate" value="${esc(taskDate(t))}" aria-label="Due date">
          <input class="p-input" style="flex:0 0 auto" type="time" data-field="dueTime" value="${esc(taskTime(t))}" ${t.due ? '' : 'disabled'} aria-label="Due time">
          ${taskTime(t) ? '<button type="button" class="p-mini edit-only" data-action="clear-time" title="No time — any time that day">no time</button>' : ''}
          ${t.due ? '<button type="button" class="icon-btn edit-only" data-action="clear-due" title="Remove the due date" aria-label="Remove the due date"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>' : ''}
        </div>
        ${reminderBlock(t)}
        ${repeatBlock(t)}
      </section>

      <section class="p-card">
        <div class="p-row"><span class="p-ico"><svg class="i" aria-hidden="true"><use href="#i-layout-kanban"/></svg></span><span class="p-lbl">Bucket</span>
          <select class="p-select" data-field="bucket">${opt('', 'No bucket', t.bucket)}${sortedBuckets().map((b) => opt(b.id, b.name, t.bucket)).join('')}</select></div>
        <div class="p-row"><span class="p-ico"><svg class="i" aria-hidden="true"><use href="#i-flag"/></svg></span><span class="p-lbl">Priority</span>
          <select class="p-select" data-field="priority">${opt('low', 'Low', t.priority)}${opt('med', 'Medium', t.priority)}${opt('high', 'High', t.priority)}</select></div>
        <div class="p-row"><span class="p-ico"><svg class="i" aria-hidden="true"><use href="#i-progress"/></svg></span><span class="p-lbl">Progress</span>
          <select class="p-select" data-field="progress">${opt('not', 'Not started', t.progress)}${opt('doing', 'In progress', t.progress)}</select></div>
        <div class="p-row"><span class="p-ico"><svg class="i" aria-hidden="true"><use href="#i-player-play"/></svg></span><span class="p-lbl">Start</span>
          <input class="p-input" type="date" data-field="start" value="${esc(t.start)}" aria-label="Start date"></div>
        ${labelBlock(t)}
      </section>

      <section class="p-card">${attachBlock(t)}</section>

      <section class="p-card">
        <textarea class="p-notes" data-field="notes" rows="5" placeholder="Add note">${esc(t.notes)}</textarea>
      </section>

      ${historyBlock(t)}
    </fieldset>
    <div class="drawer-foot">
      <span class="meta">${t.created ? 'Created ' + esc(fmtStamp(t.created)) : ''}</span>
      <span class="row" style="gap:6px">
        <button class="btn small edit-only" data-action="duplicate-task" title="Make a copy of this task">${ic('copy', 'sm')}Duplicate</button>
        <button class="btn small danger edit-only" data-action="delete-task" data-id="${esc(t.id)}">Delete</button>
      </span>
    </div>`;
}
// Filled in by later sections (buckets/labels, recurring, attachments).
function sortedBuckets() { return [...DB.buckets].sort((a, b) => a.order - b.order); }
const fmtSize = (b) => (b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : b >= 1024 ? `${Math.round(b / 1024)} KB` : `${b || 0} B`);
const fileIcon = (a) => ic(/^image\//.test(a.type) ? 'photo' : /pdf/.test(a.type) || /\.pdf$/i.test(a.name) ? 'file-type-pdf' : 'file-text');

function reminderBlock(t) {
  const list = t.reminders.map((r) => `
    <div class="p-row">
      <span class="p-ico"><svg class="i" aria-hidden="true"><use href="#i-bell"/></svg></span><span class="p-text">${esc(Reminders.text(t, r))}</span>
      ${r.fired ? '<span class="meta">done</span>' : ''}
      <button class="icon-btn edit-only" data-action="edit-reminder" data-rem="${esc(r.id)}" title="Change reminder" aria-label="Change reminder"><svg class="i" aria-hidden="true"><use href="#i-pencil"/></svg></button>
      <button class="icon-btn edit-only" data-action="delete-reminder" data-rem="${esc(r.id)}" title="Remove reminder" aria-label="Remove reminder"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>`).join('');
  const c = state.remCustom;
  // Editing fills the form with the reminder's current values; adding starts from sensible ones.
  const editing = state.remEdit && t.reminders.find((r) => r.id === state.remEdit);
  const v = { n: 30, unit: 1, days: 1, time: '21:00', at: '' };
  if (editing) {
    const m = editing.minutes || 0;
    if (editing.kind === 'before') Object.assign(v, m && m % 1440 === 0 ? { n: m / 1440, unit: 1440 } : m && m % 60 === 0 ? { n: m / 60, unit: 60 } : { n: m, unit: 1 });
    if (editing.kind === 'dayof') Object.assign(v, { days: editing.daysBefore || 0, time: editing.time || '09:00' });
    if (editing.kind === 'at') v.at = editing.at || '';
  }
  const unitOpt = (val, label) => `<option value="${val}" ${v.unit === val ? 'selected' : ''}>${label}</option>`;
  const custom = !c ? '' : `
    <form class="p-sub row edit-only" data-form="add-reminder" data-kind="${c}">
      ${editing ? '<span class="meta">Change:</span>' : ''}
      ${c === 'before' ? `<input class="num-box" type="number" name="n" min="0" max="999" value="${v.n}" aria-label="How many">

        : c === 'dayof' ? `<input class="num-box" type="number" name="days" min="0" max="60" value="${v.days}" aria-label="Days before"> day(s) before, at
        <input class="input" type="time" name="time" value="${esc(v.time)}" required aria-label="Time">`

      <button class="btn small primary">${editing ? 'Save' : 'Add'}</button>

  return `

        ${REMINDER_PRESETS.map(([k, label]) => `<option value="${k}">${esc(label)}</option>`).join('')}
        <option value="custom-before">Custom: some time before…</option>

        <option value="custom-at">On a date and time…</option>

    </div>

}

// Every other copy of a repeating task, newest first: when it was due and done, its notes and its own files
// (e.g. each month's bill). Click a title to open that copy; click a file to open it.
function historyBlock(t) {
  if (!t.seriesId) return '';
  const series = DB.tasks.filter((x) => x.seriesId === t.seriesId && x.id !== t.id);
  // History = copies that came before this one and are done. Upcoming/current ones aren't history.
  const earlier = (x) => ((x.seriesIndex || 1) !== (t.seriesIndex || 1) ? (x.seriesIndex || 1) < (t.seriesIndex || 1) : (x.due || '') < (t.due || ''));
  const others = series.filter((x) => x.done && earlier(x))
    .sort((a, b) => (b.seriesIndex || 0) - (a.seriesIndex || 0) || (b.due || '').localeCompare(a.due || ''));
  // Looking at an old copy: point to the one that's still to do.
  const current = t.done ? series.find((x) => !x.done) : null;
  const currentLink = current ? `<p class="meta">Current copy: <button class="link-btn" style="flex:none" data-action="open-history" data-id="${esc(current.id)}">${esc(fullTitle(current))} →</button></p>` : '';
  if (!others.length) return currentLink ? `<h3>History</h3>${currentLink}` : '';
  const row = (x) => `
    <li class="history-item">
      <div class="row" style="gap:8px;flex-wrap:nowrap">
        <span style="color:var(--muted)">${ic(x.done ? 'check' : 'circle')}</span>
        <button class="link-btn" data-action="open-history" data-id="${esc(x.id)}" title="Open this copy">${esc(fullTitle(x))}</button>
      </div>
      <div class="meta">${x.due ? `Due ${esc(fmtDay(taskDate(x)))}` : 'No due date'}${x.done && x.completedAt ? ` · done ${esc(x.completedAllDay ? fmtDay(toISO(new Date(x.completedAt))) : fmtStamp(x.completedAt))}` : x.done ? '' : ' · not done yet'}${lateText(x) ? ` · <span class="late">${lateText(x)}</span>` : ''}</div>
      ${x.notes.trim() ? `<div class="meta history-note">${esc(x.notes.trim().split('\n')[0].slice(0, 120))}</div>` : ''}
      ${x.attachments.length ? `<div class="label-row">${x.attachments.map((a) => `
        <button class="btn small" data-action="open-attach" data-task="${esc(x.id)}" data-att="${esc(a.id)}" title="Open ${esc(a.name)}">${fileIcon(a)} ${esc(a.name)}</button>`).join('')}</div>` : ''}
    </li>`;
  return `
    <h3>History <span>${others.length}</span></h3>
    ${currentLink}
    <ul class="history">${others.map(row).join('')}</ul>`;
}

function finishDonePrompt(data) {

// "+ New task" opens the panel on a blank task; if you leave without giving it a name, it's thrown away.

function dropEmptyDraft() {
