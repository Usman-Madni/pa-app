// A field in the drawer changed (selects, dates, and title/notes when you leave them).
function setTaskField(field, value) {
  const t = currentTask();
  if (!t || state.readOnly) return;
  if (field === 'title') {
    const res = TaskEdit.rename(t, value);
    const typed = titleTyping && titleTyping.id === t.id && titleTyping.was !== t.title; // copies renamed while typing
    titleTyping = null;
    if (!res.ok) { renderDrawer(); return; } // an empty title puts the old one back
    say(res.note ? res : { note: typed ? TaskEdit.renamedNote(TaskEdit.otherCopies(t)) : '' });
  } else if (field === 'period') {
    t.period = value.trim().replace(/^\((.*)\)$/, '$1'); // typed with brackets → without
    changed('tasks');
    render();
    renderDrawer(); // updates the "next one" preview
    return;
  } else if (field === 'dueDate' || field === 'dueTime') {
    if (field === 'dueTime' && !t.due) return;
    say(field === 'dueDate' ? TaskEdit.setDue(t, value) : TaskEdit.setDue(t, taskDate(t), value));
    changed('tasks');
    render();
    renderDrawer(); // date/time fields and the "next one is due…" line depend on it
    return;
  } else if (field === 'doneDate' || field === 'doneTime') {
    const d = new Date(t.completedAt || Date.now());
    const time = t.completedAllDay ? '' : `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    doneDateMoved(t, field === 'doneDate' ? Series.setDone(t, value, time) : Series.setDone(t, toISO(d), value)); // saves and redraws
    return;
  }
  else if (['bucket', 'progress', 'priority', 'start', 'notes'].includes(field)) t[field] = value;
  else return;
  changed('tasks');
  render();
}
// ===================== Task edits =====================
// The edits that bring follow-up steps with them, for every place a task is edited: the panel, its buttons,
// quick add and To Do. Each changes the task and returns {ok, note}: note is a message for whoever made the edit
// to show ('' = none). Nothing here shows messages or redraws, and the caller still calls changed().
const TaskEdit = {
  // The due date. day: 'YYYY-MM-DD', or '' for none; time: 'HH:mm', '' for all day, or left out to keep the one it has.
  // Relative reminders count from the new date again, and a repeat keeps its anchor in step. A repeating task keeps
  // its due date: its next copies are counted from it.
  setDue(t, day, time) {
    if (!day && t.repeat) return { ok: false, note: 'A repeating task needs a due date — stop the repeat first' };
    const hhmm = time === undefined ? (t.due ? t.due.slice(11, 16) : ALL_DAY) : time || ALL_DAY;
    t.due = day ? `${day}T${hhmm}` : '';
    Reminders.rearm(t);
    this.anchor(t);
    return { ok: true, note: '' };
  },
  // A new title (and moving part, if given) for the task. A title belongs to the whole repeating task: every copy is
  // renamed, done ones too, each keeping its own moving part. That doesn't count as changing a copy, so unticking can
  // still tidy an untouched one away.
  rename(t, title, period) {
    title = title.trim();
    if (!title) return { ok: false, note: '' }; // never a task without a title
    t.title = title;
    if (period !== undefined) t.period = period;
    if (!t.seriesId) return { ok: true, note: '', renamed: 0 };
    const series = DB.tasks.filter((x) => x.seriesId === t.seriesId);
    const renamed = series.filter((x) => x !== t && x.title !== title).length;
    for (const x of series) Series.quietly(x, 'title', title);
    return { ok: true, note: this.renamedNote(renamed), renamed };
  },
  renamedNote: (n) => (n ? `Renamed ${n} other cop${n === 1 ? 'y' : 'ies'} of this task too` : ''),
  otherCopies: (t) => (t.seriesId ? DB.tasks.filter((x) => x.seriesId === t.seriesId && x !== t).length : 0),
  // How it repeats: r = {freq, …} replaces the repeat (missing settings take their defaults); null stops it. Starting
  // to repeat moves a date in the title ("Aug bill") into the moving part, so it moves forward, and a task with no
  // due date gets today's.
  setRepeat(t, r) {
    if (!r) { t.repeat = null; return { ok: true, note: '' }; }
    const notes = [];
    if (!t.repeat && !t.period) {
      const s = splitPeriod(t.title);
      if (s.period) { Object.assign(t, s); notes.push(`"${s.period}" is now the moving part — it moves forward with each repeat`); }
    }
    if (!t.due) { t.due = `${todayISO()}T${ALL_DAY}`; notes.push('Repeating tasks need a due date, so it is set to today — change it if you like'); }
    t.repeat = { interval: 1, days: [], monthMode: 'date', unit: 'days', until: '', ...r };
    if (t.repeat.freq === 'weekly' && !t.repeat.days.length) t.repeat.days = [parseISO(t.due.slice(0, 10)).getDay()];
    this.anchor(t);
    return { ok: true, note: notes.join('. ') };
  },
  // The repeat's anchor (anchorDay/weekday/nth) comes from the due date, so "the 31st" stays the 31st after a short month.
  anchor(t) {
    const r = t.repeat;
    if (!r || !t.due) return;
    const d = parseISO(t.due.slice(0, 10));
    r.anchorDay = d.getDate();
    r.weekday = d.getDay();
    r.nth = d.getDate() + 7 > daysInMonth(d.getFullYear(), d.getMonth()) ? -1 : Math.ceil(d.getDate() / 7);
  },
};
const say = (res) => { if (res && res.note) toast(res.note); return res; }; // show what an edit reported
// After a done date changed in the panel: a changed next copy is only moved if you say so. Then save and redraw.
async function doneDateMoved(t, res) {
  if (res.outcome === 'changed' && (await ask(res.question, { yes: 'Move it', no: 'Keep it' }))) say(Series.moveNext(t));
  else say(res);
  changed('tasks');
  render();
  renderDrawer();
}

// ===================== Series: ticking, unticking and the next copy =====================
// Ticking a repeating task off makes its next copy; unticking takes an untouched next copy away again. A next copy
// keeps a snapshot of how it was made (spawnSig), so it can tell whether you've changed it since. Like TaskEdit,
// nothing here asks, shows messages or redraws: each call returns what happened ({outcome, note, …}) for the
// caller to show or ask about, and the caller calls changed().
const Series = {
  CHANGE_WORDS: {
    title: 'renamed', period: 'moving part', due: 'due date', notes: 'notes', checklist: 'steps', attachments: 'attachments',
    reminders: 'reminders', priority: 'priority', bucket: 'bucket', labels: 'labels', start: 'start date', progress: 'progress', repeat: 'repeat',
  },
  // Tick off. doneAt = when it was done (default now); allDay = no time given. A repeating task gets its next copy,
  // once: ticking again never makes a second. Returns {next, note}.
  tick(t, doneAt = new Date(), allDay = false) {
    t.done = true;
    t.completedAt = doneAt.getTime();
    t.completedAllDay = !!allDay;
    const next = this.makeNext(t, doneAt);
    return { next, note: next ? `↻ Next one created: ${fmtDay(next.due.slice(0, 10))}` : '' };
  },
  // Back to not done. outcome: 'removed' (an untouched next copy went), 'done' (it's done already, so it stays),
  // 'changed' (changed since it was made, so it stays: the panel asks with `question`, then removeNext), or 'none'.
  untick(t) {
    t.done = false;
    t.completedAt = 0;
    t.completedAllDay = false;
    const next = this.nextOf(t);
    if (!next) { t.spawnedNext = ''; return { outcome: 'none', note: '' }; }
    const name = fullTitle(next);
    if (this.untouched(next)) {
      this.removeNext(t);
      return { outcome: 'removed', next, note: `Removed the next copy (${name}) — it hadn't been changed` };
    }
    if (next.done) return { outcome: 'done', next, note: 'The next copy stays — it\'s already done' };
    const what = this.changes(next);
    return {
      outcome: 'changed', next, note: `The next copy (${name}) stays — it was changed after it was made`,
      question: `The next copy (${name}) was changed after it was made${what ? ` (${what})` : ''}. Remove it anyway?`,
    };
  },
  removeNext(t) {
    const next = this.nextOf(t);
    if (next) DB.tasks = DB.tasks.filter((x) => x !== next);
    if (next && state.openTask === next.id) state.openTask = null;
    t.spawnedNext = '';
  },
  // A done task's done date changed. For "again after I finish it" repeats the next copy is counted from it, so an
  // untouched next copy is made again from the new date. outcome: 'moved', 'changed' (changed since it was made, so
  // it stays: the panel asks with `question`, then moveNext) or 'none'.
  setDone(t, date, time) {
    if (!t.done || !date) return { outcome: 'none', note: '' };
    const allDay = !time;
    const doneAt = new Date(`${date}T${allDay ? '12:00' : time}`);
    t.completedAt = doneAt.getTime();
    t.completedAllDay = allDay;
    if (!t.repeat || t.repeat.freq !== 'after') return { outcome: 'none', note: '' };
    const next = this.nextOf(t);
    if (!next || next.done) return { outcome: 'none', note: '' };
    if (!this.untouched(next)) {
      const due = nextDue(t, doneAt);
      if (!due || due === next.due) return { outcome: 'none', note: '' };
      const what = this.changes(next);
      return {
        outcome: 'changed', next, note: 'The next copy stays',
        question: `The next copy (${fullTitle(next)}) was changed after it was made${what ? ` (${what})` : ''}. Move it to ${fmtDay(due.slice(0, 10))} anyway?`,
      };
    }
    this.removeNext(t);
    const again = this.makeNext(t, doneAt);
    return { outcome: 'moved', next: again, note: again ? `Next one moved to ${fmtDay(again.due.slice(0, 10))}` : '' };
  },
  // Move a changed next copy to where the done date puts it: only its due date changes, so what you changed stays.
  moveNext(t) {
    const next = this.nextOf(t);
    const due = next && nextDue(t, new Date(t.completedAt));
    if (!due) return { outcome: 'none', note: '' };
    TaskEdit.setDue(next, due.slice(0, 10), due.slice(11, 16));
    return { outcome: 'moved', next, note: `Next one moved to ${fmtDay(due.slice(0, 10))}` };
  },
  // "Title (copy)": everything but attachments, done state, progress and series; it stays in My Day, since you're
  // likely working on it today. Returns the copy, placed after the task.
  duplicate(t) {
    const copy = this.fresh(t, { title: `${t.title} (copy)`, attachments: [], seriesId: '', seriesIndex: 1 });
    DB.tasks.splice(DB.tasks.indexOf(t) + 1, 0, copy);
    return copy;
  },
  // Change one field of a copy without it counting as changing the copy (renaming the series).
  quietly(x, key, value) {
    let untouched = false;
    try { const was = JSON.parse(x.spawnSig); was[key] = x[key]; untouched = JSON.stringify(was) === this.sig(x); } catch { /* not a next copy */ }
    x[key] = value;
    if (untouched) x.spawnSig = this.sig(x);
  },
  // What was changed on a copy since it was made, in words ("renamed, notes").
  changes(x) {
    let was;
    try { was = JSON.parse(x.spawnSig); } catch { return ''; }
    const now = JSON.parse(this.sig(x));
    return Object.keys(this.CHANGE_WORDS).filter((k) => JSON.stringify(was[k]) !== JSON.stringify(now[k])).map((k) => this.CHANGE_WORDS[k]).join(', ');
  },

  nextOf(t) { return (t.spawnedNext && DB.tasks.find((x) => x.id === t.spawnedNext)) || null; },
  // Untouched = still as it was made (reminders going off, being sent to To Do and being saved don't count).
  untouched(x) { return !x.done && !!x.spawnSig && this.sig(x) === x.spawnSig; },
  sig(x) {
    const { spawnSig, todo, updated, ...rest } = x;
    return JSON.stringify({ ...rest, reminders: x.reminders.map(({ fired, ...r }) => r) });
  },
  // A new task from t: not done and not started, steps unticked, reminders ready to go off again, no To Do link;
  // `extra` on top.
  fresh(t, extra) {
    const c = normalizeTask(JSON.parse(JSON.stringify(t)));
    delete c.spawnSig;
    Object.assign(c, { id: uid(), done: false, completedAt: 0, completedAllDay: false, progress: 'not', spawnedNext: '', created: Date.now(), todo: null }, extra);
    c.checklist = c.checklist.map((s) => ({ ...s, id: uid(), done: false }));
    c.reminders = Reminders.copy(c.reminders);
    return c;
  },
  makeNext(t, doneAt) {
    if (!t.repeat || t.spawnedNext) return null;
    const index = t.seriesIndex || 1;
    if (endModeOf(t.repeat) === 'count' && index >= (t.repeat.count || 1)) return null; // that was the last one
    const due = nextDue(t, doneAt);
    if (!due) return null; // the repeat's end date has passed
    // Its own To Do task comes with it (todo: null): it must never update the previous one's.
    const copy = this.fresh(t, { due, myDay: '', seriesId: t.seriesId || t.id, seriesIndex: index + 1 });
    if (t.period && t.due) copy.period = rollPeriod(t.period, parseISO(t.due.slice(0, 10)), parseISO(due.slice(0, 10))); // the title never changes
    // An exact-time reminder moves by as many days as the due date did.
    const shiftDays = t.due ? Math.round((parseISO(due.slice(0, 10)) - parseISO(t.due.slice(0, 10))) / DAY_MS) : 0;
    copy.reminders = Reminders.copy(t.reminders, shiftDays);
    // Only 📌 kept attachments carry over (same file, shared); this-one-only files stay with this copy.
    copy.attachments = copy.attachments.filter((a) => a.keep).map((a) => ({ ...a, id: uid() }));
    if (t.start && t.due) {
      // Keep the same gap between start and due.
      const gap = Math.round((parseISO(t.due.slice(0, 10)) - parseISO(t.start)) / DAY_MS);
      copy.start = toISO(addDays(parseISO(due.slice(0, 10)), -gap));
    } else copy.start = '';
    t.seriesId = copy.seriesId;
    t.spawnedNext = copy.id;
    copy.spawnSig = this.sig(copy); // so unticking can tell whether it's been changed since
    DB.tasks.push(copy);
    return copy;
  },
};

// ===================== Recurring tasks =====================
// repeat = {
//   freq: 'daily' | 'weekdays' | 'weekly' | 'monthly' | 'yearly' | 'after',
//   interval: 1–99 (every N days/weeks/months/years; for 'after': N units after you finish),
//   days: [0–6] weekly days (0 = Sunday), unit: 'days'|'weeks'|'months' ('after' only),
//   monthMode: 'date' | 'weekday', anchorDay: 1–31, weekday: 0–6, nth: 1–4 or -1 (last),
//   until: 'YYYY-MM-DD' | ''  (no copies after this date)
// }
// anchorDay/weekday/nth are taken from the due date when you set the repeat or change the due date,
// so "the 31st" stays the 31st after a short month instead of drifting to the 28th.
const DAY_MS = 864e5;
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const ORDINALS = ['', 'first', 'second', 'third', 'fourth'];
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const weekStart = (d) => addDays(d, -d.getDay());
function addMonthsClamped(d, n, anchorDay) {
  const first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const y = first.getFullYear(), m = first.getMonth();
  return new Date(y, m, Math.min(anchorDay || d.getDate(), daysInMonth(y, m)));
}
function nthWeekday(y, m, weekday, nth) {
  if (nth === -1) {
    const last = new Date(y, m, daysInMonth(y, m));
    return addDays(last, -((last.getDay() - weekday + 7) % 7));
  }
  const first = new Date(y, m, 1);
  return addDays(first, ((weekday - first.getDay() + 7) % 7) + (nth - 1) * 7);
}

// The due date ('YYYY-MM-DDTHH:mm', same time of day) of the copy after t, or null when the repeat has ended.
function nextDue(t, doneOn = new Date()) {
  const r = t.repeat;
  if (!r) return null;
  const n = Math.min(999, Math.max(1, Math.floor(Number(r.interval)) || 1));
  const time = t.due ? t.due.slice(10) : '';
  const base = t.due ? parseISO(t.due.slice(0, 10)) : parseISO(toISO(doneOn));
  let d;
  switch (r.freq) {
    case 'daily': d = addDays(base, n); break;
    case 'weekdays':
      d = addDays(base, 1);
      while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1);
      break;
    case 'weekly': {
      const days = r.days && r.days.length ? r.days : [base.getDay()];
      const w0 = weekStart(base).getTime();
      d = addDays(base, 1);
      for (let i = 0; i < 7 * n + 7; i++, d = addDays(d, 1)) {
        const week = Math.round((weekStart(d).getTime() - w0) / (7 * DAY_MS));
        if (week % n === 0 && days.includes(d.getDay())) break;
      }
      break;
    }
    case 'monthly':
      if (r.monthMode === 'weekday') {
        const f = new Date(base.getFullYear(), base.getMonth() + n, 1);
        d = nthWeekday(f.getFullYear(), f.getMonth(), r.weekday ?? base.getDay(), r.nth || 1);
      } else d = addMonthsClamped(base, n, r.anchorDay);
      break;
    case 'yearly': d = addMonthsClamped(base, 12 * n, r.anchorDay); break;
    case 'after': {
      const from = parseISO(toISO(doneOn));
      d = r.unit === 'weeks' ? addDays(from, 7 * n) : r.unit === 'months' ? addMonthsClamped(from, n)
        : r.unit === 'years' ? addMonthsClamped(from, 12 * n) : addDays(from, n);
      break;
    }
    default: return null;
  }
  const key = toISO(d);
  if (r.until && endModeOf(r) === 'date' && key > r.until) return null;
  return key + time;
}


function repeatText(r) {
  if (!r) return '';
  const n = Math.max(1, Math.floor(Number(r.interval)) || 1);
  switch (r.freq) {
    case 'daily': return n === 1 ? 'Daily' : `Every ${n} days`;
    case 'weekdays': return 'Weekdays';
    case 'weekly': {
      const ds = [...(r.days || [])].sort().map((i) => WEEKDAYS[i].slice(0, 3)).join(', ');
      return (n === 1 ? 'Weekly' : `Every ${n} weeks`) + (ds ? ` on ${ds}` : '');
    }
    case 'monthly':
      return (n === 1 ? 'Monthly' : `Every ${n} months`) + (r.monthMode === 'weekday'
        ? ` on the ${r.nth === -1 ? 'last' : ORDINALS[r.nth]} ${WEEKDAYS[r.weekday]}`
        : r.anchorDay ? ` on day ${r.anchorDay}` : '');
    case 'yearly': return n === 1 ? 'Yearly' : `Every ${n} years`;
    case 'after': return `${n} ${r.unit || 'days'} after done`;
    default: return '';
  }
}

// How a repeat ends: 'never' | 'date' (until) | 'count' (after N copies in all). Older repeats only had `until`.
const endModeOf = (r) => r.endMode || (r.until ? 'date' : 'never');

// The repeat section of the drawer. The quick list sets the common ones; "Custom…" (and the box under
// the list) sets every N days/weeks/months/years, weekdays, monthly by date or weekday, and how it ends.
function repeatBlock(t) {
  const r = t.repeat;
  const f = r ? r.freq : '';
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(label)}</option>`;
  const simple = r && (r.interval || 1) === 1 && !(f === 'weekly' && r.days.length > 1);
  const preset = !r ? '' : simple || f === 'weekdays' || f === 'after' ? f : 'custom';
  let box = '';
  if (r && f !== 'weekdays' && f !== 'after') {
    const end = endModeOf(r);
    box = `
      <div class="repeat-box">
        <div class="row meta">Every
          <input class="num-box" type="number" min="1" max="999" data-repeat="interval" value="${r.interval || 1}" aria-label="Every how many">
          <select class="input" data-repeat="unitFreq" aria-label="Unit">${opt('daily', 'day(s)', f)}${opt('weekly', 'week(s)', f)}${opt('monthly', 'month(s)', f)}${opt('yearly', 'year(s)', f)}</select>
        </div>
        ${f === 'weekly' ? `<div class="row weekdays">${WEEKDAYS.map((w, i) => `<button class="day-btn ${r.days.includes(i) ? 'on' : ''}" data-action="repeat-day" data-weekday="${i}" title="${w}" aria-pressed="${r.days.includes(i)}">${w[0]}</button>`).join('')}</div>` : ''}
        ${f === 'monthly' && r.anchorDay ? `<select class="input" data-repeat="monthMode" aria-label="Which day">
          ${opt('date', `On day ${r.anchorDay}${r.anchorDay > 28 ? " (or the month's last day)" : ''}`, r.monthMode)}
          ${opt('weekday', `On the ${r.nth === -1 ? 'last' : ORDINALS[r.nth]} ${WEEKDAYS[r.weekday]}`, r.monthMode)}
        </select>` : ''}
      </div>`;
    box += endBlock(r, end, opt);
  } else if (r && f === 'after') {
    box = `<div class="repeat-box"><label class="row meta"><input class="num-box" type="number" min="1" max="999" data-repeat="interval" value="${r.interval || 1}" aria-label="How many">
      <select class="input" data-repeat="unit" aria-label="Unit">${opt('days', 'days', r.unit)}${opt('weeks', 'weeks', r.unit)}${opt('months', 'months', r.unit)}${opt('years', 'years', r.unit)}</select> after I tick it off</label></div>${endBlock(r, endModeOf(r), opt)}`;
  } else if (r) box = endBlock(r, endModeOf(r), opt);
  let next = '';
  if (r && !t.done) {
    const index = t.seriesIndex || 1;
    if (endModeOf(r) === 'count' && index >= (r.count || 1)) next = `This is the last one (${index} of ${r.count}).`;
    else if (f === 'after') next = `When you tick this off, the next one is due ${r.interval} ${esc(r.unit)} after that day.`;
    else {
      const nd = nextDue(t);
      next = nd ? `When you tick this off, the next one is due <b>${esc(fmtDay(nd.slice(0, 10)))}</b>${endModeOf(r) === 'count' ? ` (${index + 1} of ${r.count})` : ''}.` : 'This is the last one — the end date comes before the next repeat.';
    }
  }
  return `
    <div class="p-row">
      <span class="p-ico"><svg class="i" aria-hidden="true"><use href="#i-repeat"/></svg></span>
      <select class="p-select ${r ? 'set' : ''}" data-repeat="freq" aria-label="Repeat">
        ${opt('', r ? "Don't repeat" : 'Repeat', preset)}${opt('daily', 'Daily', preset)}${opt('weekdays', 'Weekdays (Mon–Fri)', preset)}${opt('weekly', 'Weekly', preset)}
        ${opt('monthly', 'Monthly', preset)}${opt('yearly', 'Yearly', preset)}${opt('after', 'Again after I finish it', preset)}${opt('custom', 'Custom…', preset)}
      </select>
      ${r ? '<button class="icon-btn edit-only" data-action="clear-repeat" title="Stop repeating" aria-label="Stop repeating"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>' : ''}
    </div>
    ${r || t.period ? `<div class="p-sub">
      ${box}
      ${periodField(t)}
      ${next ? `<p class="meta repeat-next">${ic('repeat', 'sm')} ${next}</p>` : ''}
    </div>` : ''}`;
}

// The moving part: typed once ("Oct 26"), shown after the title and moved forward on each repeat.
function periodField(t) {
  let shows = '';
  if (t.period) {
    const nd = t.repeat && t.due && !t.done ? nextDue(t) : null;
    const next = nd ? fullTitle({ ...t, period: rollPeriod(t.period, parseISO(taskDate(t)), parseISO(nd.slice(0, 10))) }) : '';
    shows = `Shows as <b>${esc(fullTitle(t))}</b>${next ? ` · next: <b>${esc(next)}</b>` : ''}`;
  } else shows = 'e.g. "Oct 26" (October 2026), "26 Oct", "Q3", "Week 43" or "2026". It moves forward with each repeat.';
  return `
    <label class="row meta period-row">Moving part
      <input class="input" data-field="period" value="${esc(t.period)}" placeholder="e.g. Oct 26" aria-label="Moving part" ${state.readOnly ? 'readonly' : ''}>
    </label>
    <p class="meta period-hint">${shows}</p>`;
}

function endBlock(r, end, opt) {
  return `
    <div class="row meta">Ends
      <select class="input" data-repeat="endMode" aria-label="Ends">${opt('never', 'Never', end)}${opt('date', 'On a date', end)}${opt('count', 'After a number of times', end)}</select>
      ${end === 'date' ? `<input class="input" type="date" data-repeat="until" value="${esc(r.until || '')}" aria-label="End date">` : ''}
      ${end === 'count' ? `<input class="num-box" type="number" min="1" max="999" data-repeat="count" value="${r.count || 10}" aria-label="How many times"> times` : ''}
    </div>`;
}

function setRepeat(key, value) {
  const t = currentTask();
  if (!t || state.readOnly) return;
  if (key === 'freq' || key === 'unitFreq') {
    if (!value) say(TaskEdit.setRepeat(t, null));
    else {
      const freq = value === 'custom' ? (t.repeat && t.repeat.freq !== 'weekdays' && t.repeat.freq !== 'after' ? t.repeat.freq : 'weekly') : value;
      const r = { ...(t.repeat || {}), freq }; // other settings stay when only the kind changes
      if (key === 'freq' && value !== 'custom') {
        r.interval = 1; // a quick choice means "every 1"
        if (freq === 'weekly' && r.days) r.days = r.days.slice(0, 1); // …on one day
      }
      say(TaskEdit.setRepeat(t, r));
    }
  } else if (t.repeat) {
    const r = t.repeat;
    if (key === 'interval') r.interval = Math.min(999, Math.max(1, Math.floor(Number(value)) || 1));
    else if (key === 'count') r.count = Math.min(999, Math.max(1, Math.floor(Number(value)) || 1));
    else if (key === 'endMode') {
      r.endMode = value;
      if (value !== 'date') r.until = '';
      if (value === 'count' && !r.count) r.count = 10;
    } else if (['monthMode', 'unit', 'until'].includes(key)) r[key] = value;
    else return;
  } else return;
  changed('tasks');
  render();
  renderDrawer();
}

// ----- The moving part: moves forward with each repeat -----
// "Oct 26" is October 2026 (a two-digit number right after a month is a year here); anything else moves
// like rollTitle below ("26 Oct" / "Oct 26th" are days).
function rollPeriod(p, from, to) {
  const m = p.match(new RegExp(`^(\\s*(?:${MONTH_WORD})\\.?\\s+)(\\d{2})(\\s*)$`, 'i'));
  if (!m) return rollTitle(p, from, to);
  return rollTitle(`${m[1]}'${m[2]}${m[3]}`, from, to).replace("'", '');
}

// An older repeating title with a date in it ("Aug elec bill") → { title: 'Elec bill', period: 'Aug' }.
// Takes the first date-like part, most specific kind first; nothing found → the title as it is.
function splitPeriod(title) {
  const M = MONTH_WORD;
  const kinds = [
    new RegExp(`\\b\\d{1,2}(st|nd|rd|th)?\\s+(${M})\\b\\.?(\\s+\\d{4})?\\b`, 'i'), // "5 Nov", "5th November 2026"
    new RegExp(`\\b(${M})\\.?\\s+(\\d{1,2})(st|nd|rd|th)?\\b(,?\\s+\\d{4})?`, 'i'), // "Nov 5", "November 5th, 2026"
    new RegExp(`\\b(${M})\\b\\.?(\\s*['’]?(\\d{4}|\\d{2})\\b)?`, 'i'), // "Aug", "August 2026", "Aug '26"
    /\bQ[1-4]\b(\s+\d{4})?/, // "Q3", "Q4 2026"
    /\b(week|wk)\s*\d{1,2}\b|\bW\d{1,2}\b/i, // "Week 43", "W43"
    /\b\d{1,2}(st|nd|rd|th)\b/i, // "5th"
    /\b(19|20)\d{2}\b/, // "2026"
  ];
  for (const [i, re] of kinds.entries()) {
    const m = title.match(re);
    if (!m) continue;
    if (i === 2 && m[1] === 'may' && !m[2]) continue; // "may" the verb
    let period = m[0].trim();
    // "Apr 26" stays as written (two digits after a month = the year, as in the box); "Nov 5" is a day,
    // which the box would also read as a day, but it's written "5 Nov" to be clear.
    if (i === 1 && !m[3] && !m[4] && m[2].length === 1) period = `${m[2]} ${m[1]}`;
    let rest = `${title.slice(0, m.index)} ${title.slice(m.index + m[0].length)}`
      .replace(/\s{2,}/g, ' ').replace(/^[\s–—\-:,]+|[\s–—\-:,]+$/g, '').replace(/\s+(for|on|of|in)$/i, '').trim();
    if (!rest) return { title, period: '' }; // the date was the whole title
    if (/^[A-Z]/.test(title) && /^[a-z]/.test(rest)) rest = rest[0].toUpperCase() + rest.slice(1);
    return { title: rest, period };
  }
  return { title, period: '' };
}

// ----- Dates that move forward (used for the moving part) -----
// "Aug elec bill" → "Sep elec bill", "Bill – August 2026" → "September 2026", "Q3" → "Q4",
// "Week 43" → "Week 44", "due 5th" / "5 Nov" move by the same days, a lone "2026" moves by years.
// Everything shifts by how far the due date moved, so it works for any repeat.
const MONTHS_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const ordinal = (n) => `${n}${n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th'}`;
function rollTitle(title, from, to) {
  const monthDelta = (to.getFullYear() - from.getFullYear()) * 12 + to.getMonth() - from.getMonth();
  const dayDelta = Math.round((to - from) / DAY_MS);
  if (!monthDelta && !dayDelta) return title;
  const style = (word, sample) => (sample === sample.toUpperCase() && sample.length > 1 ? word.toUpperCase()
    : sample[0] === sample[0].toLowerCase() ? word.toLowerCase() : word);
  // "Aug" → short names; "August" → full names. "May" is both, so it counts as a full name ("May" → "June").
  const isShort = (sample) => sample.replace('.', '').length <= 3 && sample.toLowerCase() !== 'may';
  const monthWord = (idx, sample) => style(isShort(sample) ? MONTHS_FULL[idx].slice(0, 3) : MONTHS_FULL[idx], sample);
  const yearText = (y, sample) => (sample.length === 2 ? String(y).slice(2) : String(y));
  // Replace only outside the parts already changed (they're wrapped in \u0001…\u0002).
  let s = title;
  const pass = (re, fn) => {
    s = s.split(/(\u0001[^\u0002]*\u0002)/).map((part) => (part.startsWith('\u0001') ? part : part.replace(re, (...m) => {
      const out = fn(...m);
      return out == null ? m[0] : `\u0001${out}\u0002`;
    }))).join('');
  };
  const M = MONTH_WORD;
  const isVerbMay = (w, hasMore) => w.toLowerCase() === 'may' && w[0] === 'm' && !hasMore; // "may" the verb
  // "5 Nov", "5th November 2026"
  pass(new RegExp(`\\b(\\d{1,2})(st|nd|rd|th)?(\\s+)(${M})(\\.?)(\\s+(\\d{4}))?\\b`, 'gi'), (all, d, suf, sp, mon, dot, ySp, y) => {
    const mi = monthIndex(mon);
    if (Number(d) < 1 || Number(d) > 31) return null;
    const nd = addDays(new Date(y ? Number(y) : from.getFullYear(), mi, Number(d)), dayDelta);
    return `${suf ? ordinal(nd.getDate()) : nd.getDate()}${sp}${monthWord(nd.getMonth(), mon)}${dot}${y ? ySp.replace(/\d+/, '') + nd.getFullYear() : ''}`;
  });
  // "Nov 5", "November 5th, 2026"
  pass(new RegExp(`\\b(${M})(\\.?)(\\s+)(\\d{1,2})(st|nd|rd|th)?\\b(,?\\s+(\\d{4}))?`, 'gi'), (all, mon, dot, sp, d, suf, ySp, y) => {
    if (Number(d) < 1 || Number(d) > 31) return null;
    const nd = addDays(new Date(y ? Number(y) : from.getFullYear(), monthIndex(mon), Number(d)), dayDelta);
    return `${monthWord(nd.getMonth(), mon)}${dot}${sp}${suf ? ordinal(nd.getDate()) : nd.getDate()}${y ? ySp.replace(/\d+/, '') + nd.getFullYear() : ''}`;
  });
  // "Aug", "August 2026", "Aug '26"
  pass(new RegExp(`\\b(${M})\\b(\\.?)(\\s*['’]?(\\d{4}|\\d{2})\\b)?`, 'gi'), (all, mon, dot, yPart, y) => {
    if (isVerbMay(mon, !!y)) return null;
    const base = (y ? (y.length === 2 ? 2000 + Number(y) : Number(y)) : from.getFullYear()) * 12 + monthIndex(mon) + monthDelta;
    const ny = Math.floor(base / 12);
    return `${monthWord(base % 12, mon)}${dot}${y ? yPart.replace(y, yearText(ny, y)) : ''}`;
  });
  // "Q3", "Q4 2026"
  pass(/\bQ([1-4])\b(\s+(\d{4}))?/g, (all, q, ySp, y) => {
    const qDelta = (to.getFullYear() * 4 + Math.floor(to.getMonth() / 3)) - (from.getFullYear() * 4 + Math.floor(from.getMonth() / 3));
    const base = (y ? Number(y) : from.getFullYear()) * 4 + Number(q) - 1 + qDelta;
    return `Q${(base % 4) + 1}${y ? ySp.replace(/\d+/, '') + Math.floor(base / 4) : ''}`;
  });
  // "Week 43", "Wk 43", "W43"
  pass(/\b(week|wk)(\s*)(\d{1,2})\b|\bW(\d{1,2})\b/gi, (all, word, sp, n, wn) => {
    const weeks = Math.round(dayDelta / 7);
    let v = Number(n || wn) + weeks;
    while (v > 52) v -= 52;
    while (v < 1) v += 52;
    return word ? `${word}${sp}${v}` : `W${v}`;
  });
  // "due 5th" (a day of the month on its own)
  pass(/\b(\d{1,2})(st|nd|rd|th)\b/gi, (all, d) => {
    if (Number(d) < 1 || Number(d) > 31) return null;
    return ordinal(addDays(new Date(from.getFullYear(), from.getMonth(), Number(d)), dayDelta).getDate());
  });
  // A year on its own: "Tax return 2026"
  pass(/\b(19|20)(\d{2})\b/g, (all) => String(Number(all) + to.getFullYear() - from.getFullYear()));
  return s.replace(/[\u0001\u0002]/g, '');
}

// Upcoming copies of repeating tasks for the calendar — shown, not saved.
// "Again after I finish it" repeats can't be known ahead, so they're estimated as if each one is done on
// its due date (from today if it's already overdue) and marked as estimates; the real copy follows the
// day you actually tick it off.
function repeatPreviews(fromKey, toKey) {
  const out = {};
  const today = todayISO();
  for (const t of DB.tasks) {
    if (t.done || !t.repeat || !t.due) continue;
    const est = t.repeat.freq === 'after';
    let cur = t;
    let index = t.seriesIndex || 1;
    for (let i = 0; i < 800; i++) {
      if (endModeOf(t.repeat) === 'count' && ++index > (t.repeat.count || 1)) break;
      const dueDay = cur.due.slice(0, 10);
      const nd = est ? nextDue(cur, parseISO(dueDay < today ? today : dueDay)) : nextDue(cur);
      if (!nd || nd.slice(0, 10) > toKey) break;
      const period = cur.period ? rollPeriod(cur.period, parseISO(cur.due.slice(0, 10)), parseISO(nd.slice(0, 10))) : '';
      cur = { ...cur, due: nd, period };
      const k = nd.slice(0, 10);
      const time = nd.slice(11, 16) === ALL_DAY ? '' : nd.slice(11, 16); // no time stays no time (not "11:59 pm")
      if (k >= fromKey) (out[k] = out[k] || []).push({ id: t.id, title: fullTitle(cur), time, kind: 'repeat', est });
    }
  }
  return out;
}

function addStep(text) {
  const t = currentTask();
  if (!t) return;
  t.checklist.push({ id: uid(), text: text.trim(), done: false });
  changed('tasks');
}

function renderCalendar() {
  const m = state.calMonth;
  const start = new Date(m.getFullYear(), m.getMonth(), 1 - m.getDay());
  const gridFrom = toISO(start);
  const gridTo = toISO(new Date(start.getFullYear(), start.getMonth(), start.getDate() + 41));
  const previews = repeatPreviews(gridFrom, gridTo);
  // "24th" in the same month, "30 Sep" across months.
  const dateLabel = (key, here) => (key.slice(0, 7) === here.slice(0, 7) ? ordinal(Number(key.slice(8)))
    : parseISO(key).toLocaleDateString([], { day: 'numeric', month: 'short' }));
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const k = toISO(d);
    const items = itemsForDay(k, previews);
    const hasLate = items.some((it) => it.status === 'overdue' || it.late);
    // A chip = the name (shortened with … when long) + a note that always stays visible.
    const chips = items.slice(0, 3).map((it) => {
      const lateId = it.late || it.kind === 'doneon' ? ` data-late="${esc(it.id)}"` : '';
      const note = it.late ? (it.lateBy >= 1 ? `done ${dateLabel(it.doneDay, k)}` : 'done late')
        : it.kind === 'doneon' ? `due ${dateLabel(it.dueDay, k)}` : '';
      // Task chips open their task when clicked; clicking anywhere else in the day opens the day.
      const opens = it.kind === 'task' || it.kind === 'doneon' || it.kind === 'repeat' ? ` data-action="open-task" data-id="${esc(it.id)}" title="Open ${esc(it.title)}"` : '';
      // The name comes first so it isn't cut short; the time is in the day panel (and the tooltip).
      const opensT = opens.replace(/ title="Open ([^"]*)"/, (m, t) => ` title="${it.time ? fmtTime(it.time) + ' ' : ''}${t}"`);
      return `<span class="chip ${chipClass(it)}"${lateId}${opensT}><span class="chip-t">${chipPrefix(it)}${esc(it.title)}</span>${note ? `<span class="chip-note">${note}</span>` : ''}</span>`;
    }).join('');
    cells.push(`
      <button class="cal-day ${d.getMonth() !== m.getMonth() ? 'other' : ''} ${k === todayISO() ? 'today' : ''} ${k === state.selectedDay ? 'selected' : ''} ${items.length ? 'has-items' : ''} ${hasLate ? 'has-late' : ''}" data-day="${k}" aria-label="${esc(fmtDay(k))}${items.length ? `, ${plural(items.length, 'item')}${hasLate ? ', something late' : ''}` : ''}">
        <span class="num">${d.getDate()}</span>${chips}${items.length > 3 ? `<span class="more">+${items.length - 3} more</span>` : ''}
      </button>`);
    // Drop the 6th row when it would only hold next month's days.
    if (i === 34 && new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getMonth() !== m.getMonth()) break;
  }
  const dows = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((d) => `<div class="cal-dow">${d}</div>`).join('');
  const sel = state.selectedDay;
  return `
    <div class="page-head"><div><h1>Calendar</h1><p class="sub">Events and task due dates</p></div></div>
    <div class="cal-layout">
      <div class="card">
        <div class="cal-head">
          <button class="btn small" data-action="cal-prev" aria-label="Previous month"><svg class="i" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
          <h2>${m.toLocaleDateString([], { month: 'long', year: 'numeric' })}</h2>
          <div class="row"><button class="btn small" data-action="cal-today">Today</button><button class="btn small" data-action="cal-next" aria-label="Next month"><svg class="i" aria-hidden="true"><use href="#i-chevron-right"/></svg></button></div>
        </div>
        <div class="cal-grid">${dows}${cells.join('')}</div>
        <div class="cal-legend desk-only">
          <span><i class="chip t-overdue">Task</i>Late</span><span><i class="chip t-today">Task</i>Due today</span>
          <span><i class="chip t-upcoming">Task</i>Coming up</span><span><i class="chip t-done"><span class="chip-t">${ic('check')} Task</span></i>Done</span>
          <span><i class="chip event">Event</i>Event</span>
          <p class="cal-legend-note">Dashed: the next repeat (≈ an estimate). A task done late shows twice: on its due day ("done 3rd") and, outlined, on the day you did it ("due 1st").</p>
        </div>
        <div class="cal-legend phone-only">
          <span><i class="cal-mark"></i>Something on that day</span><span><i class="cal-mark late"></i>Something late</span><span>Tap a day to see it</span>
        </div>
      </div>
      <div class="card">
        <h2>${fmtDay(sel)}</h2>
        <ul class="list">${itemsForDay(sel, previews).map(dayItem).join('') || '<li class="empty">Nothing scheduled</li>'}</ul>
        <form class="edit-only" data-form="add-event" style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
          <input class="input" name="title" placeholder="New event…" required autocomplete="off">
          <div class="row">
            <input class="input grow" type="date" name="date" value="${sel}" required>
            <input class="input" type="time" name="time" aria-label="Time">
          </div>
          <button class="btn primary">Add event</button>
        </form>
      </div>
    </div>`;
}

// Notifications: every message shown in the last 30 days, newest first, by day. One about a task opens it.
function renderNotices() {
  const list = [...DB.notices].sort((a, b) => b.at - a.at);
  const dayName = (k) => (k === todayISO() ? 'Today' : k === toISO(addDays(new Date(), -1)) ? 'Yesterday' : fmtDay(k));
  let lastDay = '';
  const rows = list.map((n) => {
    const k = toISO(new Date(n.at));
    const head = k !== lastDay ? `<div class="notice-day">${esc(dayName(k))}</div>` : '';
    lastDay = k;
    const task = n.task && DB.tasks.find((t) => t.id === n.task);
    const text = `<span class="notice-time">${esc(fmtTime(fmtClock(n.at)))}</span><span class="notice-text">${iconText(n.text)}</span>`;
    return head + (task
      ? `<button class="notice-row link" data-action="open-task" data-id="${esc(task.id)}" title="Open ${esc(fullTitle(task))}">${text}</button>`
      : `<div class="notice-row">${text}</div>`);
  }).join('');
  return `
    <div class="page-head">
      <div><h1>Notifications</h1><p class="sub">Every message Butler showed in the last 30 days, newest first</p></div>
      ${list.length ? '<button class="btn edit-only" data-action="clear-notices">Clear all</button>' : ''}
    </div>
    <div class="card notice-list">${rows || '<div class="empty">No notifications yet</div>'}</div>`;
}
