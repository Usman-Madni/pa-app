// ===================== Task details drawer =====================
// Rebuilt only when its structure changes (open, close, checklist, labels…) — never while you type,
// so the cursor stays put. Typing updates the task in place.
function renderDrawer() {
  const el = $('#drawer');
  const t = currentTask();
  document.body.classList.toggle('drawer-open', !!t);
  if (!t) { state.openTask = null; el.innerHTML = ''; return; }
  const ro = state.readOnly ? 'disabled' : '';
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${String(cur) === String(v) ? 'selected' : ''}>${esc(label)}</option>`;
  const doneSteps = t.checklist.filter((s) => s.done).length;
  el.innerHTML = `
    <div class="drawer-head">
      <input type="checkbox" class="check" data-action="toggle-task" data-id="${esc(t.id)}" ${t.done ? 'checked' : ''} ${ro} aria-label="Mark done">
      <input class="drawer-title" data-field="title" value="${esc(t.title)}" ${ro} aria-label="Task title">
      <button class="icon-btn" data-action="close-task" title="Close (Esc)">✕</button>
    </div>
    <fieldset class="drawer-body" ${ro}>
      <div class="row edit-only">
        <button class="btn small ${inMyDay(t) ? 'primary' : ''}" data-action="toggle-myday" data-id="${esc(t.id)}">☀ ${inMyDay(t) ? 'In My Day — remove' : 'Add to My Day'}</button>
      </div>
      <div class="field-grid">
        <label>Bucket<select class="input" data-field="bucket">${opt('', 'No bucket', t.bucket)}${sortedBuckets().map((b) => opt(b.id, b.name, t.bucket)).join('')}</select></label>
        <label>Progress<select class="input" data-field="progress">${opt('not', 'Not started', t.progress)}${opt('doing', 'In progress', t.progress)}</select></label>
        <label>Priority<select class="input" data-field="priority">${opt('low', 'Low', t.priority)}${opt('med', 'Medium', t.priority)}${opt('high', 'High', t.priority)}</select></label>
        <label>Start date<input class="input" type="date" data-field="start" value="${esc(t.start)}"></label>
        <label>Due date<input class="input" type="date" data-field="dueDate" value="${esc(taskDate(t))}"></label>
        <label>Due time ${taskTime(t) ? '' : '<span class="meta">(any time that day)</span>'}
          <span class="row" style="gap:4px;flex-wrap:nowrap">
            <input class="input" style="flex:1;min-width:0" type="time" data-field="dueTime" value="${esc(taskTime(t))}" ${t.due ? '' : 'disabled'} aria-label="Due time">
            ${taskTime(t) ? '<button type="button" class="icon-btn edit-only" data-action="clear-time" title="No time — any time that day">✕</button>' : ''}
          </span>
        </label>
      </div>
      ${reminderBlock(t)}
      ${repeatBlock(t)}
      ${labelBlock(t)}
      <h3>Checklist <span>${t.checklist.length ? `${doneSteps}/${t.checklist.length}` : ''}</span></h3>
      <ul class="steps">${t.checklist.map((s) => `
        <li class="step ${s.done ? 'done' : ''}">
          <input type="checkbox" class="check" data-action="toggle-step" data-step="${esc(s.id)}" ${s.done ? 'checked' : ''} aria-label="Step done">
          <input class="step-text" data-step-text="${esc(s.id)}" value="${esc(s.text)}" aria-label="Step">
          <button class="icon-btn edit-only" data-action="promote-step" data-step="${esc(s.id)}" title="Turn into its own task">↗</button>
          <button class="icon-btn edit-only" data-action="delete-step" data-step="${esc(s.id)}" title="Delete step">✕</button>
        </li>`).join('')}</ul>
      <form class="row edit-only" data-form="add-step"><input class="input grow" name="title" placeholder="Add a step…" autocomplete="off"><button class="btn small">Add</button></form>
      <h3>Notes</h3>
      <textarea class="input" data-field="notes" rows="6" placeholder="Details, links, phone numbers…">${esc(t.notes)}</textarea>
      ${attachBlock(t)}
    </fieldset>
    <div class="drawer-foot">
      <span class="meta">${t.created ? 'Created ' + esc(fmtStamp(t.created)) : ''}${t.done && t.completedAt ? ' · Done ' + esc(fmtStamp(t.completedAt)) : ''}</span>
      <button class="btn small danger edit-only" data-action="delete-task" data-id="${esc(t.id)}">Delete task</button>
    </div>`;
}
// Filled in by later sections (buckets/labels, recurring, attachments).
function sortedBuckets() { return [...DB.buckets].sort((a, b) => a.order - b.order); }
const fmtSize = (b) => (b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : b >= 1024 ? `${Math.round(b / 1024)} KB` : `${b || 0} B`);
const fileIcon = (a) => (/^image\//.test(a.type) ? '🖼' : /pdf/.test(a.type) || /\.pdf$/i.test(a.name) ? '📄' : '📎');

function reminderBlock(t) {
  const list = t.reminders.map((r) => `
    <li class="attach">
      <span>🔔</span><span style="flex:1;min-width:0">${esc(reminderText(t, r))}</span>
      ${r.fired ? '<span class="meta">done</span>' : ''}
      <button class="icon-btn edit-only" data-action="delete-reminder" data-rem="${esc(r.id)}" title="Remove reminder">✕</button>
    </li>`).join('');
  const c = state.remCustom;
  const custom = !c ? '' : `
    <form class="row edit-only" data-form="add-reminder" data-kind="${c}">
      ${c === 'before' ? `<input class="input num" type="number" name="n" min="1" max="999" value="30" aria-label="How many">
        <select class="input" name="unit" aria-label="Unit"><option value="1">minutes</option><option value="60">hours</option><option value="1440">days</option></select> before`
        : c === 'dayof' ? `<input class="input num" type="number" name="days" min="0" max="60" value="1" aria-label="Days before"> day(s) before, at
        <input class="input" type="time" name="time" value="21:00" required aria-label="Time">`
        : '<input class="input" type="datetime-local" name="at" required aria-label="Date and time">'}
      <button class="btn small primary">Add</button>
      <button type="button" class="icon-btn" data-action="cancel-reminder" title="Cancel">✕</button>
    </form>`;
  return `
    <h3>Reminders <span>${t.reminders.length || ''}</span></h3>
    ${list ? `<ul class="attachments">${list}</ul>` : '<p class="meta">No reminders.</p>'}
    <select class="input edit-only" data-rem-add aria-label="Add a reminder">
      <option value="">+ Add a reminder…</option>
      ${REMINDER_PRESETS.map(([k, label]) => `<option value="${k}">${esc(label)}</option>`).join('')}
      <option value="custom-before">Custom: some time before…</option>
      <option value="custom-dayof">Custom: days before, at a time…</option>
      <option value="custom-at">On a date and time…</option>
    </select>
    ${custom}`;
}

function attachBlock(t) {
  const list = t.attachments.map((a) => `
    <li class="attach">
      <span>${fileIcon(a)}</span>
      <button class="link-btn" data-action="open-attach" data-att="${esc(a.id)}" title="Open ${esc(a.name)}">${esc(a.name)}</button>
      <span class="meta">${fmtSize(a.size)}</span>
      <button class="icon-btn edit-only" data-action="remove-attach" data-att="${esc(a.id)}" title="Remove">✕</button>
    </li>`).join('');
  let action = '';
  if (!state.readOnly) {
    if (AT.status === 'ok') action = '<label class="btn small">📎 Attach files<input type="file" multiple data-input="attach" hidden></label>';
    else if (AT.status === 'reconnect') action = '<button class="btn small primary" data-action="at-reconnect">Reconnect attachments folder</button><p class="meta">Browsers ask again for folder access after a restart.</p>';
    else action = '<button class="btn small" data-action="at-folder">📁 Choose attachments folder</button><p class="meta">Pick a folder once, for example next to your data file. Files you attach are copied there; the data file only remembers which file belongs to which task.</p>';
  }
  return `
    <h3>Attachments <span>${t.attachments.length || ''}</span></h3>
    ${list ? `<ul class="attachments">${list}</ul>` : '<p class="meta">No attachments.</p>'}
    ${state.readOnly && t.attachments.length ? '<p class="meta">Attached files open on your computer only, for now.</p>' : ''}
    ${action}`;
}

function openTaskDrawer(id) {
  state.openTask = id;
  renderDrawer();
  if (!state.readOnly && !currentTask()?.title) $('#drawer .drawer-title')?.focus();
}
function closeTaskDrawer() { state.openTask = null; state.remCustom = null; renderDrawer(); }

// A field in the drawer changed (selects, dates, and title/notes when you leave them).
function setTaskField(field, value) {
  const t = currentTask();
  if (!t || state.readOnly) return;
  if (field === 'title') {
    if (!value.trim()) { renderDrawer(); return; } // never leave a task without a title
    t.title = value.trim();
  } else if (field === 'dueDate') {
    t.due = value ? `${value}T${taskTime(t) || ALL_DAY}` : '';
    field = 'due';
  } else if (field === 'dueTime') {
    if (!t.due) return;
    t.due = `${taskDate(t)}T${value || ALL_DAY}`;
    field = 'due';
  }
  else if (['bucket', 'progress', 'priority', 'start', 'notes'].includes(field)) t[field] = value;
  else return;
  afterTaskEdit(t, field);
  changed('tasks');
  render();
}
function afterTaskEdit(t, field) {
  if (field !== 'due') return;
  t.reminders.forEach((r) => { if (r.kind !== 'at') r.fired = false; }); // they count from the new due date
  syncRepeatAnchor(t);
  renderDrawer(); // date/time fields and the "next one is due…" line depend on it
}

// Ticking a repeating task off creates the next copy (once — re-ticking never makes a second).
function completeTask(t) {
  t.done = true;
  t.completedAt = Date.now();
  if (!t.repeat || t.spawnedNext) return null;
  const index = t.seriesIndex || 1;
  if (endModeOf(t.repeat) === 'count' && index >= (t.repeat.count || 1)) return null; // that was the last one
  const due = nextDue(t, new Date());
  if (!due) return null; // the repeat's end date has passed
  const copy = normalizeTask(JSON.parse(JSON.stringify(t)));
  Object.assign(copy, {
    id: uid(), due, done: false, completedAt: 0, progress: 'not', myDay: '',
    spawnedNext: '', created: Date.now(), seriesId: t.seriesId || t.id, seriesIndex: index + 1,
  });
  if (!t.repeat.keepTitle && t.due) copy.title = rollTitle(t.title, parseISO(t.due.slice(0, 10)), parseISO(due.slice(0, 10)));
  copy.checklist = copy.checklist.map((s) => ({ ...s, id: uid(), done: false }));
  // Reminders come along; an exact-time one moves by as many days as the due date did.
  const shiftDays = t.due ? Math.round((parseISO(due.slice(0, 10)) - parseISO(t.due.slice(0, 10))) / DAY_MS) : 0;
  copy.reminders = copy.reminders.map((r) => ({
    ...r, id: uid(), fired: false,
    ...(r.kind === 'at' && r.at ? { at: `${toISO(addDays(parseISO(r.at.slice(0, 10)), shiftDays))}${r.at.slice(10)}` } : {}),
  }));
  copy.attachments = copy.attachments.map((a) => ({ ...a, id: uid() })); // same files, shared
  if (t.start && t.due) {
    // Keep the same gap between start and due.
    const gap = Math.round((parseISO(t.due.slice(0, 10)) - parseISO(t.start)) / DAY_MS);
    copy.start = toISO(addDays(parseISO(due.slice(0, 10)), -gap));
  } else copy.start = '';
  t.seriesId = copy.seriesId;
  t.spawnedNext = copy.id;
  DB.tasks.push(copy);
  toast(`↻ Next one created: ${fmtDay(due.slice(0, 10))}`);
  return copy;
}

// ===================== Recurring tasks =====================
// repeat = {
//   freq: 'daily' | 'weekdays' | 'weekly' | 'monthly' | 'yearly' | 'after',
//   interval: 1–99 (every N days/weeks/months/years; for 'after': N units after you finish),
//   days: [0–6] weekly days (0 = Sunday), unit: 'days'|'weeks'|'months' ('after' only),
//   monthMode: 'date' | 'weekday', anchorDay: 1–31, weekday: 0–6, nth: 1–4 or -1 (last),
//   until: 'YYYY-MM-DD' | ''  (no copies after this date)
// }
// anchorDay/weekday/nth are taken from the due date when you set the repeat or change the due date,
// so "the 31st" stays the 31st after a short month instead of drifting to the 28th.
const DAY_MS = 864e5;
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const ORDINALS = ['', 'first', 'second', 'third', 'fourth'];
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const weekStart = (d) => addDays(d, -d.getDay());
function addMonthsClamped(d, n, anchorDay) {
  const first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const y = first.getFullYear(), m = first.getMonth();
  return new Date(y, m, Math.min(anchorDay || d.getDate(), daysInMonth(y, m)));
}
function nthWeekday(y, m, weekday, nth) {
  if (nth === -1) {
    const last = new Date(y, m, daysInMonth(y, m));
    return addDays(last, -((last.getDay() - weekday + 7) % 7));
  }
  const first = new Date(y, m, 1);
  return addDays(first, ((weekday - first.getDay() + 7) % 7) + (nth - 1) * 7);
}

// The due date ('YYYY-MM-DDTHH:mm', same time of day) of the copy after t, or null when the repeat has ended.
function nextDue(t, doneOn = new Date()) {
  const r = t.repeat;
  if (!r) return null;
  const n = Math.min(99, Math.max(1, Math.floor(Number(r.interval)) || 1));
  const time = t.due ? t.due.slice(10) : '';
  const base = t.due ? parseISO(t.due.slice(0, 10)) : parseISO(toISO(doneOn));
  let d;
  switch (r.freq) {
    case 'daily': d = addDays(base, n); break;
    case 'weekdays':
      d = addDays(base, 1);
      while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1);
      break;
    case 'weekly': {
      const days = r.days && r.days.length ? r.days : [base.getDay()];
      const w0 = weekStart(base).getTime();
      d = addDays(base, 1);
      for (let i = 0; i < 7 * n + 7; i++, d = addDays(d, 1)) {
        const week = Math.round((weekStart(d).getTime() - w0) / (7 * DAY_MS));
        if (week % n === 0 && days.includes(d.getDay())) break;
      }
      break;
    }
    case 'monthly':
      if (r.monthMode === 'weekday') {
        const f = new Date(base.getFullYear(), base.getMonth() + n, 1);
        d = nthWeekday(f.getFullYear(), f.getMonth(), r.weekday ?? base.getDay(), r.nth || 1);
      } else d = addMonthsClamped(base, n, r.anchorDay);
      break;
    case 'yearly': d = addMonthsClamped(base, 12 * n, r.anchorDay); break;
    case 'after': {
      const from = parseISO(toISO(doneOn));
      d = r.unit === 'weeks' ? addDays(from, 7 * n) : r.unit === 'months' ? addMonthsClamped(from, n) : addDays(from, n);
      break;
    }
    default: return null;
  }
  const key = toISO(d);
  if (r.until && endModeOf(r) === 'date' && key > r.until) return null;
  return key + time;
}

function syncRepeatAnchor(t) {
  const r = t.repeat;
  if (!r || !t.due) return;
  const d = parseISO(t.due.slice(0, 10));
  r.anchorDay = d.getDate();
  r.weekday = d.getDay();
  r.nth = d.getDate() + 7 > daysInMonth(d.getFullYear(), d.getMonth()) ? -1 : Math.ceil(d.getDate() / 7);
}

function repeatText(r) {
  if (!r) return '';
  const n = Math.max(1, Math.floor(Number(r.interval)) || 1);
  switch (r.freq) {
    case 'daily': return n === 1 ? 'Daily' : `Every ${n} days`;
    case 'weekdays': return 'Weekdays';
    case 'weekly': {
      const ds = [...(r.days || [])].sort().map((i) => WEEKDAYS[i].slice(0, 3)).join(', ');
      return (n === 1 ? 'Weekly' : `Every ${n} weeks`) + (ds ? ` on ${ds}` : '');
    }
    case 'monthly':
      return (n === 1 ? 'Monthly' : `Every ${n} months`) + (r.monthMode === 'weekday'
        ? ` on the ${r.nth === -1 ? 'last' : ORDINALS[r.nth]} ${WEEKDAYS[r.weekday]}`
        : r.anchorDay ? ` on day ${r.anchorDay}` : '');
    case 'yearly': return n === 1 ? 'Yearly' : `Every ${n} years`;
    case 'after': return `${n} ${r.unit || 'days'} after done`;
    default: return '';
  }
}

// How a repeat ends: 'never' | 'date' (until) | 'count' (after N copies in all). Older repeats only had `until`.
const endModeOf = (r) => r.endMode || (r.until ? 'date' : 'never');

// The repeat section of the drawer. The quick list sets the common ones; "Custom…" (and the box under
// the list) sets every N days/weeks/months/years, weekdays, monthly by date or weekday, and how it ends.
function repeatBlock(t) {
  const r = t.repeat;
  const f = r ? r.freq : '';
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(label)}</option>`;
  const simple = r && (r.interval || 1) === 1 && !(f === 'weekly' && r.days.length > 1);
  const preset = !r ? '' : simple || f === 'weekdays' || f === 'after' ? f : 'custom';
  let box = '';
  if (r && f !== 'weekdays' && f !== 'after') {
    const end = endModeOf(r);
    box = `
      <div class="repeat-box">
        <div class="row meta">Every
          <input class="input num" type="number" min="1" max="99" data-repeat="interval" value="${r.interval || 1}" aria-label="Every how many">
          <select class="input" data-repeat="unitFreq" aria-label="Unit">${opt('daily', 'day(s)', f)}${opt('weekly', 'week(s)', f)}${opt('monthly', 'month(s)', f)}${opt('yearly', 'year(s)', f)}</select>
        </div>
        ${f === 'weekly' ? `<div class="row weekdays">${WEEKDAYS.map((w, i) => `<button class="day-btn ${r.days.includes(i) ? 'on' : ''}" data-action="repeat-day" data-weekday="${i}" title="${w}" aria-pressed="${r.days.includes(i)}">${w[0]}</button>`).join('')}</div>` : ''}
        ${f === 'monthly' && r.anchorDay ? `<select class="input" data-repeat="monthMode" aria-label="Which day">
          ${opt('date', `On day ${r.anchorDay}${r.anchorDay > 28 ? " (or the month's last day)" : ''}`, r.monthMode)}
          ${opt('weekday', `On the ${r.nth === -1 ? 'last' : ORDINALS[r.nth]} ${WEEKDAYS[r.weekday]}`, r.monthMode)}
        </select>` : ''}
      </div>`;
    box += endBlock(r, end, opt);
  } else if (r && f === 'after') {
    box = `<div class="repeat-box"><label class="row meta"><input class="input num" type="number" min="1" max="99" data-repeat="interval" value="${r.interval || 1}" aria-label="How many">
      <select class="input" data-repeat="unit" aria-label="Unit">${opt('days', 'days', r.unit)}${opt('weeks', 'weeks', r.unit)}${opt('months', 'months', r.unit)}</select> after I tick it off</label></div>${endBlock(r, endModeOf(r), opt)}`;
  } else if (r) box = endBlock(r, endModeOf(r), opt);
  let next = '';
  if (r && !t.done) {
    const index = t.seriesIndex || 1;
    if (endModeOf(r) === 'count' && index >= (r.count || 1)) next = `This is the last one (${index} of ${r.count}).`;
    else if (f === 'after') next = `When you tick this off, the next one is due ${r.interval} ${esc(r.unit)} after that day.`;
    else {
      const nd = nextDue(t);
      next = nd ? `When you tick this off, the next one is due <b>${esc(fmtDay(nd.slice(0, 10)))}</b>${endModeOf(r) === 'count' ? ` (${index + 1} of ${r.count})` : ''}.` : 'This is the last one — the end date comes before the next repeat.';
    }
  }
  return `
    <h3>Repeat</h3>
    <select class="input" data-repeat="freq" aria-label="Repeat">
      ${opt('', 'Never', preset)}${opt('daily', 'Daily', preset)}${opt('weekdays', 'Weekdays (Mon–Fri)', preset)}${opt('weekly', 'Weekly', preset)}
      ${opt('monthly', 'Monthly', preset)}${opt('yearly', 'Yearly', preset)}${opt('after', 'Again after I finish it', preset)}${opt('custom', 'Custom…', preset)}
    </select>
    ${box}
    ${r ? `<label class="row meta" style="gap:6px"><input type="checkbox" data-repeat="rollTitle" ${r.keepTitle ? '' : 'checked'}> Move dates in the title forward (e.g. "Aug bill" → "Sep bill")</label>
      ${next ? `<p class="meta">↻ ${next}</p>` : ''}` : ''}`;
}

function endBlock(r, end, opt) {
  return `
    <div class="row meta">Ends
      <select class="input" data-repeat="endMode" aria-label="Ends">${opt('never', 'Never', end)}${opt('date', 'On a date', end)}${opt('count', 'After a number of times', end)}</select>
      ${end === 'date' ? `<input class="input" type="date" data-repeat="until" value="${esc(r.until || '')}" aria-label="End date">` : ''}
      ${end === 'count' ? `<input class="input num" type="number" min="1" max="999" data-repeat="count" value="${r.count || 10}" aria-label="How many times"> times` : ''}
    </div>`;
}

function setRepeat(key, value) {
  const t = currentTask();
  if (!t || state.readOnly) return;
  if (key === 'freq' || key === 'unitFreq') {
    if (!value) t.repeat = null;
    else {
      const freq = value === 'custom' ? (t.repeat && t.repeat.freq !== 'weekdays' && t.repeat.freq !== 'after' ? t.repeat.freq : 'weekly') : value;
      if (!t.due) { t.due = `${todayISO()}T${ALL_DAY}`; toast('Repeating tasks need a due date, so it is set to today — change it if you like'); }
      t.repeat = { interval: 1, days: [], monthMode: 'date', unit: 'days', until: '', ...(t.repeat || {}), freq };
      if (key === 'freq' && value !== 'custom') t.repeat.interval = 1; // a quick choice means "every 1"
      if (freq === 'weekly' && !t.repeat.days.length) t.repeat.days = [parseISO(t.due.slice(0, 10)).getDay()];
      if (freq === 'weekly' && key === 'freq' && value !== 'custom') t.repeat.days = t.repeat.days.slice(0, 1);
      syncRepeatAnchor(t);
    }
  } else if (t.repeat) {
    const r = t.repeat;
    if (key === 'interval') r.interval = Math.min(99, Math.max(1, Math.floor(Number(value)) || 1));
    else if (key === 'count') r.count = Math.min(999, Math.max(1, Math.floor(Number(value)) || 1));
    else if (key === 'endMode') {
      r.endMode = value;
      if (value !== 'date') r.until = '';
      if (value === 'count' && !r.count) r.count = 10;
    } else if (key === 'rollTitle') r.keepTitle = !value;
    else if (['monthMode', 'unit', 'until'].includes(key)) r[key] = value;
    else return;
  } else return;
  changed('tasks');
  render();
  renderDrawer();
}

// ----- Titles that move forward with each repeat -----
// "Aug elec bill" → "Sep elec bill", "Bill – August 2026" → "September 2026", "Q3" → "Q4",
// "Week 43" → "Week 44", "due 5th" / "5 Nov" move by the same days, a lone "2026" moves by years.
// Everything shifts by how far the due date moved, so it works for any repeat.
const MONTHS_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const ordinal = (n) => `${n}${n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th'}`;
function rollTitle(title, from, to) {
  const monthDelta = (to.getFullYear() - from.getFullYear()) * 12 + to.getMonth() - from.getMonth();
  const dayDelta = Math.round((to - from) / DAY_MS);
  if (!monthDelta && !dayDelta) return title;
  const style = (word, sample) => (sample === sample.toUpperCase() && sample.length > 1 ? word.toUpperCase()
    : sample[0] === sample[0].toLowerCase() ? word.toLowerCase() : word);
  // "Aug" → short names; "August" → full names. "May" is both, so it counts as a full name ("May" → "June").
  const isShort = (sample) => sample.replace('.', '').length <= 3 && sample.toLowerCase() !== 'may';
  const monthWord = (idx, sample) => style(isShort(sample) ? MONTHS_FULL[idx].slice(0, 3) : MONTHS_FULL[idx], sample);
  const yearText = (y, sample) => (sample.length === 2 ? String(y).slice(2) : String(y));
  // Replace only outside the parts already changed (they're wrapped in \u0001…\u0002).
  let s = title;
  const pass = (re, fn) => {
    s = s.split(/(\u0001[^\u0002]*\u0002)/).map((part) => (part.startsWith('\u0001') ? part : part.replace(re, (...m) => {
      const out = fn(...m);
      return out == null ? m[0] : `\u0001${out}\u0002`;
    }))).join('');
  };
  const M = MONTH_WORD;
  const isVerbMay = (w, hasMore) => w.toLowerCase() === 'may' && w[0] === 'm' && !hasMore; // "may" the verb
  // "5 Nov", "5th November 2026"
  pass(new RegExp(`\\b(\\d{1,2})(st|nd|rd|th)?(\\s+)(${M})(\\.?)(\\s+(\\d{4}))?\\b`, 'gi'), (all, d, suf, sp, mon, dot, ySp, y) => {
    const mi = monthIndex(mon);
    if (Number(d) < 1 || Number(d) > 31) return null;
    const nd = addDays(new Date(y ? Number(y) : from.getFullYear(), mi, Number(d)), dayDelta);
    return `${suf ? ordinal(nd.getDate()) : nd.getDate()}${sp}${monthWord(nd.getMonth(), mon)}${dot}${y ? ySp.replace(/\d+/, '') + nd.getFullYear() : ''}`;
  });
  // "Nov 5", "November 5th, 2026"
  pass(new RegExp(`\\b(${M})(\\.?)(\\s+)(\\d{1,2})(st|nd|rd|th)?\\b(,?\\s+(\\d{4}))?`, 'gi'), (all, mon, dot, sp, d, suf, ySp, y) => {
    if (Number(d) < 1 || Number(d) > 31) return null;
    const nd = addDays(new Date(y ? Number(y) : from.getFullYear(), monthIndex(mon), Number(d)), dayDelta);
    return `${monthWord(nd.getMonth(), mon)}${dot}${sp}${suf ? ordinal(nd.getDate()) : nd.getDate()}${y ? ySp.replace(/\d+/, '') + nd.getFullYear() : ''}`;
  });
  // "Aug", "August 2026", "Aug '26"
  pass(new RegExp(`\\b(${M})\\b(\\.?)(\\s*['’]?(\\d{4}|\\d{2})\\b)?`, 'gi'), (all, mon, dot, yPart, y) => {
    if (isVerbMay(mon, !!y)) return null;
    const base = (y ? (y.length === 2 ? 2000 + Number(y) : Number(y)) : from.getFullYear()) * 12 + monthIndex(mon) + monthDelta;
    const ny = Math.floor(base / 12);
    return `${monthWord(base % 12, mon)}${dot}${y ? yPart.replace(y, yearText(ny, y)) : ''}`;
  });
  // "Q3", "Q4 2026"
  pass(/\bQ([1-4])\b(\s+(\d{4}))?/g, (all, q, ySp, y) => {
    const qDelta = (to.getFullYear() * 4 + Math.floor(to.getMonth() / 3)) - (from.getFullYear() * 4 + Math.floor(from.getMonth() / 3));
    const base = (y ? Number(y) : from.getFullYear()) * 4 + Number(q) - 1 + qDelta;
    return `Q${(base % 4) + 1}${y ? ySp.replace(/\d+/, '') + Math.floor(base / 4) : ''}`;
  });
  // "Week 43", "Wk 43", "W43"
  pass(/\b(week|wk)(\s*)(\d{1,2})\b|\bW(\d{1,2})\b/gi, (all, word, sp, n, wn) => {
    const weeks = Math.round(dayDelta / 7);
    let v = Number(n || wn) + weeks;
    while (v > 52) v -= 52;
    while (v < 1) v += 52;
    return word ? `${word}${sp}${v}` : `W${v}`;
  });
  // "due 5th" (a day of the month on its own)
  pass(/\b(\d{1,2})(st|nd|rd|th)\b/gi, (all, d) => {
    if (Number(d) < 1 || Number(d) > 31) return null;
    return ordinal(addDays(new Date(from.getFullYear(), from.getMonth(), Number(d)), dayDelta).getDate());
  });
  // A year on its own: "Tax return 2026"
  pass(/\b(19|20)(\d{2})\b/g, (all) => String(Number(all) + to.getFullYear() - from.getFullYear()));
  return s.replace(/[\u0001\u0002]/g, '');
}

// Upcoming copies of repeating tasks for the calendar — shown, not saved.
function repeatPreviews(fromKey, toKey) {
  const out = {};
  for (const t of DB.tasks) {
    if (t.done || !t.repeat || t.repeat.freq === 'after' || !t.due) continue;
    let cur = t;
    let index = t.seriesIndex || 1;
    for (let i = 0; i < 800; i++) {
      if (endModeOf(t.repeat) === 'count' && ++index > (t.repeat.count || 1)) break;
      const nd = nextDue(cur);
      if (!nd || nd.slice(0, 10) > toKey) break;
      cur = { ...cur, due: nd };
      const k = nd.slice(0, 10);
      if (k >= fromKey) (out[k] = out[k] || []).push({ id: t.id, title: t.title, time: nd.slice(11, 16), kind: 'repeat' });
    }
  }
  return out;
}

function addStep(text) {
  const t = currentTask();
  if (!t) return;
  t.checklist.push({ id: uid(), text: text.trim(), done: false });
  changed('tasks');
}

function renderCalendar() {
  const m = state.calMonth;
  const start = new Date(m.getFullYear(), m.getMonth(), 1 - m.getDay());
  const previews = repeatPreviews(toISO(start), toISO(new Date(start.getFullYear(), start.getMonth(), start.getDate() + 41)));
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const k = toISO(d);
    const items = itemsForDay(k, previews);
    const chips = items.slice(0, 3).map((it) => `<span class="chip ${it.kind === 'task' || it.kind === 'repeat' ? it.kind : ''}">${it.kind === 'repeat' ? '↻ ' : ''}${it.time ? fmtTime(it.time) + ' ' : ''}${esc(it.title)}</span>`).join('');
    cells.push(`
      <button class="cal-day ${d.getMonth() !== m.getMonth() ? 'other' : ''} ${k === todayISO() ? 'today' : ''} ${k === state.selectedDay ? 'selected' : ''} ${items.length ? 'has-items' : ''}" data-day="${k}">
        <span class="num">${d.getDate()}</span>${chips}${items.length > 3 ? `<span class="more">+${items.length - 3} more</span>` : ''}
      </button>`);
    // Drop the 6th row when it would only hold next month's days.
    if (i === 34 && new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getMonth() !== m.getMonth()) break;
  }
  const dows = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((d) => `<div class="cal-dow">${d}</div>`).join('');
  const sel = state.selectedDay;
  return `
    <div class="page-head"><div><h1>Calendar</h1><p class="sub">Events and task due dates</p></div></div>
    <div class="cal-layout">
      <div class="card">
        <div class="cal-head">
          <button class="btn small" data-action="cal-prev" aria-label="Previous month">‹</button>
          <h2>${m.toLocaleDateString([], { month: 'long', year: 'numeric' })}</h2>
          <div class="row"><button class="btn small" data-action="cal-today">Today</button><button class="btn small" data-action="cal-next" aria-label="Next month">›</button></div>
        </div>
        <div class="cal-grid">${dows}${cells.join('')}</div>
      </div>
      <div class="card">
        <h2>${fmtDay(sel)}</h2>
        <ul class="list">${itemsForDay(sel, previews).map(dayItem).join('') || '<li class="empty">Nothing scheduled</li>'}</ul>
        <form class="edit-only" data-form="add-event" style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
          <input class="input" name="title" placeholder="New event…" required autocomplete="off">
          <div class="row">
            <input class="input grow" type="date" name="date" value="${sel}" required>
            <input class="input" type="time" name="time" aria-label="Time">
          </div>
          <button class="btn primary">Add event</button>
        </form>
      </div>
    </div>`;
}

function renderNotes() {
  const q = state.noteQuery.toLowerCase();
  const notes = [...DB.notes]
    .sort((a, b) => b.updated - a.updated)
    .filter((n) => !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q));
  if (!DB.notes.some((n) => n.id === state.activeNote)) state.activeNote = notes[0]?.id || null;
  const active = DB.notes.find((n) => n.id === state.activeNote);
  const ro = state.readOnly ? 'readonly' : '';
  return `
    <div class="page-head">
      <div><h1>Notes</h1><p class="sub">${DB.notes.length} note${DB.notes.length === 1 ? '' : 's'}${state.readOnly ? '' : ' · saved automatically'}</p></div>
      <button class="btn primary edit-only" data-action="new-note">+ New note</button>
    </div>
    <div class="notes-layout">
      <div>
        <input class="input" style="width:100%;margin-bottom:10px" placeholder="Search notes…" data-input="note-search" value="${esc(state.noteQuery)}">
        <div class="note-list">
          ${notes.map((n) => `
            <button class="note-card ${n.id === state.activeNote ? 'active' : ''}" data-note="${esc(n.id)}">
              <div class="t">${esc(n.title || 'Untitled')}</div>
              <div class="p">${esc(n.body.slice(0, 80) || 'Empty note')}</div>
            </button>`).join('') || '<div class="empty">No notes yet</div>'}
        </div>
      </div>
      <div class="card editor">
        ${active ? `
          <input class="note-title" data-input="note-title" value="${esc(active.title)}" placeholder="Title" ${ro}>
          <div class="meta"><span>Edited ${esc(fmtStamp(active.updated))}</span></div>
          <textarea data-input="note-body" placeholder="Start writing…" ${ro}>${esc(active.body)}</textarea>
          <div class="row edit-only" style="justify-content:flex-end"><button class="btn small danger" data-action="delete-note">Delete note</button></div>
        ` : `<div class="empty">${state.readOnly ? 'No notes in this file' : 'Create a note to get started'}</div>`}
      </div>
    </div>`;
}

function dataFileCard() {
  if (state.readOnly) {
    const i = RO.info;
    return `
      <h2>Data file (read-only on this device)</h2>
      <p class="sub">This browser can't save to files, so it only shows your data — it can never change it. That keeps your copies from drifting apart.</p>
      ${i ? `<p>Showing <b>${esc(i.fileName)}</b><br><span class="sub">Saved ${esc(fmtStamp(i.savedAt))} on ${esc(i.savedFrom || '?')} · opened ${esc(fmtStamp(i.openedAt))}</span></p>` : ''}
      <label class="btn primary">${i ? 'Open newer file' : 'Open data file'}<input type="file" accept=".json,application/json" data-input="ro-open" hidden></label>`;
  }
  const unsaved = device.get('unsaved', false);
  if (!DF.handle) {
    return `
      <h2>Data file</h2>
      <p class="sub">Right now your data only lives in this browser. Link a data file (for example in OneDrive) and every change saves to it automatically — 2 seconds after you stop typing.</p>
      <div class="row">
        <button class="btn primary" data-action="df-create">Create new data file</button>
        <button class="btn" data-action="df-open">Open existing data file</button>
      </div>`;
  }
  const label = { ok: unsaved ? 'Saving…' : 'Saved', reconnect: 'Waiting for permission', conflict: 'Needs a decision (see the banner at the top)', error: 'Save problem' }[DF.status] || DF.status;
  return `
    <h2>Data file</h2>
    <p><span class="status-dot ${DF.status === 'ok' ? 'on' : DF.status === 'reconnect' ? 'warn' : 'bad'}"></span><b>${esc(DF.handle.name)}</b> — ${esc(label)}</p>
    ${DF.fileInfo ? `<p class="sub">Last saved ${esc(fmtStamp(DF.fileInfo.savedAt))} on ${esc(DF.fileInfo.savedFrom || '?')}</p>` : ''}
    <div class="row">
      ${DF.status === 'reconnect' ? '<button class="btn primary" data-action="df-reconnect">Reconnect</button>' : ''}
      <button class="btn" data-action="df-open">Switch file…</button>
      <button class="btn danger" data-action="df-unlink">Unlink</button>
    </div>
    <h2 style="margin-top:18px">Daily backups</h2>
    <p class="sub">${DF.backupDir ? `Backing up to the <b>${esc(DF.backupDir.name)}</b> folder — one dated copy on the first save of each day.` : 'Pick a folder and the first save of each day also writes a dated backup there.'}</p>
    <button class="btn" data-action="df-backup-folder">${DF.backupDir ? 'Change backup folder' : 'Choose backup folder'}</button>`;
}

function renderSettings() {
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  return `
    <div class="page-head"><div><h1>Settings</h1></div></div>
    <div class="grid" style="max-width:720px">
      <div class="card" id="df-card">${dataFileCard()}</div>
      ${attachCard()}
      ${manageCard()}
      <div class="card">
        <h2>This device</h2>
        <p class="sub">Shown in the data file as who saved last. Kept on this device only.</p>
        <div class="row"><input class="input grow" data-input="device-name" value="${esc(deviceName())}" maxlength="40"></div>
      </div>
      <div class="card">
        <h2>Reminders</h2>
        <p class="sub">Desktop notifications fire while the app is open in a tab.</p>
        <p>Status: <b>${perm === 'granted' ? 'Enabled' : perm === 'denied' ? 'Blocked in browser settings' : perm === 'unsupported' ? 'Not supported in this browser' : 'Not enabled yet'}</b></p>
        <div class="row">
          ${perm === 'default' ? '<button class="btn primary" data-action="enable-notifications">Enable notifications</button>' : ''}
          <button class="btn" data-action="test-notification">Send test reminder</button>
        </div>
      </div>
      <div class="card edit-only">
        <h2>Manual backup</h2>
        <p class="sub">An extra copy you control. Importing replaces everything in this browser (and then the data file).</p>
        <div class="row">
          <button class="btn" data-action="export">⬇ Export backup</button>
          <label class="btn">⬆ Import backup<input type="file" accept="application/json" data-input="import" hidden></label>
        </div>
      </div>
    </div>`;
}

// ===================== Actions =====================
function setView(view) {
  state.view = view;
  device.set('view', view);
  render();
  try { window.scrollTo(0, 0); } catch { /* not available in tests */ }
}

function addTask(data) {
  // A new task lands in the bucket/label you're currently looking at, so it doesn't vanish from view.
  const filterBucket = state.taskBucket && state.taskBucket !== '-' ? state.taskBucket : '';
  const t = normalizeTask({
    id: uid(),
    title: data.title.trim(),
    due: data.due || '',
    priority: data.priority || 'low',
    reminders: Array.isArray(data.reminders) ? data.reminders : [],
    created: Date.now(),
    myDay: data.myDay || '',
    bucket: data.bucket != null ? data.bucket : state.view === 'tasks' ? filterBucket : '',
    labels: state.view === 'tasks' && state.taskLabel ? [state.taskLabel] : [],
  });
  DB.tasks.push(t);
  changed('tasks');
  if (t.reminders.length) askNotifications();
  return t;
}

function addEvent(data) {
  DB.events.push({ id: uid(), title: data.title.trim(), date: data.date, time: data.time || '' });
  changed('events');
  state.selectedDay = data.date;
  const d = parseISO(data.date);
  if (d.getMonth() !== state.calMonth.getMonth() || d.getFullYear() !== state.calMonth.getFullYear()) state.calMonth = monthStart(d);
}

function newNote() {
  const n = { id: uid(), title: '', body: '', updated: Date.now() };
  DB.notes.push(n);
  state.activeNote = n.id;
  state.noteQuery = '';
  changed('notes');
  render();
  $('[data-input="note-title"]')?.focus();
}

function exportData() {
  const payload = { app: 'PA App', version: 2, savedAt: new Date().toISOString(), savedFrom: deviceName(), data: DB.exportAll() };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' }));
  a.download = `PA App Export ${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function importData(file) {
  try {
    const parsed = JSON.parse(await file.text());
    const data = parsed.app === 'PA App' ? parsed.data : parsed; // older exports were the bare data
    if (!data || !REQUIRED_KEYS.every((k) => Array.isArray(data[k]))) throw new Error();
    if (!confirm(`Replace everything here with ${data.tasks.length} tasks, ${data.notes.length} notes and ${data.events.length} events?`)) return;
    DB.importAll(data);
    changed(...DATA_KEYS);
    toast('Backup imported');
    render();
  } catch {
    toast('That file is not a valid PA App backup');
  }
}

function cycleTheme() {
  const order = ['auto', 'dark', 'light'];
  const next = order[(order.indexOf(device.get('theme', 'auto')) + 1) % order.length];
  device.set('theme', next);
  applyTheme();
  renderStatus();
}
function applyTheme() {
  const t = device.get('theme', 'auto');
  if (t === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
}

// ===================== Reminders =====================
function askNotifications() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission().then(() => state.view === 'settings' && render());
  }
}

function notify(title, body) {
  toast(`🔔 ${title}${body ? ' — ' + body : ''}`);
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification(title, { body, tag: title }); } catch { /* some browsers need a service worker; the toast already showed */ }
  }
}

function checkReminders() {
  const now = Date.now();
  let changedAny = false;
  for (const t of DB.tasks) {
    if (t.done) continue;
    for (const r of t.reminders) {
      const key = `${t.id}:${r.id}`;
      if (r.fired || state.remindedHere.has(key)) continue;
      const at = reminderTime(t, r);
      if (at == null || now < at) continue;
      const when = t.due ? `Due ${taskDate(t) === todayISO() ? 'today' : fmtDay(taskDate(t))}${taskTime(t) ? ' at ' + fmtTime(taskTime(t)) : ''}` : 'Reminder';
      notify(t.title, when);
      if (state.readOnly) state.remindedHere.add(key);
      else { r.fired = true; changedAny = true; }
    }
  }
  if (changedAny) {
    changed('tasks');
    if (['today', 'tasks'].includes(state.view)) render();
  }
}

// ===================== Events =====================
const EDIT_ACTIONS = new Set([
  'toggle-task', 'delete-task', 'clear-done', 'delete-event', 'new-note', 'delete-note',
  'toggle-myday', 'toggle-step', 'delete-step', 'promote-step',
  'toggle-label', 'rename-bucket', 'delete-bucket', 'bucket-left', 'bucket-right', 'rename-label', 'delete-label',
  'repeat-day', 'at-folder', 'at-reconnect', 'remove-attach', 'board-add', 'delete-reminder', 'clear-time',
]);

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-view]');
  if (nav) return setView(nav.dataset.view);
  const go = e.target.closest('[data-goto]');
  if (go) return setView(go.dataset.goto);

  const filter = e.target.closest('[data-filter]');
  if (filter) { state.taskFilter = filter.dataset.filter; return render(); }

  const day = e.target.closest('[data-day]');
  if (day) {
    state.selectedDay = day.dataset.day;
    const d = parseISO(day.dataset.day);
    if (d.getMonth() !== state.calMonth.getMonth()) state.calMonth = monthStart(d);
    return render();
  }

  const note = e.target.closest('[data-note]');
  if (note) { state.activeNote = note.dataset.note; return render(); }

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if (state.readOnly && EDIT_ACTIONS.has(action)) { e.preventDefault(); return toast('Read-only on this device'); }
  switch (action) {
    case 'toggle-task': {
      const t = DB.tasks.find((x) => x.id === id);
      if (t) {
        if (t.done) { t.done = false; t.completedAt = 0; } else completeTask(t);
        changed('tasks');
      }
      setTimeout(() => { render(); renderDrawer(); }, 150); // let the tick show before the list re-sorts
      break;
    }
    case 'delete-task': {
      const t = DB.tasks.find((x) => x.id === id);
      if (!t) break;
      const rich = t.notes.trim() || t.checklist.length || t.attachments.length;
      if (rich && !confirm(`Delete "${t.title}"? Its notes and checklist go too${t.attachments.length ? '; attached files stay in your attachments folder' : ''}.`)) break;
      DB.tasks = DB.tasks.filter((x) => x.id !== id);
      changed('tasks');
      if (state.openTask === id) closeTaskDrawer();
      render();
      break;
    }
    case 'open-task': openTaskDrawer(id); break;
    case 'layout': device.set('taskLayout', btn.dataset.layout); render(); break;
    case 'board-add':
      state.boardAdd = btn.dataset.bucket;
      render();
      $(`#main form[data-key="col-${CSS.escape(state.boardAdd)}"] [name="title"]`)?.focus();
      break;
    case 'board-add-cancel': state.boardAdd = null; render(); break;
    case 'delete-reminder': {
      const t = currentTask();
      if (t) { t.reminders = t.reminders.filter((r) => r.id !== btn.dataset.rem); changed('tasks'); render(); renderDrawer(); }
      break;
    }
    case 'cancel-reminder': state.remCustom = null; renderDrawer(); break;
    case 'clear-time': {
      const t = currentTask();
      if (t && t.due) { t.due = `${taskDate(t)}T${ALL_DAY}`; afterTaskEdit(t, 'due'); changed('tasks'); render(); }
      break;
    }
    case 'qa-raw': {
      const form = btn.closest('form');
      form.dataset.raw = form.dataset.raw === '1' ? '' : '1';
      updateQuickPreview(form);
      form.elements.title.focus();
      break;
    }
    case 'qa-pick': {
      const input = btn.parentElement.querySelector('.qa-native');
      try { input.showPicker(); } catch { input.focus(); input.click(); }
      break;
    }
    case 'at-folder': AT.pickFolder(); break;
    case 'at-reconnect': AT.reconnect(); break;
    case 'open-attach': { const t = currentTask(); const a = t && t.attachments.find((x) => x.id === btn.dataset.att); if (a) AT.open(a); break; }
    case 'remove-attach': AT.remove(currentTask(), btn.dataset.att); break;
    case 'repeat-day': {
      const t = currentTask();
      const day = Number(btn.dataset.weekday);
      if (!t || !t.repeat) break;
      const days = t.repeat.days.includes(day) ? t.repeat.days.filter((x) => x !== day) : [...t.repeat.days, day];
      if (!days.length) { toast('Pick at least one day'); break; }
      t.repeat.days = days.sort();
      changed('tasks'); render(); renderDrawer();
      break;
    }
    case 'toggle-label': {
      const t = currentTask();
      const l = btn.dataset.label;
      if (!t) break;
      t.labels = t.labels.includes(l) ? t.labels.filter((x) => x !== l) : [...t.labels, l];
      changed('tasks'); render(); renderDrawer();
      break;
    }
    case 'rename-bucket': renameBucket(id); render(); renderDrawer(); break;
    case 'delete-bucket': deleteBucket(id); render(); renderDrawer(); break;
    case 'bucket-left': moveBucket(id, -1); render(); break;
    case 'bucket-right': moveBucket(id, 1); render(); break;
    case 'rename-label': renameLabel(id); render(); renderDrawer(); break;
    case 'delete-label': deleteLabel(id); render(); renderDrawer(); break;
    case 'close-task': closeTaskDrawer(); break;
    case 'toggle-myday': {
      const t = currentTask();
      if (t) { t.myDay = inMyDay(t) ? '' : todayISO(); changed('tasks'); render(); renderDrawer(); }
      break;
    }
    case 'toggle-step': case 'delete-step': case 'promote-step': {
      const t = currentTask();
      const s = t && t.checklist.find((x) => x.id === btn.dataset.step);
      if (!s) break;
      if (action === 'toggle-step') s.done = !s.done;
      else {
        t.checklist = t.checklist.filter((x) => x !== s);
        if (action === 'promote-step') {
          addTask({ title: s.text || 'Untitled step', bucket: t.bucket });
          toast('Step turned into its own task');
        }
      }
      changed('tasks');
      render();
      renderDrawer();
      break;
    }
    case 'clear-done': DB.tasks = DB.tasks.filter((x) => !x.done); changed('tasks'); render(); break;
    case 'delete-event': DB.events = DB.events.filter((x) => x.id !== id); changed('events'); render(); break;
    case 'cal-prev': state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() - 1, 1); render(); break;
    case 'cal-next': state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + 1, 1); render(); break;
    case 'cal-today': state.calMonth = monthStart(new Date()); state.selectedDay = todayISO(); render(); break;
    case 'new-note': newNote(); break;
    case 'delete-note':
      if (confirm('Delete this note?')) {
        DB.notes = DB.notes.filter((n) => n.id !== state.activeNote);
        state.activeNote = null;
        changed('notes');
        render();
      }
      break;
    case 'df-create': DF.createNew().then(render); break;
    case 'df-open': DF.openExisting().then(render); break;
    case 'df-unlink': if (confirm('Stop saving to this data file? The file itself is kept.')) DF.unlink(); break;
    case 'df-reconnect': DF.reconnect().then(render); break;
    case 'df-retry': DF.status = 'ok'; DF.save(); break;
    case 'df-keep-mine': DF.keepMine(); break;
    case 'df-use-theirs': DF.useTheirs(); break;
    case 'df-backup-folder': DF.pickBackupFolder(); break;
    case 'cycle-theme': cycleTheme(); break;
    case 'enable-notifications': askNotifications(); break;
    case 'test-notification': askNotifications(); notify('Test reminder', 'Reminders are working'); break;
    case 'export': exportData(); break;
  }
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  if (state.readOnly) return toast('Read-only on this device');
  const data = Object.fromEntries(new FormData(form));
  if (form.dataset.form === 'add-reminder') {
    const t = currentTask();
    const k = form.dataset.kind;
    const r = k === 'before' ? { kind: 'before', minutes: Math.max(1, Number(data.n) || 1) * Number(data.unit || 1) }
      : k === 'dayof' ? { kind: 'dayof', daysBefore: Math.max(0, Number(data.days) || 0), time: data.time || '09:00' }
      : { kind: 'at', at: data.at };
    if (k === 'at' && !data.at) return;
    if (t && addReminder(t, { id: uid(), ...r, fired: false })) { state.remCustom = null; changed('tasks'); render(); }
    renderDrawer();
    return;
  }
  if (!data.title || !data.title.trim()) return;
  const kind = form.dataset.form;
  const inDrawer = !!form.closest('#drawer');
  if (kind === 'quick-add') {
    quickAdd(form);
    const key = form.dataset.key;
    render();
    const again = $(`#main form[data-key="${CSS.escape(key)}"] [name="title"]`);
    if (again) again.focus(); // ready for the next one
    return;
  }
  if (kind === 'add-task') addTask(data);
  else if (kind === 'add-event') addEvent(data);
  else if (kind === 'add-step') addStep(data.title);
  else if (kind === 'add-bucket') addBucket(data.title);
  else if (kind === 'add-label') addLabel(data.title, data.color, inDrawer ? currentTask() : null);
  render();
  if (inDrawer) { renderDrawer(); $(`#drawer [data-form="${kind}"] [name="title"]`)?.focus(); }
  else {
    const where = form.dataset.bucket != null ? `[data-bucket="${CSS.escape(form.dataset.bucket)}"]` : '';
    $(`#main [data-form="${kind}"]${where} [name="title"]`)?.focus();
  }
});

// Typing in the drawer: update the task straight away, save shortly after you pause.
let taskTimer;
document.addEventListener('input', (e) => {
  const t = currentTask();
  if (!t || state.readOnly || !e.target.closest('#drawer')) return;
  const field = e.target.dataset.field;
  const stepId = e.target.dataset.stepText;
  if (field === 'notes') t.notes = e.target.value;
  else if (field === 'title') { if (!e.target.value.trim()) return; t.title = e.target.value; }
  else if (stepId) { const s = t.checklist.find((x) => x.id === stepId); if (!s) return; s.text = e.target.value; }
  else return;
  clearTimeout(taskTimer);
  taskTimer = setTimeout(() => { changed('tasks'); render(); }, 400);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (state.boardAdd !== null && e.target.closest?.('.add-card')) { state.boardAdd = null; render(); return; }
  if (state.openTask) closeTaskDrawer();
});
// Quick add: preview what was understood as you type or pick.
document.addEventListener('input', (e) => {
  if (e.target.matches?.('[data-qa]')) updateQuickPreview(e.target.form);
});
document.addEventListener('change', (e) => {
  if (e.target.matches?.('[data-qa-tool]')) updateQuickPreview(e.target.form);
});

// Board drag and drop (computer only; phones are read-only).
document.addEventListener('dragstart', (e) => {
  const card = e.target.closest?.('[data-card]');
  if (!card || state.readOnly) return;
  e.dataTransfer.setData('text/plain', card.dataset.card);
  e.dataTransfer.effectAllowed = 'move';
  card.classList.add('dragging');
});
document.addEventListener('dragend', () => $$('.dragging, .board-col.over').forEach((x) => x.classList.remove('dragging', 'over')));
document.addEventListener('dragover', (e) => {
  const col = e.target.closest?.('[data-bucket-col]');
  if (!col || state.readOnly) return;
  e.preventDefault();
  $$('.board-col.over').forEach((x) => x !== col && x.classList.remove('over'));
  col.classList.add('over');
});
document.addEventListener('drop', (e) => {
  const col = e.target.closest?.('[data-bucket-col]');
  if (!col || state.readOnly) return;
  e.preventDefault();
  moveTaskToBucket(e.dataTransfer.getData('text/plain'), col.dataset.bucketCol);
});

let noteTimer;
document.addEventListener('input', (e) => {
  const kind = e.target.dataset?.input;
  if (!kind) return;
  if (kind === 'note-search') {
    state.noteQuery = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const input = $('[data-input="note-search"]');
    input.focus();
    input.setSelectionRange(pos, pos);
    return;
  }
  if (kind === 'device-name') { device.set('name', e.target.value.trim() || 'Computer'); return; }
  if (kind === 'task-bucket') { state.taskBucket = e.target.value; render(); return; }
  if (kind === 'task-label') { state.taskLabel = e.target.value; render(); return; }
  if (state.readOnly) return;
  const n = DB.notes.find((x) => x.id === state.activeNote);
  if (!n || (kind !== 'note-title' && kind !== 'note-body')) return;
  if (kind === 'note-title') n.title = e.target.value;
  else n.body = e.target.value;
  n.updated = Date.now();
  // Update the list preview in place so typing never loses focus.
  const card = $(`[data-note="${CSS.escape(n.id)}"]`);
  if (card) {
    $('.t', card).textContent = n.title || 'Untitled';
    $('.p', card).textContent = n.body.slice(0, 80) || 'Empty note';
  }
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => changed('notes'), 300);
});

document.addEventListener('change', (e) => {
  if (e.target.dataset?.field && e.target.closest('#drawer')) return setTaskField(e.target.dataset.field, e.target.value);
  if (e.target.dataset?.repeat && e.target.closest('#drawer')) return setRepeat(e.target.dataset.repeat, e.target.type === 'checkbox' ? e.target.checked : e.target.value);
  if (e.target.matches?.('[data-rem-add]') && !state.readOnly) {
    const t = currentTask();
    const v = e.target.value;
    if (!t || !v) return;
    if (v.startsWith('custom-')) { state.remCustom = v.slice(7); renderDrawer(); return; }
    if (addReminder(t, presetReminder(v))) { changed('tasks'); render(); }
    renderDrawer();
    return;
  }
  if (e.target.dataset?.labelColor && !state.readOnly) {
    const l = DB.labels.find((x) => x.id === e.target.dataset.labelColor);
    if (l) { l.color = e.target.value; changed('labels'); render(); }
    return;
  }
  const kind = e.target.dataset?.input;
  const file = e.target.files?.[0];
  if (!file) return;
  if (kind === 'import') importData(file);
  if (kind === 'attach') AT.add(currentTask(), [...e.target.files]);
  if (kind === 'ro-open') RO.open(file);
  e.target.value = '';
});

// Before the tab closes, push any typed-but-not-yet-saved note into the browser store.
window.addEventListener('beforeunload', () => { if (!state.readOnly) DB.persist('notes'); });
// Coming back to the tab: see if another device saved meanwhile.
document.addEventListener('visibilitychange', () => { if (!document.hidden && DF.status === 'ok') DF.check(); });

// ===================== Start =====================
applyTheme();
if (state.readOnly) RO.boot(); else DB.load();
render();
DF.init();
AT.init();
checkReminders();
setInterval(checkReminders, 20000);
setInterval(() => { if (DF.status === 'ok' && !document.hidden && !DF.saving) DF.check(); }, DF.POLL_MS);
setInterval(() => { if (state.view === 'today' && !document.querySelector(':focus')) render(); }, 60000);

// For tests and debugging in the console.
window.PA = { DB, DF, RO, AT, state, device, render, renderDrawer, checkReminders, uid, toISO, normalizeTask, completeTask, addTask, moveTaskToBucket, nextDue, repeatText, rollTitle };
</script>
</body>
</html>
