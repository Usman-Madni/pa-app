# Butler's Android app, built in the cloud: nothing to install on the laptop.
# The Android project is made fresh each time from android-app/ (Capacitor), signed with the key kept in this repo's
# secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD), and published as Butler.apk on the "android" release.
# The app opens the live site, so ordinary pushes update Butler without a new APK; this runs only when the shell changes.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
      - 'icon-maskable.svg'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor
        run: npm install --no-audit --no-fund

      - name: Android project
        run: npx cap add android

      - name: App icon (from icon-maskable.svg)
        run: |
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 ../icon-maskable.svg -o assets/icon-only.png
          rsvg-convert -w 1024 -h 1024 ../icon-maskable.svg -o assets/icon-foreground.png
          rsvg-convert -w 1024 -h 1024 ../icon-maskable.svg -o assets/icon-background.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#0f5c57' --iconBackgroundColorDark '#0f5c57' --splashBackgroundColor '#0f5c57' --splashBackgroundColorDark '#0f5c57'

      - name: Sync
        run: npx cap sync android

      - name: Version (one up each build, so an update installs over the last)
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD --out Butler.apk aligned.apk
          rm release.p12
          "$BT/apksigner" verify Butler.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android Butler.apk --title "Butler for Android" --notes "Open this page on the phone, download Butler.apk and open it. The first time, Android asks to allow installing apps from Chrome (or My Files). Installing a newer one keeps your sign-in."
