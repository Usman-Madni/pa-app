# Butler's Android app, built in the cloud: nothing to install on the laptop.
# The Android project is made fresh each time from android-app/ (Capacitor), signed with the key kept in this repo's
# secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD), and published as Butler.apk on the "android" release.
# The app opens the live site, so ordinary pushes update Butler without a new APK; this runs only when the shell changes.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
      - 'icon-maskable.svg'
    # (android-app/** covers the sound script and the status-bar icon too)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor
        run: npm install --no-audit --no-fund

      - name: Android project
        run: npx cap add android

      - name: App icon (from icon-maskable.svg)
        run: |
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 ../icon-maskable.svg -o assets/icon-only.png
          rsvg-convert -w 1024 -h 1024 ../icon-maskable.svg -o assets/icon-foreground.png
          rsvg-convert -w 1024 -h 1024 ../icon-maskable.svg -o assets/icon-background.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#0f5c57' --iconBackgroundColorDark '#0f5c57' --splashBackgroundColor '#0f5c57' --splashBackgroundColorDark '#0f5c57'

      # Butler's own Android pieces in res/ (status-bar bell, widget layouts, colours light and dark, widget info),
      # and the reminder sound, made here.
      - name: Butler's resources and reminder sound
        run: |
          mkdir -p android/app/src/main/res/raw
          cp -r res/. android/app/src/main/res/
          node make-sound.js android/app/src/main/res/raw/butler_ring.wav

      - name: Sync
        run: npx cap sync android

      # The background check's JavaScript engine comes as a file inside its plugin; the app's build looks for it in
      # its own libs folder.
      - name: Background check engine
        run: |
          mkdir -p android/app/libs
          AAR=$(find node_modules/@capacitor/background-runner -name 'android-js-engine-release.aar' | head -1)
          test -n "$AAR" || { echo "android-js-engine-release.aar not found in the plugin"; find node_modules/@capacitor/background-runner -name '*.aar'; exit 1; }
          cp "$AAR" android/app/libs/
          ls -l android/app/libs

      # Reminders ring on the minute (Android otherwise lets them drift). USE_EXACT_ALARM is granted on Android 13+
      # for apps whose job is reminders; SCHEDULE_EXACT_ALARM covers Android 12.
      - name: Exact reminders
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -E "EXACT_ALARM|BOOT_COMPLETED" android/app/src/main/AndroidManifest.xml

      # Microsoft's sign-in comes back to app.butler.home://auth (registered in Azure as a mobile app), and a widget
      # opens app.butler.home://open?…: Android hands those addresses to Butler. Added to the app's main screen.
      - name: Sign-in return address and widget links
        run: |
          sed -i '0,/<\/activity>/s#</activity>#    <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="app.butler.home" android:host="auth" />\n                <data android:scheme="app.butler.home" android:host="open" />\n            </intent-filter>\n        </activity>#' android/app/src/main/AndroidManifest.xml
          grep -n "app.butler.home" android/app/src/main/AndroidManifest.xml

      # Share › Butler: Butler is offered in Android's share sheet for any file(s) or words (round 4), and the main
      # screen hands a share that started the app to the plugins (android-app/native/MainActivity.java).
      - name: Share to Butler
        run: |
          sed -i '0,/<\/activity>/s#</activity>#    <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="*/*" />\n            </intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.SEND_MULTIPLE" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="*/*" />\n            </intent-filter>\n        </activity>#' android/app/src/main/AndroidManifest.xml
          grep -c "android.intent.action.SEND" android/app/src/main/AndroidManifest.xml

      # Butler's own Java (android-app/native/): the main screen (over the generated one), the widgets and their
      # plugin, and the widgets' entries in the manifest.
      - name: Butler's native code and widgets
        run: |
          cp native/*.java android/app/src/main/java/app/butler/home/
          awk -v f=native/manifest-widgets.xml '/<\/application>/ { while ((getline line < f) > 0) print line } { print }' android/app/src/main/AndroidManifest.xml > manifest.tmp
          mv manifest.tmp android/app/src/main/AndroidManifest.xml
          grep -n "Widget\|ListConfig" android/app/src/main/AndroidManifest.xml

      - name: Version (one up each build, so an update installs over the last)
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build
        working-directory: android-app/android
        # Maven Central sometimes turns a busy GitHub machine away ("Too Many Requests"): wait and try once more.
        run: ./gradlew assembleRelease --no-daemon || (sleep 90 && ./gradlew assembleRelease --no-daemon)

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD --out Butler.apk aligned.apk
          rm release.p12
          "$BT/apksigner" verify Butler.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android Butler.apk --title "Butler for Android" --notes "Open this page on the phone, download Butler.apk and open it. The first time, Android asks to allow installing apps from Chrome (or My Files). Installing a newer one keeps your sign-in."
