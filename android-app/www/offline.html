<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Butler</title>
<style>
  :root { --bg: #f6f2ea; --text: #1d2524; --muted: #5d6664; --accent: #0f5c57; --accent-ink: #fbf8f2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12211f; --text: #ece8df; --muted: #a9b3b0; --accent: #6cc3ba; --accent-ink: #12211f; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  h1 { font: 600 1.6rem Georgia, "Times New Roman", serif; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; max-width: 32ch; }
  button { font: inherit; font-weight: 600; padding: 10px 22px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
</style>
</head>
<body>
<main>
  <h1>Butler can't open yet</h1>
  <p>The phone has no connection, and Butler hasn't been opened here with one before. Once it has, it opens without one.</p>
  <button type="button" onclick="location.href='https://usman-madni.github.io/pa-app/'">Try again</button>
</main>
</body>
</html>
