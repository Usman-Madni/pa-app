<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PA App</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7fb; color: #1c2030; }
  @media (prefers-color-scheme: dark) { body { background: #11131a; color: #e8eaf2; } }
  a { color: #4f46e5; }
</style>
</head>
<body>
<p id="msg"><a href="PA%20App.html">Open PA App</a></p>
<script>
'use strict';
// The folder's own page. Microsoft returns here after signing in (Azure won't take "PA%20App.html" as a return
// address). Opened by PA App for that, it hands the answer back with a message and closes: on a phone the PA App tab
// is paused meanwhile, so it can't watch this page's address. Opened on its own, it opens PA App.
const q = location.search;
if (window.opener && /[?&](code|error)=/.test(q)) {
  try { window.opener.postMessage({ paSignIn: q }, location.origin); } catch { /* PA App was closed */ }
  document.getElementById('msg').textContent = 'Signed in — going back to PA App…';
  window.close();
} else {
  location.replace('PA%20App.html' + location.hash);
}
</script>
</body>
</html>
